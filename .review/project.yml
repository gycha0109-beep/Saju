schema_version: "1.0"
project:
  id: myeonghwa
  name: Myeonghwa Saju Engine
  type: domain-engine
  repository_root: "."
  baseline_branch: main
technology:
  languages: [typescript]
  frameworks: []
scope:
  include:
    - "src/**"
    - "test/**"
    - "docs/**"
    - "package*.json"
    - "tsconfig*.json"
    - "eslint.config.*"
    - ".review/**"
    - ".github/workflows/**"
  exclude:
    - "node_modules/**"
    - "dist/**"
    - "build/**"
    - "coverage/**"
    - ".pie/**"
protected_paths: []
commands:
  baseline: []
  integration: []
review:
  packs:
    - universal.architecture
    - universal.requirements-traceability
    - universal.test-completeness
    - domain.ai-inference
gate:
  block_on: [P0, P1]
  require:
    baseline_tests: false
    regression_tests: false
constraints:
  production_changes_allowed: false
  hosted_database_changes_allowed: false
  external_network_allowed: false
