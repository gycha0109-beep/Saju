schema_version: "1.0"
graph:
  max_file_size_bytes: 1000000
components:
  - id: engine
    name: Myeonghwa Engine
    paths: ["src/**"]
  - id: tests
    name: Engine Tests
    paths: ["test/**"]
  - id: documentation
    name: Architecture and Research Documentation
    paths: ["docs/**"]
  - id: toolchain
    name: Toolchain Configuration
    paths: ["package*.json", "tsconfig*.json", "eslint.config.*"]
  - id: pie-config
    name: PIE Project Configuration
    paths: [".review/**"]
  - id: github-workflows
    name: GitHub Workflows
    paths: [".github/workflows/**"]
