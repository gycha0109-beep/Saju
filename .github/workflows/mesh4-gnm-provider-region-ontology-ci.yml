name: MESH4 GNM Provider Region Ontology CI

on:
  pull_request:
    paths:
      - '.github/workflows/mesh4-gnm-provider-region-ontology-ci.yml'
      - 'packages/face-geometry/**'
      - 'scripts/verify-face-geometry-mesh4.mjs'
      - 'tools/face-geometry/gnm/**'
  workflow_dispatch:

jobs:
  verify-gnm-provider-region-ontology:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify repository contract
        run: node scripts/verify-face-geometry-mesh4.mjs
      - name: Install exporter dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Compile Python tooling
        run: |
          python -m py_compile \
            tools/face-geometry/gnm/fetch_gnm_head.py \
            tools/face-geometry/gnm/export_gnm_template_head.py \
            tools/face-geometry/gnm/export_gnm_region_ontology.py \
            tools/face-geometry/gnm/build_gnm_region_ontology_scene.py
      - name: Fetch and verify exact GNM Head asset
        run: |
          python tools/face-geometry/gnm/fetch_gnm_head.py \
            --output /tmp/gnm_head.npz
      - name: Export neutral GNM full-head OBJ
        run: |
          python tools/face-geometry/gnm/export_gnm_template_head.py \
            --npz /tmp/gnm_head.npz \
            --obj-out /tmp/gnm-head-neutral.obj \
            --regions-out /tmp/gnm-head-ear-regions.json \
            --metadata-out /tmp/gnm-head-export-metadata.json
      - name: Export shared provider-region ontology masks
        run: |
          python tools/face-geometry/gnm/export_gnm_region_ontology.py \
            --npz /tmp/gnm_head.npz \
            --output /tmp/gnm-provider-region-ontology.json
      - name: Verify compiled ontology
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/gnm-provider-region-ontology.json').read_text())
          assert payload['regionCount'] == 22
          assert payload['vertexCount'] == 17821
          assert payload['policy']['productNeutral'] is True
          assert payload['policy']['runtimeGNMDependency'] is False
          assert payload['policy']['runtimeBlenderDependency'] is False
          assert payload['policy']['productInterpretationIncluded'] is False
          ids = {region['id'] for region in payload['regions']}
          assert {'forehead', 'left_zygomatic', 'right_zygomatic', 'left_cheek', 'right_cheek', 'chin', 'left_ear', 'right_ear'} <= ids
          assert all(region['vertexCount'] > 0 for region in payload['regions'])
          assert len(payload['bilateralPairs']) == 8
          print(json.dumps({
              'regionCount': payload['regionCount'],
              'bilateralPairs': payload['bilateralPairs'],
              'regionVertexCounts': {region['id']: region['vertexCount'] for region in payload['regions']},
          }, sort_keys=True))
          PY
      - name: Install Blender headless rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y blender xvfb xauth libegl1 libgl1-mesa-dri libglx-mesa0
      - name: Build shared region ontology scene and previews
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          xvfb-run -a blender --background \
            --python tools/face-geometry/gnm/build_gnm_region_ontology_scene.py \
            -- \
            --obj /tmp/gnm-head-neutral.obj \
            --regions /tmp/gnm-provider-region-ontology.json \
            --output /tmp/gnm-region-ontology.blend \
            --metadata-out /tmp/gnm-region-ontology-scene-metadata.json \
            --front-preview-out /tmp/gnm-region-ontology-front.png \
            --three-quarter-preview-out /tmp/gnm-region-ontology-three-quarter.png
      - name: Verify Blender artifacts
        run: |
          test -s /tmp/gnm-region-ontology.blend
          test -s /tmp/gnm-region-ontology-scene-metadata.json
          test -s /tmp/gnm-region-ontology-front.png
          test -s /tmp/gnm-region-ontology-three-quarter.png
          grep -q '"regionCount": 22' /tmp/gnm-region-ontology-scene-metadata.json
          grep -q '"productNeutral": true' /tmp/gnm-region-ontology-scene-metadata.json
          grep -q '"runtimeBlenderDependency": false' /tmp/gnm-region-ontology-scene-metadata.json
      - name: Upload MESH4 authoring artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mesh4-gnm-provider-region-ontology
          if-no-files-found: error
          retention-days: 14
          path: |
            /tmp/gnm-provider-region-ontology.json
            /tmp/gnm-region-ontology.blend
            /tmp/gnm-region-ontology-scene-metadata.json
            /tmp/gnm-region-ontology-front.png
            /tmp/gnm-region-ontology-three-quarter.png
