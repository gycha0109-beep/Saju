name: Relationship Spouse T8 Song Sangseop 2022 Fulltext Acquisition

on:
  pull_request:
    paths:
      - 'scripts/discover-relationship-spouse-t8-song-sangseop-2022-riss.py'
      - 'scripts/probe-relationship-spouse-t8-song-sangseop-2022-riss-dispatcher.py'
      - '.github/workflows/relationship-spouse-t8-song-sangseop-2022-fulltext-acquisition.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire-public-fulltext:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve exact current public RISS identity without guessed ids
        run: python scripts/discover-relationship-spouse-t8-song-sangseop-2022-riss.py
      - name: Probe current RISS dispatcher and original-existence contract
        run: python scripts/probe-relationship-spouse-t8-song-sangseop-2022-riss-dispatcher.py
      - name: Print discovery and dispatcher evidence
        if: always()
        run: |
          test -f acquisition-song-sangseop-2022/riss-identity.json && cat acquisition-song-sangseop-2022/riss-identity.json || true
          test -f acquisition-song-sangseop-2022/riss-dispatcher.json && python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('acquisition-song-sangseop-2022/riss-dispatcher.json').read_text())
          print(json.dumps({k:j[k] for k in ('target','form','originalCheckUrl','originalCheckContractFound','originalCheck','originalCheckBody','fulltextDispatcherImplementation','guessedOpaqueIdentifierCount','contentDownloadExecuted')},ensure_ascii=False,indent=2))
          PY
      - name: Enforce no-guess discovery boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          i=json.loads(Path('acquisition-song-sangseop-2022/riss-identity.json').read_text())
          assert i['guessedOpaqueIdentifierCount']==0
          assert i['contentActionExecuted'] is False
          assert i['target']['rissIds']==['T16377357']
          assert i['target']['docControlNo']=='16377357'
          assert i['target']['docType']=='T'
          assert i['target']['ucis']==['I804:45008-200000631721']
          d=json.loads(Path('acquisition-song-sangseop-2022/riss-dispatcher.json').read_text())
          assert d['form']=={'control_no':'6188af0cf49b0838ffe0bdc3ef48d419','p_mat_type':'be54d9b8bc7cdb09','p_submat_type':'b51fa0b5ced94fec','fulltext_kind':'a8cb3aaead67ab5b','t_gubun':''}
          assert d['originalCheckContractFound'] is True
          assert d['originalCheck']['status']==200
          assert d['guessedOpaqueIdentifierCount']==0
          assert d['contentDownloadExecuted'] is False
          print('Song Sangseop exact RISS identity and current dispatcher boundary verified')
          PY
      - name: Upload bounded discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: song-sangseop-2022-bounded-fulltext-evidence
          path: |
            acquisition-song-sangseop-2022/riss-identity.json
            acquisition-song-sangseop-2022/riss-dispatcher.json
            acquisition-song-sangseop-2022/riss-search.html
            acquisition-song-sangseop-2022/riss-detail.html
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0
