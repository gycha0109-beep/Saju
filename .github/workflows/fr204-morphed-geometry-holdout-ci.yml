name: FR204 Morphed Geometry Holdout CI

on:
  push:
    branches:
      - research/fr204-morphed-geometry-holdout
    paths:
      - 'scripts/run-fr204-morphed-geometry-holdout.mjs'
      - 'research/face-reading/fr204-morphed-geometry-holdout.md'
      - '.github/workflows/fr204-morphed-geometry-holdout-ci.yml'
  pull_request:
    paths:
      - 'scripts/run-fr204-morphed-geometry-holdout.mjs'
      - 'research/face-reading/fr204-morphed-geometry-holdout.md'
      - '.github/workflows/fr204-morphed-geometry-holdout-ci.yml'

permissions:
  contents: read

concurrency:
  group: fr204-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  fr204:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Typecheck face-reading
        run: npm run face:typecheck
      - name: Build face-reading
        run: npm run face:build
      - name: Syntax-check FR204 experiment
        run: node --check scripts/run-fr204-morphed-geometry-holdout.mjs
      - name: FR204 frozen-calibration morphed holdout experiment
        run: node scripts/run-fr204-morphed-geometry-holdout.mjs
      - name: Upload FR204 experiment receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fr204-morphed-geometry-holdout
          path: artifacts/face-reading/fr204-morphed-geometry-holdout.json
          if-no-files-found: warn
          retention-days: 14
