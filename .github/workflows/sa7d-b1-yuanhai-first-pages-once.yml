name: "[WT:saju-research] SA-7D-B1 Yuanhai Early Pages One-shot"
on:
  push:
    branches:
      - research/saju-research/sa7d-b1-volume5-scan
    paths:
      - scripts/research/sa7d_b1_yuanhai_ming_locator.py
      - .github/workflows/sa7d-b1-yuanhai-first-pages-once.yml
permissions:
  contents: read
concurrency:
  group: sa7d-b1-yuanhai-first-pages-once
  cancel-in-progress: false
jobs:
  source-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install fixed image validator
        run: python -m pip install --disable-pip-version-check --no-cache-dir "Pillow==11.3.0"
      - name: Bound eight original-derived Ming printed folios; do not download PDFs
        run: python scripts/research/sa7d_b1_yuanhai_ming_locator.py
      - name: Archive evidence without source PDF
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sa7d-b1-yuanhai-original-derived-first-pages
          path: .scan-evidence-yuanhai/
          if-no-files-found: warn
          retention-days: 5
          include-hidden-files: true
