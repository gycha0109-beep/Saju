name: FE035A Face Semantic Readiness Gate

on:
  pull_request:
    paths:
      - 'packages/face-reading/src/product-semantic-readiness-fe035a.ts'
      - 'packages/face-reading/src/product-semantic-readiness-fe035a.test.ts'
      - 'research/face-reading/fe035a-product-semantic-readiness.md'
      - '.github/workflows/fe035a-face-semantic-readiness-ci.yml'

permissions:
  contents: read

jobs:
  verify-fe035a-semantic-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build Face Reading package
        run: npm run face:build
      - name: Verify FE035A semantic readiness gate
        run: npx vitest run packages/face-reading/src/product-semantic-readiness-fe035a.test.ts
