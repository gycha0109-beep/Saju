name: Relationship Spouse T8 Lee Sangcheon 2017 RISS Dispatcher Recheck

on:
  pull_request:
    paths:
      - 'scripts/acquire-relationship-spouse-t8-lee-sangcheon-2017-riss-dispatcher-public-fulltext.py'
      - '.github/workflows/relationship-spouse-t8-lee-sangcheon-2017-riss-dispatcher-recheck.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recheck-public-fulltext:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Follow exact page-authored RISS dispatcher to institutional public route
        run: python scripts/acquire-relationship-spouse-t8-lee-sangcheon-2017-riss-dispatcher-public-fulltext.py
      - name: Enforce exact identity public-route and no-bypass boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('acquisition-lee-sangcheon-2017-riss-dispatcher-recheck/report.json').read_text(encoding='utf-8'))
          c=j['candidate']; p=j['policy']
          assert c['author']=='이상천'
          assert c['year']==2017
          assert c['rissControl']=='7dedd951a2b45b77ffe0bdc3ef48d419'
          assert c['nanetControl']=='KDMT1201802346'
          assert c['priorAccessBoundaryPr']==368
          assert j['dispatcherContractVerified'] is True
          assert j['dcollectionTargetRecoveredFromRiss'] is True
          assert p['guessedOpaqueIdentifierCount']==0
          assert p['onlySiteAuthoredPublicRoutesInspected'] is True
          assert p['nanetDrmRouteReplayed'] is False
          assert p['loginBypass'] is False
          assert p['institutionAuthBypass'] is False
          assert p['paywallBypass'] is False
          assert p['drmRequestExecuted'] is False
          assert p['decryptionActionExecuted'] is False
          if j['publicPdfAcquired']:
              pdf=next(x for x in j['hops'] if x['name']=='publicPdf')
              dc=next(x for x in j['hops'] if x['name']=='dcollectionItem')['sourceContract']
              assert dc['drm']=='N'
              assert dc['msg'] in (None, '')
              assert dc['drmBranchOnlyWhenY'] is True
              assert dc['nonDrmElsePublicRedirect'] is True
              assert pdf['isPdf'] is True
              assert pdf['sizeMatchesServerMetadata'] is True
              print('Lee Sangcheon 2017 public PDF acquired:', pdf['sha256'], pdf['bytes'])
          else:
              print('Lee Sangcheon 2017 public body not acquired; retain access boundary')
          PY
      - name: Upload bounded recheck evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lee-sangcheon-2017-riss-dispatcher-recheck-evidence
          path: |
            acquisition-lee-sangcheon-2017-riss-dispatcher-recheck/report.json
            acquisition-lee-sangcheon-2017-riss-dispatcher-recheck/*-response.html
            acquisition-lee-sangcheon-2017-riss-dispatcher-recheck/*.js
            acquisition-lee-sangcheon-2017-riss-dispatcher-recheck/*.pdf
            acquisition-lee-sangcheon-2017-riss-dispatcher-recheck/*.bin
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0
