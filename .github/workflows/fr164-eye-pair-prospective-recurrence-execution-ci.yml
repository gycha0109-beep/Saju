name: FR164 Eye Pair Prospective Recurrence Execution CI

on:
  pull_request:
    paths:
      - "research/face-reading/fr164-eye-pair-prospective-recurrence-execution.md"
      - "packages/face-reading/src/eye-pair-prospective-ephemeral-real-capture-series-fr161.ts"
      - "packages/face-reading/src/eye-pair-prospective-ephemeral-real-capture-series-fr161.test.ts"
      - "packages/face-reading/src/eye-pair-prospective-recurrence-protocol-fr163.ts"
      - "packages/face-reading/src/eye-pair-prospective-recurrence-execution-fr164.ts"
      - "packages/face-reading/src/eye-pair-prospective-recurrence-execution-fr164.test.ts"
      - ".github/workflows/fr164-eye-pair-prospective-recurrence-execution-ci.yml"
  push:
    branches: [main]
    paths:
      - "research/face-reading/fr164-eye-pair-prospective-recurrence-execution.md"
      - "packages/face-reading/src/eye-pair-prospective-ephemeral-real-capture-series-fr161.ts"
      - "packages/face-reading/src/eye-pair-prospective-ephemeral-real-capture-series-fr161.test.ts"
      - "packages/face-reading/src/eye-pair-prospective-recurrence-protocol-fr163.ts"
      - "packages/face-reading/src/eye-pair-prospective-recurrence-execution-fr164.ts"
      - "packages/face-reading/src/eye-pair-prospective-recurrence-execution-fr164.test.ts"
      - ".github/workflows/fr164-eye-pair-prospective-recurrence-execution-ci.yml"

permissions:
  contents: read

jobs:
  fr164-eye-pair-prospective-recurrence-execution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: >-
          npx vitest run
          packages/face-reading/src/eye-pair-prospective-ephemeral-real-capture-series-fr161.test.ts
          packages/face-reading/src/eye-pair-prospective-recurrence-protocol-fr163.test.ts
          packages/face-reading/src/eye-pair-prospective-recurrence-execution-fr164.test.ts
