name: FE033A Stable Preview Distribution

on:
  push:
    branches:
      - feat/fe033a-stable-preview-distribution
      - feat/face-reading/fe040b-registry-distribution
      - feat/face-reading/fe041b-operationalization-readiness-distribution
      - feat/face-reading/fe041d-candidate-metric-mapping-readiness
    paths:
      - '.github/workflows/fe033a-stable-preview-distribution.yml'
      - 'scripts/build-fe024-digest-bound-preview-consumer-handoff.mjs'
      - 'scripts/verify-fe024-digest-bound-preview-consumer-handoff.mjs'
      - 'scripts/build-fe040b-canonical-registry-consumer-handoff.mjs'
      - 'scripts/verify-fe040b-canonical-registry-consumer-handoff.mjs'
      - 'scripts/build-fe041b-operationalization-readiness-handoff.mjs'
      - 'scripts/verify-fe041b-operationalization-readiness-handoff.mjs'
      - 'scripts/build-fe041d-candidate-metric-mapping-readiness-handoff.mjs'
      - 'scripts/verify-fe041d-candidate-metric-mapping-readiness-handoff.mjs'
      - 'packages/face-reading/**'
      - 'tsconfig.face-reading.preview-package.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fe033a-stable-preview-distribution-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run face:build:preview-package

      - name: Build deterministic FE024 handoff
        if: github.ref_name == 'feat/fe033a-stable-preview-distribution'
        env:
          FE024_SOURCE_COMMIT: 1c0be383844bd7c5aa75079e2084da7bee9de13c
        run: node scripts/build-fe024-digest-bound-preview-consumer-handoff.mjs distribution/face-reading/fe024
      - name: Verify FE024 handoff
        if: github.ref_name == 'feat/fe033a-stable-preview-distribution'
        run: node scripts/verify-fe024-digest-bound-preview-consumer-handoff.mjs distribution/face-reading/fe024
      - name: Verify locked FE024 tarball digest
        if: github.ref_name == 'feat/fe033a-stable-preview-distribution'
        run: |
          echo "8d793c57e104fc0137a17dc631d208b468131b1d9a9668142a846e34dacbf84a  distribution/face-reading/fe024/myeongha-face-reading-0.0.0.tgz" | sha256sum --check --strict
      - name: Commit immutable FE024 distribution bytes
        if: github.ref_name == 'feat/fe033a-stable-preview-distribution'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add distribution/face-reading/fe024/manifest.json distribution/face-reading/fe024/myeongha-face-reading-0.0.0.tgz
          if git diff --cached --quiet; then
            echo "FE033A distribution already materialized."
            exit 0
          fi
          git commit -m "build(face-engine): materialize FE024 preview distribution"
          git push origin HEAD:feat/fe033a-stable-preview-distribution

      - name: Verify pinned FE035B canonical source blob
        if: github.ref_name == 'feat/face-reading/fe040b-registry-distribution'
        run: |
          test "$(git hash-object packages/face-reading/src/product-neutral-observation-contract-fe035b.ts)" = "c9ed7dfb347144759694056e89d571c433d4dfc8"
      - name: Build FE040B handoff A
        if: github.ref_name == 'feat/face-reading/fe040b-registry-distribution'
        run: node scripts/build-fe040b-canonical-registry-consumer-handoff.mjs .artifacts/fe040b-a
      - name: Verify FE040B handoff A
        if: github.ref_name == 'feat/face-reading/fe040b-registry-distribution'
        run: node scripts/verify-fe040b-canonical-registry-consumer-handoff.mjs .artifacts/fe040b-a
      - name: Build FE040B handoff B
        if: github.ref_name == 'feat/face-reading/fe040b-registry-distribution'
        run: node scripts/build-fe040b-canonical-registry-consumer-handoff.mjs .artifacts/fe040b-b
      - name: Verify FE040B handoff B
        if: github.ref_name == 'feat/face-reading/fe040b-registry-distribution'
        run: node scripts/verify-fe040b-canonical-registry-consumer-handoff.mjs .artifacts/fe040b-b
      - name: Verify FE040B deterministic artifact equality
        if: github.ref_name == 'feat/face-reading/fe040b-registry-distribution'
        run: |
          test "$(sha256sum .artifacts/fe040b-a/myeongha-face-reading-0.0.0.tgz | cut -d' ' -f1)" = "$(sha256sum .artifacts/fe040b-b/myeongha-face-reading-0.0.0.tgz | cut -d' ' -f1)"
          diff -u .artifacts/fe040b-a/manifest.json .artifacts/fe040b-b/manifest.json
      - name: Materialize FE040B distribution bytes
        if: github.ref_name == 'feat/face-reading/fe040b-registry-distribution'
        run: |
          rm -rf distribution/face-reading/fe040b
          mkdir -p distribution/face-reading/fe040b
          cp .artifacts/fe040b-a/manifest.json distribution/face-reading/fe040b/manifest.json
          cp .artifacts/fe040b-a/myeongha-face-reading-0.0.0.tgz distribution/face-reading/fe040b/myeongha-face-reading-0.0.0.tgz
      - name: Commit immutable FE040B distribution bytes
        if: github.ref_name == 'feat/face-reading/fe040b-registry-distribution'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add distribution/face-reading/fe040b/manifest.json distribution/face-reading/fe040b/myeongha-face-reading-0.0.0.tgz
          if git diff --cached --quiet; then
            echo "FE040B distribution already materialized."
            exit 0
          fi
          git commit -m "build(face-engine): materialize FE040B canonical registry distribution"
          git push origin HEAD:feat/face-reading/fe040b-registry-distribution

      - name: Verify pinned FE041B authority-source blobs
        if: github.ref_name == 'feat/face-reading/fe041b-operationalization-readiness-distribution'
        run: |
          test "$(git rev-parse 50fd5b511326033861b3cab48028b989c4499b3c^{commit})" = "50fd5b511326033861b3cab48028b989c4499b3c"
          test "$(git show 50fd5b511326033861b3cab48028b989c4499b3c:packages/face-reading/src/five-officers-square-broad-fang-approved-governance-materialization-fr140.ts | git hash-object --stdin)" = "c6ebcb9213db11dfdd2abda5dd723911355f3859"
          test "$(git show 50fd5b511326033861b3cab48028b989c4499b3c:packages/face-reading/src/five-officers-square-broad-fang-source-lineage-construct-refinement-fr141.ts | git hash-object --stdin)" = "a2a621bb2088f9002480caf6a89bbc0a40e50538"
          test "$(git show 50fd5b511326033861b3cab48028b989c4499b3c:governance/face-reading/square-broad-fang-project-owner-methodology-approval-v1.md | git hash-object --stdin)" = "ad9ea864092dd5f70a691c842ba8ef4ca618f971"
      - name: Build FE041B handoff A
        if: github.ref_name == 'feat/face-reading/fe041b-operationalization-readiness-distribution'
        run: node scripts/build-fe041b-operationalization-readiness-handoff.mjs .artifacts/fe041b-a
      - name: Verify FE041B handoff A
        if: github.ref_name == 'feat/face-reading/fe041b-operationalization-readiness-distribution'
        run: node scripts/verify-fe041b-operationalization-readiness-handoff.mjs .artifacts/fe041b-a
      - name: Build FE041B handoff B
        if: github.ref_name == 'feat/face-reading/fe041b-operationalization-readiness-distribution'
        run: node scripts/build-fe041b-operationalization-readiness-handoff.mjs .artifacts/fe041b-b
      - name: Verify FE041B handoff B
        if: github.ref_name == 'feat/face-reading/fe041b-operationalization-readiness-distribution'
        run: node scripts/verify-fe041b-operationalization-readiness-handoff.mjs .artifacts/fe041b-b
      - name: Verify FE041B deterministic artifact equality
        if: github.ref_name == 'feat/face-reading/fe041b-operationalization-readiness-distribution'
        run: |
          test "$(sha256sum .artifacts/fe041b-a/myeongha-face-reading-0.0.0.tgz | cut -d' ' -f1)" = "$(sha256sum .artifacts/fe041b-b/myeongha-face-reading-0.0.0.tgz | cut -d' ' -f1)"
          diff -u .artifacts/fe041b-a/manifest.json .artifacts/fe041b-b/manifest.json
      - name: Materialize FE041B distribution bytes
        if: github.ref_name == 'feat/face-reading/fe041b-operationalization-readiness-distribution'
        run: |
          rm -rf distribution/face-reading/fe041b
          mkdir -p distribution/face-reading/fe041b
          cp .artifacts/fe041b-a/manifest.json distribution/face-reading/fe041b/manifest.json
          cp .artifacts/fe041b-a/myeongha-face-reading-0.0.0.tgz distribution/face-reading/fe041b/myeongha-face-reading-0.0.0.tgz
      - name: Commit immutable FE041B distribution bytes
        if: github.ref_name == 'feat/face-reading/fe041b-operationalization-readiness-distribution'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add distribution/face-reading/fe041b/manifest.json distribution/face-reading/fe041b/myeongha-face-reading-0.0.0.tgz
          if git diff --cached --quiet; then
            echo "FE041B distribution already materialized."
            exit 0
          fi
          git commit -m "build(face-engine): materialize FE041B operationalization readiness distribution"
          git push origin HEAD:feat/face-reading/fe041b-operationalization-readiness-distribution

      - name: Verify pinned FE041D research-source blobs
        if: github.ref_name == 'feat/face-reading/fe041d-candidate-metric-mapping-readiness'
        run: |
          test "$(git hash-object packages/face-reading/src/product-neutral-observation-contract-fe035b.ts)" = "c9ed7dfb347144759694056e89d571c433d4dfc8"
          test "$(git hash-object packages/face-reading/src/five-officers-square-broad-fang-source-lineage-construct-refinement-fr141.ts)" = "a2a621bb2088f9002480caf6a89bbc0a40e50538"
          test "$(git hash-object packages/face-reading/src/five-officers-square-broad-fang-neutral-candidate-metric-runtime-fr142.ts)" = "004a2cdb21bc6f247e48cae52429afaf54f6804d"
          test "$(git hash-object packages/face-reading/src/five-officers-square-broad-fang-neutral-candidate-metric-synthetic-verification-fr143.ts)" = "293e29e65239894a5ec21befbd7152c339250759"
      - name: Build FE041D handoff A
        if: github.ref_name == 'feat/face-reading/fe041d-candidate-metric-mapping-readiness'
        run: node scripts/build-fe041d-candidate-metric-mapping-readiness-handoff.mjs .artifacts/fe041d-a
      - name: Verify FE041D handoff A
        if: github.ref_name == 'feat/face-reading/fe041d-candidate-metric-mapping-readiness'
        run: node scripts/verify-fe041d-candidate-metric-mapping-readiness-handoff.mjs .artifacts/fe041d-a
      - name: Build FE041D handoff B
        if: github.ref_name == 'feat/face-reading/fe041d-candidate-metric-mapping-readiness'
        run: node scripts/build-fe041d-candidate-metric-mapping-readiness-handoff.mjs .artifacts/fe041d-b
      - name: Verify FE041D handoff B
        if: github.ref_name == 'feat/face-reading/fe041d-candidate-metric-mapping-readiness'
        run: node scripts/verify-fe041d-candidate-metric-mapping-readiness-handoff.mjs .artifacts/fe041d-b
      - name: Verify FE041D deterministic artifact equality
        if: github.ref_name == 'feat/face-reading/fe041d-candidate-metric-mapping-readiness'
        run: |
          test "$(sha256sum .artifacts/fe041d-a/myeongha-face-reading-0.0.0.tgz | cut -d' ' -f1)" = "$(sha256sum .artifacts/fe041d-b/myeongha-face-reading-0.0.0.tgz | cut -d' ' -f1)"
          diff -u .artifacts/fe041d-a/manifest.json .artifacts/fe041d-b/manifest.json
      - name: Materialize FE041D distribution bytes
        if: github.ref_name == 'feat/face-reading/fe041d-candidate-metric-mapping-readiness'
        run: |
          rm -rf distribution/face-reading/fe041d
          mkdir -p distribution/face-reading/fe041d
          cp .artifacts/fe041d-a/manifest.json distribution/face-reading/fe041d/manifest.json
          cp .artifacts/fe041d-a/myeongha-face-reading-0.0.0.tgz distribution/face-reading/fe041d/myeongha-face-reading-0.0.0.tgz
      - name: Commit immutable FE041D distribution bytes
        if: github.ref_name == 'feat/face-reading/fe041d-candidate-metric-mapping-readiness'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add distribution/face-reading/fe041d/manifest.json distribution/face-reading/fe041d/myeongha-face-reading-0.0.0.tgz
          if git diff --cached --quiet; then
            echo "FE041D distribution already materialized."
            exit 0
          fi
          git commit -m "build(face-engine): materialize FE041D candidate metric mapping readiness"
          git push origin HEAD:feat/face-reading/fe041d-candidate-metric-mapping-readiness
