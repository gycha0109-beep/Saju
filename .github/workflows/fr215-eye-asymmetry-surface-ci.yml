name: FR215 Eye Asymmetry Surface CI

on:
  pull_request:
    paths:
      - 'packages/face-reading/src/eye-asymmetry-surface-fr215.ts'
      - 'packages/face-reading/src/eye-asymmetry-surface-fr215.test.ts'
      - 'packages/face-reading/src/face-eye-pair-research-bridge-fr24.ts'
      - 'packages/face-reading/src/governed-metric-geometry-runtime-fr77.ts'
      - 'packages/face-reading/src/face-reading-whole-face-minimum-measurement-inventory-fr207.ts'
      - 'research/face-reading/fr215-eye-asymmetry-surface.md'
      - '.github/workflows/fr215-eye-asymmetry-surface-ci.yml'

permissions:
  contents: read

jobs:
  verify-fr215-eye-asymmetry-surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build Face Reading package
        run: npm run face:build
      - name: Verify FR215 eye asymmetry surface
        run: npx vitest run packages/face-reading/src/eye-asymmetry-surface-fr215.test.ts
