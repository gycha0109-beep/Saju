name: FR118 Intake Criterion Methodology Source Rebind Post-Persistence Review CI

on:
  pull_request:
    paths:
      - 'packages/face-reading/src/five-officers-intake-criterion-methodology-source-rebind-post-persistence-review-fr118.ts'
      - 'packages/face-reading/src/five-officers-intake-criterion-methodology-source-rebind-post-persistence-review-fr118.test.ts'
      - 'packages/face-reading/src/five-officers-intake-criterion-methodology-source-rebind-post-persistence-review-fr118-hardening.test.ts'
      - 'scripts/verify-fr118-intake-criterion-methodology-source-rebind-post-persistence-review.mjs'
      - '.github/workflows/fr118-intake-criterion-methodology-source-rebind-post-persistence-review-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-fr118-source-rebind-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build Face Reading package
        run: npm run face:build
      - name: Verify FR118 authority boundary
        run: npx vitest run packages/face-reading/src/five-officers-intake-criterion-methodology-source-rebind-post-persistence-review-fr118.test.ts packages/face-reading/src/five-officers-intake-criterion-methodology-source-rebind-post-persistence-review-fr118-hardening.test.ts
      - name: Verify FR118 exact post-persistence source rebind chain
        run: node scripts/verify-fr118-intake-criterion-methodology-source-rebind-post-persistence-review.mjs
