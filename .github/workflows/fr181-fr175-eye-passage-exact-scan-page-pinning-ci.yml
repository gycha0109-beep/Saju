name: FR181 FR175 Exact Scan Page Pinning CI

on:
  pull_request:
    paths:
      - 'packages/face-reading/src/eye-pair-fr175-exact-scan-page-pinning-fr181.ts'
      - 'packages/face-reading/src/eye-pair-fr175-exact-scan-page-pinning-fr181.test.ts'
      - 'research/face-reading/fr181-fr175-eye-passage-exact-scan-page-pinning.md'
      - '.github/workflows/fr181-fr175-eye-passage-exact-scan-page-pinning-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-fr181-pinning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build Face Reading package
        run: npm run face:build
      - name: Verify FR181 exact scan-page locator boundary
        run: npx vitest run packages/face-reading/src/eye-pair-fr175-exact-scan-page-pinning-fr181.test.ts
