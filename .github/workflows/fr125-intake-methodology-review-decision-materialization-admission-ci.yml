name: FR125 Intake Methodology Review Decision Materialization Admission CI

on:
  pull_request:
    paths:
      - 'packages/face-reading/src/five-officers-intake-methodology-review-decision-materialization-admission-fr125.ts'
      - 'packages/face-reading/src/five-officers-intake-methodology-review-decision-materialization-admission-fr125.test.ts'
      - 'packages/face-reading/src/five-officers-intake-methodology-review-decision-materialization-admission-fr125-hardening.test.ts'
      - 'scripts/verify-fr125-intake-methodology-review-decision-materialization-admission.mjs'
      - '.github/workflows/fr125-intake-methodology-review-decision-materialization-admission-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-fr125-intake-methodology-review-decision-materialization-admission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build Face Reading package
        run: npm run face:build
      - name: Verify FR125 methodology review decision materialization admission
        run: npx vitest run packages/face-reading/src/five-officers-intake-methodology-review-decision-materialization-admission-fr125.test.ts packages/face-reading/src/five-officers-intake-methodology-review-decision-materialization-admission-fr125-hardening.test.ts
      - name: Verify FR125 exact predecessor and decision-materialization chain
        run: node scripts/verify-fr125-intake-methodology-review-decision-materialization-admission.mjs
