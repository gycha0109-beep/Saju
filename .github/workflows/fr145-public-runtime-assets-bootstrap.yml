name: FR145 Public Runtime Assets Bootstrap

on:
  pull_request:
    paths:
      - '.github/workflows/fr145-public-runtime-assets-bootstrap.yml'
      - 'packages/face-reading/**'
      - 'package-lock.json'
      - 'tsconfig.face-reading.build.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-public-runtime-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build exact Face Reading JavaScript
        run: npm run face:build
      - name: Materialize exact public MediaPipe runtime assets
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./node_modules/@mediapipe/tasks-vision/package.json').version")" = "0.10.35"
          mkdir -p .fr145-public-runtime/tasks-vision .fr145-public-runtime/model .fr145-public-runtime/mediapipe-source
          cp -R node_modules/@mediapipe/tasks-vision/. .fr145-public-runtime/tasks-vision/
          cp -R .face-reading-dist .fr145-public-runtime/face-reading-dist
          cat > .fr145-browser-entry.ts <<'ENTRY'
          export { FaceLandmarker } from '@mediapipe/tasks-vision';
          export { runPhotoToLipsContourNeutralSurfaceFR66 } from './packages/face-reading/src/lips-contour-neutral-surface-fr66.ts';
          export { assessLipsPoseNormalizationRequirementsFR67 } from './packages/face-reading/src/lips-pose-normalization-requirements-fr67.ts';
          export { admitMediaPipeFaceGeometryTransformSemanticsFR68 } from './packages/face-reading/src/mediapipe-face-geometry-transform-semantics-fr68.ts';
          export { admitMediaPipeWebMetricGeometryGapFR69 } from './packages/face-reading/src/mediapipe-web-metric-geometry-gap-fr69.ts';
          export { admitMediaPipeReleaseExactMetricGeometryFR75 } from './packages/face-reading/src/mediapipe-release-exact-metric-geometry-admission-fr75.ts';
          export { admitMediaPipeScreenToMetricReimplementationParityFR76 } from './packages/face-reading/src/mediapipe-screen-to-metric-reimplementation-parity-fr76.ts';
          export { runSquareBroadFangEphemeralRealCaptureFR145, DEFAULT_SQUARE_BROAD_FANG_EPHEMERAL_REAL_CAPTURE_DEPENDENCIES_FR145 } from './packages/face-reading/src/five-officers-square-broad-fang-ephemeral-real-capture-bridge-fr145.ts';
          ENTRY
          ./node_modules/.bin/esbuild .fr145-browser-entry.ts \
            --bundle --format=esm --platform=browser --target=es2022 \
            --outfile=.fr145-public-runtime/fr145-browser-bundle.mjs
          rm .fr145-browser-entry.ts
          curl --fail --location --retry 3 \
            'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task' \
            --output .fr145-public-runtime/model/face_landmarker.task
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/google-ai-edge/mediapipe/f8ef212d5c962c0e853db7e59d217056b187084b/mediapipe/tasks/cc/vision/face_geometry/data/geometry_pipeline_metadata_landmarks.pbtxt' \
            --output .fr145-public-runtime/mediapipe-source/geometry_pipeline_metadata_landmarks.pbtxt
          test "$(git hash-object .fr145-public-runtime/mediapipe-source/geometry_pipeline_metadata_landmarks.pbtxt)" = '252a7b05b24c5c43c5b94179393639f7c9a2fe8f'
          sha256sum .fr145-public-runtime/model/face_landmarker.task > .fr145-public-runtime/model/face_landmarker.task.sha256
          printf 'runtimePackage=@mediapipe/tasks-vision@0.10.35\nmediapipeReleaseCommit=f8ef212d5c962c0e853db7e59d217056b187084b\ngeometryMetadataBlobSha=252a7b05b24c5c43c5b94179393639f7c9a2fe8f\n' > .fr145-public-runtime/PROVENANCE.txt
      - name: Upload public runtime bootstrap artifact
        uses: actions/upload-artifact@v4
        with:
          name: fr145-public-runtime-assets-${{ github.sha }}
          path: .fr145-public-runtime
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
