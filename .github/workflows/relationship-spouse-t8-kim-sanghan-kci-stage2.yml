name: Relationship Spouse T8 Kim Sanghan KCI Stage2

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/probe-relationship-spouse-t8-kim-sanghan-kci-stage2.py'
      - '.github/workflows/relationship-spouse-t8-kim-sanghan-kci-stage2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-kci-stage2:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Probe exact KCI preview and RISS fulltext routes
        run: python3 scripts/probe-relationship-spouse-t8-kim-sanghan-kci-stage2.py
      - name: Upload bounded stage2 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relationship-spouse-t8-kim-sanghan-kci-stage2
          path: acquisition-kim-sanghan-kci-stage2/**
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0
