name: Relationship Spouse T8 Role-Neutral Identity Acquisition

on:
  pull_request:
    paths:
      - '.github/workflows/relationship-spouse-t8-role-neutral-identity-acquisition.yml'
      - 'scripts/probe-relationship-spouse-t8-role-neutral-identities.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-identities:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Probe exact public RISS/dCollection identities
        run: python3 scripts/probe-relationship-spouse-t8-role-neutral-identities.py
      - name: Upload one-day identity artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relationship-spouse-t8-role-neutral-identity-acquisition
          path: |
            acquisition-role-neutral-identities/report.json
            acquisition-role-neutral-identities/*.pdf
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0
