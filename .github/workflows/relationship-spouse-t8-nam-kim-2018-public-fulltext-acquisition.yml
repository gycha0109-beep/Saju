name: Relationship Spouse T8 Nam Kim 2018 Public Fulltext Acquisition

on:
  pull_request:
    paths:
      - 'scripts/acquire-relationship-spouse-t8-nam-kim-2018-public-fulltext.py'
      - '.github/workflows/relationship-spouse-t8-nam-kim-2018-public-fulltext-acquisition.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire-public-fulltext:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Follow exact author-page-authored public attachment
        run: python scripts/acquire-relationship-spouse-t8-nam-kim-2018-public-fulltext.py
      - name: Enforce exact identity public-PDF and no-bypass boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('acquisition-nam-kim-2018/report.json').read_text(encoding='utf-8'))
          c=j['candidate']; p=j['policy']; s=j['selectedPdf']
          assert c['authors']==['남기동','김만태']
          assert c['year']==2018
          assert c['title']=='한국사회 이혼현상에 따른 부부궁합(夫婦宮合)의 명리학적 고찰'
          assert c['doi']=='10.22143/HSS21.9.2.9'
          assert c['kci']=='ART002338687'
          assert j['titleObserved'] is True
          assert all(j['authorsObserved'].values())
          assert j['yearObserved'] is True
          assert j['fileDownloadFunctionContract']['definitionObserved'] is True
          assert j['fileDownloadFunctionContract']['documentLocationHrefAssignedFromLink'] is True
          assert j['fullLengthPdfAcquired'] is True
          assert s['exactAttachmentName'] is True
          assert s['sameAuthorSite'] is True
          assert s['pdfMagic'] is True
          assert s['bytes'] > 100000
          assert p['guessedOpaqueIdentifierCount']==0
          assert p['onlyPageAuthoredSameSiteAttachmentExecuted'] is True
          assert p['loginBypass'] is False
          assert p['institutionAuthBypass'] is False
          assert p['paywallBypass'] is False
          assert p['drmRequestExecuted'] is False
          assert p['decryptionActionExecuted'] is False
          print('Nam/Kim 2018 exact author-page-authored public PDF acquired and verified')
          print('pdfSha256=', s['sha256'])
          print('pdfBytes=', s['bytes'])
          PY
      - name: Upload bounded acquisition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nam-kim-2018-public-fulltext-evidence
          path: |
            acquisition-nam-kim-2018/report.json
            acquisition-nam-kim-2018/author-page.html
            acquisition-nam-kim-2018/*.pdf
            acquisition-nam-kim-2018/pdf-url.txt
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0
