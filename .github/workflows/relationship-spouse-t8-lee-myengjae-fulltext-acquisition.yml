name: Relationship Spouse T8 Lee Myengjae 2022 Fulltext Acquisition

on:
  pull_request:
    paths:
      - 'scripts/acquire-relationship-spouse-t8-lee-myengjae-2022.py'
      - '.github/workflows/relationship-spouse-t8-lee-myengjae-fulltext-acquisition.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire-public-fulltext:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install extraction and rendering dependencies
        run: python -m pip install --disable-pip-version-check 'pypdf[crypto]' pymupdf
      - name: Probe public KCI / DOI routes only
        run: python scripts/acquire-relationship-spouse-t8-lee-myengjae-2022.py
      - name: Print bounded acquisition evidence
        if: always()
        run: |
          test -f acquisition-lee-myengjae-2022/summary.txt && cat acquisition-lee-myengjae-2022/summary.txt || true
          test -f acquisition-lee-myengjae-2022/report.json && python - <<'PY'
          import json
          from pathlib import Path
          p=Path('acquisition-lee-myengjae-2022/report.json')
          if p.exists():
              j=json.loads(p.read_text())
              print(json.dumps({
                  'directPdfAcquired':j.get('directPdfAcquired'),
                  'candidate':j.get('candidate'),
                  'pdfs':j.get('pdfs'),
              }, ensure_ascii=False, indent=2))
          PY
      - name: Enforce identity boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('acquisition-lee-myengjae-2022/report.json').read_text())
          assert j['candidate']['kciArticleId']=='ART002833924'
          assert j['candidate']['doi']=='10.35955/JCH.2022.04.80.273'
          print('Acquisition probe completed; directPdfAcquired=', j['directPdfAcquired'])
          PY
      - name: Upload bounded rendered-page evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lee-myengjae-2022-bounded-fulltext-evidence
          path: |
            acquisition-lee-myengjae-2022/summary.txt
            acquisition-lee-myengjae-2022/report.json
            acquisition-lee-myengjae-2022/rendered-*.png
          if-no-files-found: warn
          retention-days: 1
