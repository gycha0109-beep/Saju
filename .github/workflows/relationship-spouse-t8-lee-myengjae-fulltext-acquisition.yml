name: Relationship Spouse T8 Lee Myengjae 2022 Fulltext Acquisition

on:
  pull_request:
    paths:
      - 'scripts/acquire-relationship-spouse-t8-lee-myengjae-2022.py'
      - '.github/workflows/relationship-spouse-t8-lee-myengjae-fulltext-acquisition.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-exact-kci-download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install KCI PDF inspection dependencies
        run: python -m pip install --disable-pip-version-check 'pypdf[crypto]' pymupdf
      - name: Acquire exact session-aware KCI fulltext and render every page
        run: |
          python - <<'PY'
          import hashlib, io, json, re
          from pathlib import Path
          from http.cookiejar import CookieJar
          from urllib.request import Request, build_opener, HTTPCookieProcessor, HTTPRedirectHandler
          import pymupdf
          from pypdf import PdfReader

          ARTI='ART002833924'
          FILE_ID='KCI_FI002833924'
          DETAIL=f'https://www.kci.go.kr/kciportal/ci/sereArticleSearch/ciSereArtiView.kci?sereArticleSearchBean.artiId={ARTI}'
          DOWNLOAD=('https://www.kci.go.kr/kciportal/ci/sereArticleSearch/ciSereArtiOrteServHistIFrame.kci?'
                    f'sereArticleSearchBean.artiId={ARTI}&sereArticleSearchBean.orteFileId={FILE_ID}')
          UA='Mozilla/5.0 (compatible; MyeongHa-Research-Acquisition/6.5; public-resource-verification)'
          OUT=Path('kci-exact-rendered'); OUT.mkdir(exist_ok=True)

          class RD(HTTPRedirectHandler):
              def __init__(self): super().__init__(); self.chain=[]
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  self.chain.append((code,newurl)); return super().redirect_request(req,fp,code,msg,headers,newurl)

          jar=CookieJar(); rd=RD(); op=build_opener(HTTPCookieProcessor(jar),rd)
          with op.open(Request(DETAIL,headers={'User-Agent':UA}),timeout=25) as r:
              seed=r.read(300000)
              print('DETAIL status=',getattr(r,'status',None),'final=',r.geturl(),'bytes=',len(seed),'cookies=',[(c.name,c.domain) for c in jar])
          rd.chain.clear()
          with op.open(Request(DOWNLOAD,headers={'User-Agent':UA,'Referer':DETAIL,'Accept':'application/pdf,text/html,*/*;q=0.7'}),timeout=35) as r:
              b=r.read(40*1024*1024); ctype=r.headers.get('Content-Type'); disposition=r.headers.get('Content-Disposition'); final=r.geturl(); status=getattr(r,'status',None)
          sha=hashlib.sha256(b).hexdigest()
          print('DOWNLOAD status=',status); print('DOWNLOAD final=',final); print('DOWNLOAD redirects=',rd.chain); print('DOWNLOAD type=',ctype); print('DOWNLOAD disposition=',disposition); print('DOWNLOAD bytes=',len(b)); print('DOWNLOAD sha256=',sha); print('DOWNLOAD starts_pdf=',b.startswith(b'%PDF-'))
          assert b.startswith(b'%PDF-') or 'pdf' in (ctype or '').lower()
          reader=PdfReader(io.BytesIO(b)); pages=len(reader.pages)
          print('PDF pages=',pages,'encrypted=',bool(reader.is_encrypted))
          assert pages >= 10

          doc=pymupdf.open(stream=b,filetype='pdf'); rendered=[]
          try:
              for i in range(doc.page_count):
                  pix=doc.load_page(i).get_pixmap(matrix=pymupdf.Matrix(1.7,1.7),alpha=False)
                  p=OUT/f'rendered-physical-p{i+1:03d}.png'; pix.save(p)
                  rendered.append({'physicalPdfPage':i+1,'file':p.name,'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'bytes':p.stat().st_size})
          finally: doc.close()
          meta={'kciArticleId':ARTI,'orteFileId':FILE_ID,'downloadFinalUrl':final,'redirects':rd.chain,'contentType':ctype,'contentDisposition':disposition,'pdfSha256':sha,'pdfBytes':len(b),'pageCount':pages,'encrypted':bool(reader.is_encrypted),'rendered':rendered}
          (OUT/'metadata.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2),encoding='utf-8')
          print('RENDERED_COUNT=',len(rendered))
          PY
      - name: Upload complete rendered fulltext evidence
        uses: actions/upload-artifact@v4
        with:
          name: lee-myengjae-2022-kci-fulltext-rendered-all-pages
          path: kci-exact-rendered/
          if-no-files-found: error
          retention-days: 1

  acquire-public-fulltext:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install extraction and rendering dependencies
        run: python -m pip install --disable-pip-version-check 'pypdf[crypto]' pymupdf
      - name: Probe public KCI / DOI routes only
        run: python scripts/acquire-relationship-spouse-t8-lee-myengjae-2022.py
      - name: Probe bounded public route signals
        run: |
          python - <<'PY' | tee acquisition-lee-myengjae-2022/route-signals.txt
          import html, re
          from urllib.request import Request, urlopen
          from urllib.parse import urljoin
          urls=['https://www.kci.go.kr/kciportal/ci/sereArticleSearch/ciSereArtiView.kci?sereArticleSearchBean.artiId=ART002833924','https://scholar.kyobobook.co.kr/article/detail/4010047338431','https://contents.kyobobook.co.kr/sra/fo/js/biz/article/articleDetail.js?v=20220321','https://www.humanchina.or.kr/subList/32000005194?journalCd=23195']
          markers=('원문','artiPreView','download','builderDownload','artId','barcode','kyoboKey','fnViewPdf','pdf','ART002833924','4010047338431','selectKyoboThesis','thesis','.pdf','.down','artlNum','schlrCmdtcode')
          ua='Mozilla/5.0 (compatible; MyeongHa-Research-Acquisition/6.5; public-resource-verification)'
          for url in urls:
              print('\n=== URL',url,'===')
              try:
                  with urlopen(Request(url,headers={'User-Agent':ua}),timeout=35) as r: raw=r.read(2_000_000); final=r.geturl(); ctype=r.headers.get('Content-Type')
                  text=raw.decode('utf-8',errors='replace'); print('status=200 final=',final,'type=',ctype,'bytes=',len(raw)); print('script-srcs:')
                  for src in re.findall(r'<script[^>]+src=["\']([^"\']+)',text,re.I)[:80]: print(' ',urljoin(final,html.unescape(src)))
                  seen=set(); count=0; print('bounded-signals:'); low=text.lower()
                  for marker in markers:
                      start=0; needle=marker.lower()
                      while count<60:
                          idx=low.find(needle,start)
                          if idx<0: break
                          frag=re.sub(r'\s+',' ',html.unescape(text[max(0,idx-500):min(len(text),idx+1000)])).strip(); key=frag[:260]
                          if key not in seen: seen.add(key); count+=1; print(f'[{marker}]',frag)
                          start=idx+len(needle)
                      if count>=60: break
              except Exception as e: print('ERROR',type(e).__name__,str(e))
          PY
      - name: Print bounded acquisition evidence
        if: always()
        run: |
          test -f acquisition-lee-myengjae-2022/summary.txt && cat acquisition-lee-myengjae-2022/summary.txt || true
          test -f acquisition-lee-myengjae-2022/report.json && python - <<'PY'
          import json
          from pathlib import Path
          p=Path('acquisition-lee-myengjae-2022/report.json')
          if p.exists():
              j=json.loads(p.read_text()); print(json.dumps({'directPdfAcquired':j.get('directPdfAcquired'),'fullLengthPdfAcquired':j.get('fullLengthPdfAcquired'),'candidate':j.get('candidate'),'pdfs':j.get('pdfs')},ensure_ascii=False,indent=2))
          PY
      - name: Enforce identity boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('acquisition-lee-myengjae-2022/report.json').read_text())
          assert j['candidate']['kciArticleId']=='ART002833924'; assert j['candidate']['kciOrteFileId']=='KCI_FI002833924'; assert j['candidate']['doi']=='10.35955/JCH.2022.04.80.273'
          print('Acquisition probe completed; fullLengthPdfAcquired=',j['fullLengthPdfAcquired'])
          PY
      - name: Upload bounded rendered-page evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lee-myengjae-2022-bounded-fulltext-evidence
          path: |
            acquisition-lee-myengjae-2022/summary.txt
            acquisition-lee-myengjae-2022/report.json
            acquisition-lee-myengjae-2022/route-signals.txt
            acquisition-lee-myengjae-2022/rendered-*.png
          if-no-files-found: warn
          retention-days: 1
