name: Relationship Spouse T8 Lee Myengjae 2022 Fulltext Acquisition

on:
  pull_request:
    paths:
      - 'scripts/acquire-relationship-spouse-t8-lee-myengjae-2022.py'
      - '.github/workflows/relationship-spouse-t8-lee-myengjae-fulltext-acquisition.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire-public-fulltext:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install extraction and rendering dependencies
        run: python -m pip install --disable-pip-version-check 'pypdf[crypto]' pymupdf
      - name: Probe public KCI / DOI routes only
        run: python scripts/acquire-relationship-spouse-t8-lee-myengjae-2022.py
      - name: Probe bounded public route signals
        run: |
          python - <<'PY' | tee acquisition-lee-myengjae-2022/route-signals.txt
          import html, re
          from urllib.request import Request, urlopen
          from urllib.parse import urljoin

          urls = [
              'https://www.kci.go.kr/kciportal/ci/sereArticleSearch/ciSereArtiView.kci?sereArticleSearchBean.artiId=ART002833924',
              'https://scholar.kyobobook.co.kr/article/detail/4010047338431',
              'https://www.humanchina.or.kr/',
          ]
          markers = (
              '원문', 'artiPreView', 'download', 'builderDownload', 'artId', 'barcode',
              'kyoboKey', 'fnViewPdf', 'pdf', 'ART002833924', '4010047338431',
              'selectKyoboThesis', 'thesis',
          )
          ua = 'Mozilla/5.0 (compatible; MyeongHa-Research-Acquisition/6.2; public-resource-verification)'
          for url in urls:
              print('\n=== URL', url, '===')
              try:
                  with urlopen(Request(url, headers={'User-Agent': ua}), timeout=35) as r:
                      raw = r.read(2_000_000)
                      final = r.geturl()
                      ctype = r.headers.get('Content-Type')
                  text = raw.decode('utf-8', errors='replace')
                  print('status=200 final=', final, 'type=', ctype, 'bytes=', len(raw))
                  print('script-srcs:')
                  for src in re.findall(r'<script[^>]+src=["\']([^"\']+)', text, re.I)[:80]:
                      print(' ', urljoin(final, html.unescape(src)))
                  seen = set(); count = 0
                  print('bounded-signals:')
                  low = text.lower()
                  for marker in markers:
                      start = 0
                      needle = marker.lower()
                      while count < 40:
                          idx = low.find(needle, start)
                          if idx < 0: break
                          lo=max(0, idx-360); hi=min(len(text), idx+720)
                          frag=re.sub(r'\s+', ' ', html.unescape(text[lo:hi])).strip()
                          key=frag[:240]
                          if key not in seen:
                              seen.add(key); count += 1
                              print(f'[{marker}]', frag)
                          start=idx+len(needle)
                      if count >= 40: break
                  print('quoted-route-candidates:')
                  q=[]
                  for s in re.findall(r'["\']([^"\']{1,600})["\']', text):
                      sl=s.lower()
                      if any(k in sl for k in ('pdf','download','preview','original','fulltext','builder','article/detail','thesis')) or 'ART002833924' in s or '4010047338431' in s:
                          s=html.unescape(s)
                          if s not in q: q.append(s)
                  for s in q[:100]: print(' ', s)
              except Exception as e:
                  print('ERROR', type(e).__name__, str(e))
          PY
      - name: Print bounded acquisition evidence
        if: always()
        run: |
          test -f acquisition-lee-myengjae-2022/summary.txt && cat acquisition-lee-myengjae-2022/summary.txt || true
          test -f acquisition-lee-myengjae-2022/report.json && python - <<'PY'
          import json
          from pathlib import Path
          p=Path('acquisition-lee-myengjae-2022/report.json')
          if p.exists():
              j=json.loads(p.read_text())
              print(json.dumps({
                  'directPdfAcquired':j.get('directPdfAcquired'),
                  'candidate':j.get('candidate'),
                  'pdfs':j.get('pdfs'),
              }, ensure_ascii=False, indent=2))
          PY
      - name: Enforce identity boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('acquisition-lee-myengjae-2022/report.json').read_text())
          assert j['candidate']['kciArticleId']=='ART002833924'
          assert j['candidate']['doi']=='10.35955/JCH.2022.04.80.273'
          print('Acquisition probe completed; directPdfAcquired=', j['directPdfAcquired'])
          PY
      - name: Upload bounded rendered-page evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lee-myengjae-2022-bounded-fulltext-evidence
          path: |
            acquisition-lee-myengjae-2022/summary.txt
            acquisition-lee-myengjae-2022/report.json
            acquisition-lee-myengjae-2022/route-signals.txt
            acquisition-lee-myengjae-2022/rendered-*.png
          if-no-files-found: warn
          retention-days: 1
