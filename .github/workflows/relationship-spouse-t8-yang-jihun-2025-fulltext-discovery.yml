name: Relationship Spouse T8 Yang Jihun 2025 Fulltext Discovery

on:
  pull_request:
    paths:
      - 'scripts/discover-relationship-spouse-t8-yang-jihun-2025-public-identity.py'
      - 'scripts/inspect-relationship-spouse-t8-yang-jihun-2025-riss-public-routes.py'
      - 'scripts/follow-relationship-spouse-t8-yang-jihun-2025-riss-fulltext-dispatcher.py'
      - 'scripts/follow-relationship-spouse-t8-yang-jihun-2025-riss-authored-dcollection-route.py'
      - 'scripts/review-relationship-spouse-t8-yang-jihun-2025-decisive-pages.py'
      - '.github/workflows/relationship-spouse-t8-yang-jihun-2025-fulltext-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover-current-public-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded PDF reader
        run: python -m pip install --disable-pip-version-check pypdf==6.0.0
      - name: Discover exact current public RISS identity
        run: python scripts/discover-relationship-spouse-t8-yang-jihun-2025-public-identity.py
      - name: Inspect exact RISS public route contracts
        run: python scripts/inspect-relationship-spouse-t8-yang-jihun-2025-riss-public-routes.py
      - name: Follow exact site-authored RISS fulltext dispatcher once
        run: python scripts/follow-relationship-spouse-t8-yang-jihun-2025-riss-fulltext-dispatcher.py
      - name: Follow exact RISS-authored UBE dCollection route
        run: python scripts/follow-relationship-spouse-t8-yang-jihun-2025-riss-authored-dcollection-route.py
      - name: Inspect acquired PDF and extract complete text when present
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          from pypdf import PdfReader
          root=Path('acquisition-yang-jihun-2025')
          report=json.loads((root/'report.json').read_text(encoding='utf-8'))
          pdf=root/'yang-jihun-2025.pdf'
          inspection={'observed':pdf.exists(),'pages':0,'bytes':0,'sha256':None,'encrypted':None,'textChars':0}
          if pdf.exists():
              body=pdf.read_bytes(); reader=PdfReader(str(pdf)); texts=[]
              for i,page in enumerate(reader.pages,start=1):
                  texts.append(f'\n===== PHYSICAL_PDF_PAGE_{i} =====\n{page.extract_text() or ""}')
              full=''.join(texts); (root/'yang-jihun-2025.txt').write_text(full,encoding='utf-8')
              inspection.update({'pages':len(reader.pages),'bytes':len(body),'sha256':hashlib.sha256(body).hexdigest(),'encrypted':bool(reader.is_encrypted),'textChars':len(full)})
              report['pdfInspection']=inspection
              report['fullLengthPdfAcquired']=len(reader.pages)>=70 and len(full)>=30000
              report['semanticDisposition']='DIRECT_BODY_READY_FOR_REVIEW' if report['fullLengthPdfAcquired'] else 'PARTIAL_OR_INVALID_PDF_NO_BODY_DECISION'
          else:
              report['pdfInspection']=inspection; report['fullLengthPdfAcquired']=False; report['semanticDisposition']='CURRENT_PUBLIC_ACCESS_BOUNDARY_ONLY_NO_BODY_LEVEL_DECISION'
          (root/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(inspection,ensure_ascii=False,indent=2)); print('semanticDisposition=',report['semanticDisposition'])
          PY
      - name: Extract decisive body pages with layout-preserving text
        run: python scripts/review-relationship-spouse-t8-yang-jihun-2025-decisive-pages.py
      - name: Print bounded spouse and modern-applicability contexts when body exists
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          p=Path('acquisition-yang-jihun-2025/yang-jihun-2025.txt')
          if not p.exists():
              print('No complete thesis body acquired; semantic review intentionally skipped.'); raise SystemExit(0)
          t=p.read_text(encoding='utf-8')
          for term in ['남편','배우자','관성','재성','곤명','여명','여성','결혼','혼인','가부장','현대사회','현대 사회','타당성','육친','자식','자녀']:
              print(f'\n### TERM {term}'); shown=0
              for m in re.finditer(re.escape(term),t,re.I):
                  print(re.sub(r'\s+',' ',t[max(0,m.start()-450):min(len(t),m.end()+1100)])); shown+=1
                  if shown>=10: break
              print('COUNT_SHOWN',shown)
          PY
      - name: Enforce no-guessing and no-bypass boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('acquisition-yang-jihun-2025')
          j=json.loads((root/'public-route-report.json').read_text(encoding='utf-8'))
          d=json.loads((root/'riss-dispatcher-report.json').read_text(encoding='utf-8'))
          c=json.loads((root/'dcollection-route-report.json').read_text(encoding='utf-8'))
          assert j['candidate']['author']=='양지훈'
          assert j['exactRow']['control']=='a0a78b8578ab695effe0bdc3ef48d419'
          assert j['exactRow']['rissId']=='T17159723'
          assert j['exactRow']['uci']=='I804:44032-200000847815'
          for x in (j,d,c):
              assert x['guessedOpaqueIdentifierCount']==0
              assert x['loginBypass'] is False
              assert x['institutionAuthBypass'] is False
              assert x['paywallBypass'] is False
              assert x['drmRequestExecuted'] is False
              assert x['decryptionActionExecuted'] is False
          print('Yang Jihun 2025 exact public fulltext/no-bypass boundary verified')
          PY
      - name: Upload bounded route evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yang-jihun-2025-public-route-evidence
          path: |
            acquisition-yang-jihun-2025/report.json
            acquisition-yang-jihun-2025/public-route-report.json
            acquisition-yang-jihun-2025/riss-dispatcher-report.json
            acquisition-yang-jihun-2025/dcollection-route-report.json
            acquisition-yang-jihun-2025/decisive-pages.json
            acquisition-yang-jihun-2025/riss-title-search-*.html
            acquisition-yang-jihun-2025/riss-detail.html
            acquisition-yang-jihun-2025/riss-script-*.txt
            acquisition-yang-jihun-2025/riss-fulltext-dispatch-response.html
            acquisition-yang-jihun-2025/dcollection-*.html
            acquisition-yang-jihun-2025/yang-jihun-2025.pdf
            acquisition-yang-jihun-2025/yang-jihun-2025.txt
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0
