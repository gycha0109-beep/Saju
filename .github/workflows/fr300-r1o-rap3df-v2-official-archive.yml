name: "[WT:face-reading] FR300-R1O RAP3DF V2 Official Archive"

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/acquire-fr300-r1o-rap3df-v2-official-archive.mjs"
      - "research/face-reading/fr300-r1o-rap3df-v2-official-archive.md"
      - ".github/workflows/fr300-r1o-rap3df-v2-official-archive.yml"

permissions:
  contents: read

jobs:
  bind-official-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Bind exact official V4 archive metadata
        run: node scripts/acquire-fr300-r1o-rap3df-v2-official-archive.mjs
      - name: Upload sanitized metadata evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fr300-r1o-rap3df-v2-official-archive
          path: .fr300-r1o-evidence/rap3df-v2-official-archive.json
          if-no-files-found: warn
          retention-days: 14
