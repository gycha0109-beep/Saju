name: Relationship Spouse T8 Jeon Suhyun 2016 Fulltext Acquisition

on:
  pull_request:
    paths:
      - 'scripts/acquire-relationship-spouse-t8-jeon-suhyun-2016-public-fulltext.py'
      - 'scripts/follow-relationship-spouse-t8-jeon-suhyun-2016-riss-downloading.py'
      - 'scripts/follow-relationship-spouse-t8-jeon-suhyun-2016-dcollection.py'
      - 'scripts/follow-relationship-spouse-t8-jeon-suhyun-2016-public-pdf.py'
      - '.github/workflows/relationship-spouse-t8-jeon-suhyun-2016-fulltext-acquisition.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire-public-fulltext:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover exact RISS and NANET public contracts
        run: python scripts/acquire-relationship-spouse-t8-jeon-suhyun-2016-public-fulltext.py
      - name: Follow exact RISS popup and Downloading contract
        run: python scripts/follow-relationship-spouse-t8-jeon-suhyun-2016-riss-downloading.py
      - name: Follow server-authored Kyonggi dCollection item
        run: python scripts/follow-relationship-spouse-t8-jeon-suhyun-2016-dcollection.py
      - name: Fetch dCollection-authored public PDF target
        run: python scripts/follow-relationship-spouse-t8-jeon-suhyun-2016-public-pdf.py
      - name: Enforce exact identity public-body and no-bypass boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('acquisition-jeon-suhyun-2016/report.json').read_text(encoding='utf-8'))
          f=json.loads(Path('acquisition-jeon-suhyun-2016/follow-report.json').read_text(encoding='utf-8'))
          d=json.loads(Path('acquisition-jeon-suhyun-2016/dcollection-report.json').read_text(encoding='utf-8'))
          q=json.loads(Path('acquisition-jeon-suhyun-2016/public-pdf-report.json').read_text(encoding='utf-8'))
          c=j['candidate']; p=j['policy']; fp=f['policy']; dp=d['policy']; qp=q['policy']
          assert c['author']=='전수현'
          assert c['year']==2016
          assert c['rissControl']=='648380763c455520ffe0bdc3ef48d419'
          assert j['identityDisposition']=='EXACT_RISS_IDENTITY_CONFIRMED'
          assert j['rissFulltextFunctionContractRecovered'] is True
          assert f['popupNavigationContractRecovered'] is True
          assert f['downloadingHopFetched'] is True
          assert d['sourceProvenance']['fromRissDownloadingResponse'] is True
          assert d['sourceProvenance']['itemId']=='000000043819'
          assert d['dcollectionHopFetched'] is True
          assert q['sourceContract']['itemPage']=='https://dcollection.kyonggi.ac.kr/common/orgView/000000043819'
          assert q['sourceContract']['drm']=='N'
          assert q['sourceContract']['agree']=='Y'
          assert q['sourceContract']['ext']=='.pdf'
          assert q['sourceContract']['authoredPublicPdfPath'].startswith('/public_resource/pdf/000000043819_')
          assert q['isPdf'] is True
          assert q['pdfHeader'].startswith('%PDF-')
          assert q['fetch']['bytes'] > 1000000
          assert p['guessedOpaqueIdentifierCount']==0
          assert fp['guessedOpaqueIdentifierCount']==0
          assert dp['guessedOpaqueIdentifierCount']==0
          assert qp['guessedOpaqueIdentifierCount']==0
          assert fp['onlyServerAuthoredValuesUsed'] is True
          assert dp['onlyServerAuthoredTargetFollowed'] is True
          assert qp['onlyPageAuthoredPublicPdfTargetFollowed'] is True
          for policy in (p, fp, dp, qp):
              assert policy['loginBypass'] is False
              assert policy['institutionAuthBypass'] is False
              assert policy['paywallBypass'] is False
              assert policy['drmRequestExecuted'] is False
              assert policy['decryptionActionExecuted'] is False
          print('Jeon Suhyun 2016 exact public PDF body acquired through site-authored chain')
          PY
      - name: Upload bounded acquisition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jeon-suhyun-2016-public-fulltext-acquisition-evidence
          path: |
            acquisition-jeon-suhyun-2016/report.json
            acquisition-jeon-suhyun-2016/follow-report.json
            acquisition-jeon-suhyun-2016/dcollection-report.json
            acquisition-jeon-suhyun-2016/public-pdf-report.json
            acquisition-jeon-suhyun-2016/jeon-suhyun-2016-fulltext.pdf
            acquisition-jeon-suhyun-2016/*-response.html
            acquisition-jeon-suhyun-2016/*-response.pdf
            acquisition-jeon-suhyun-2016/*-response.bin
            acquisition-jeon-suhyun-2016/riss-script-*.js
            acquisition-jeon-suhyun-2016/nanet-search-response.html
            acquisition-jeon-suhyun-2016/follow-*.html
            acquisition-jeon-suhyun-2016/follow-*.pdf
            acquisition-jeon-suhyun-2016/follow-*.bin
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0
