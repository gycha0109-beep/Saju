name: Relationship Spouse T8 Lee Sangcheon 2017 Fulltext Acquisition

on:
  pull_request:
    paths:
      - 'scripts/acquire-relationship-spouse-t8-lee-sangcheon-2017-fulltext.py'
      - 'scripts/probe-relationship-spouse-t8-lee-sangcheon-2017-riss-dispatcher.py'
      - 'scripts/probe-relationship-spouse-t8-lee-sangcheon-2017-nanet-dispatcher.py'
      - '.github/workflows/relationship-spouse-t8-lee-sangcheon-2017-fulltext-acquisition.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire-public-fulltext:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF inspection dependencies
        run: python -m pip install --disable-pip-version-check 'pypdf[crypto]' pymupdf
      - name: Probe exact public RISS dispatcher implementation
        run: python scripts/probe-relationship-spouse-t8-lee-sangcheon-2017-riss-dispatcher.py
      - name: Probe exact public NANET dispatcher implementation
        run: python scripts/probe-relationship-spouse-t8-lee-sangcheon-2017-nanet-dispatcher.py
      - name: Probe public thesis fulltext routes only
        run: python scripts/acquire-relationship-spouse-t8-lee-sangcheon-2017-fulltext.py
      - name: Print bounded RISS dispatcher evidence
        if: always()
        run: |
          test -f acquisition-lee-sangcheon-2017/riss-dispatcher.json && python - <<'PY'
          import json
          from pathlib import Path
          p = Path('acquisition-lee-sangcheon-2017/riss-dispatcher.json')
          if p.exists():
              j = json.loads(p.read_text())
              print(json.dumps({
                  'target': j.get('target'),
                  'detail': j.get('detail'),
                  'pageAuthoredFulltextCalls': j.get('pageAuthoredFulltextCalls'),
                  'docControlNo': j.get('docControlNo'),
                  'originalCheck': j.get('originalCheck'),
                  'originalCheckBody': j.get('originalCheckBody'),
                  'sources': [
                      {
                          'source': x.get('source'),
                          'targetCalls': x.get('targetCalls'),
                          'patterns': [m.get('pattern') for m in x.get('matches', [])],
                      }
                      for x in j.get('sources', [])
                  ],
              }, ensure_ascii=False, indent=2))
          PY
      - name: Print bounded NANET dispatcher evidence
        if: always()
        run: |
          test -f acquisition-lee-sangcheon-2017/nanet-dispatcher.json && python - <<'PY'
          import json
          from pathlib import Path
          p = Path('acquisition-lee-sangcheon-2017/nanet-dispatcher.json')
          if p.exists():
              j = json.loads(p.read_text())
              print(json.dumps({
                  'target': j.get('target'),
                  'surfaceAvailable': j.get('surfaceAvailable'),
                  'surfaceUnavailable': j.get('surfaceUnavailable'),
                  'surfaces': j.get('surfaces'),
                  'pageCalls': j.get('pageCalls'),
                  'viewerContractObservedThisRun': j.get('viewerContractObservedThisRun'),
                  'viewerContract': j.get('viewerContract'),
                  'viewerAttempt': j.get('viewerAttempt'),
                  'viewerPdfPrivateFile': j.get('viewerPdfPrivateFile'),
                  'downloadBoundary': j.get('downloadBoundary'),
                  'scriptFetchSummary': j.get('scriptFetchSummary'),
              }, ensure_ascii=False, indent=2))
          PY
      - name: Print bounded acquisition evidence
        if: always()
        run: |
          test -f acquisition-lee-sangcheon-2017/summary.txt && cat acquisition-lee-sangcheon-2017/summary.txt || true
          test -f acquisition-lee-sangcheon-2017/report.json && python - <<'PY'
          import json
          from pathlib import Path
          p = Path('acquisition-lee-sangcheon-2017/report.json')
          if p.exists():
              j = json.loads(p.read_text())
              print(json.dumps({
                  'candidate': j.get('candidate'),
                  'siteAuthoredRoutes': j.get('siteAuthoredRoutes'),
                  'fullLengthPdfAcquired': j.get('fullLengthPdfAcquired'),
                  'pdfs': j.get('pdfs'),
              }, ensure_ascii=False, indent=2))
          PY
      - name: Enforce acquisition identity boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          j = json.loads(Path('acquisition-lee-sangcheon-2017/report.json').read_text())
          c = j['candidate']
          assert c['author'] == '이상천'
          assert c['year'] == 2017
          assert c['nanetControlNo'] == 'KDMT1201802346'
          assert '부처(夫妻)' in c['spouseChapterToc']

          r = json.loads(Path('acquisition-lee-sangcheon-2017/riss-dispatcher.json').read_text())
          t = r['target']
          assert t['author'] == '이상천'
          assert t['controlNo'] == '7dedd951a2b45b77ffe0bdc3ef48d419'
          assert t['pMatType'] == 'be54d9b8bc7cdb09'
          assert t['pSubmatType'] == 'f1a8c7a1de0e08b8'
          assert t['fulltextKind'] == 'a8cb3aaead67ab5b'

          n = json.loads(Path('acquisition-lee-sangcheon-2017/nanet-dispatcher.json').read_text())
          assert n['target']['author'] == '이상천'
          assert n['target']['controlNo'] == 'KDMT1201802346'
          if n.get('surfaceUnavailable'):
              assert not n.get('viewerContractObservedThisRun')
              assert n.get('viewerAttempt') is None
              print('NANET availability boundary recorded; no contract or semantic negative inferred.')
          else:
              assert any('viewDoc' in x and 'KDMT1201802346' in x for x in n['pageCalls'])
              assert any('downloadDoc' in x and 'KDMT1201802346' in x for x in n['pageCalls'])
              if n.get('viewerContractObservedThisRun'):
                  assert n.get('viewerContract', {}).get('controlNo') == 'KDMT1201802346'
              assert n.get('downloadBoundary') is None or n['downloadBoundary'].get('executed') is False
          print('Identity boundary verified; fullLengthPdfAcquired=', j['fullLengthPdfAcquired'])
          PY
      - name: Upload bounded evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lee-sangcheon-2017-bounded-fulltext-evidence
          path: |
            acquisition-lee-sangcheon-2017/summary.txt
            acquisition-lee-sangcheon-2017/report.json
            acquisition-lee-sangcheon-2017/riss-dispatcher.json
            acquisition-lee-sangcheon-2017/nanet-dispatcher.json
            acquisition-lee-sangcheon-2017/rendered-*.png
          if-no-files-found: warn
          retention-days: 1
