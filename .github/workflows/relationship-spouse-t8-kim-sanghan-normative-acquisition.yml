name: Relationship Spouse T8 Kim Sanghan Normative Acquisition

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/acquire-relationship-spouse-t8-kim-sanghan-2026.py'
      - '.github/workflows/relationship-spouse-t8-kim-sanghan-normative-acquisition.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire-kim-sanghan-2026:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Probe bounded public scholarly routes
        run: python3 scripts/acquire-relationship-spouse-t8-kim-sanghan-2026.py
      - name: Upload bounded acquisition artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relationship-spouse-t8-kim-sanghan-2026-acquisition
          path: |
            acquisition-kim-sanghan-2026/report.json
            acquisition-kim-sanghan-2026/summary.txt
            acquisition-kim-sanghan-2026/*.txt
            acquisition-kim-sanghan-2026-private/*.pdf
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0
