name: Relationship Spouse T8 Lee Sudong 2021 Fulltext Acquisition

on:
  pull_request:
    paths:
      - 'scripts/acquire-relationship-spouse-t8-lee-sudong-2021.py'
      - 'scripts/probe-relationship-spouse-t8-lee-sudong-2021-earticle.py'
      - '.github/workflows/relationship-spouse-t8-lee-sudong-2021-fulltext-acquisition.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire-public-fulltext:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF inspection dependencies
        run: python -m pip install --disable-pip-version-check 'pypdf[crypto]' pymupdf
      - name: Probe public KCI fulltext routes
        run: python scripts/acquire-relationship-spouse-t8-lee-sudong-2021.py
      - name: Probe public eArticle NRF-linked routes
        run: python scripts/probe-relationship-spouse-t8-lee-sudong-2021-earticle.py
      - name: Print bounded acquisition evidence
        if: always()
        run: |
          test -f acquisition-lee-sudong-2021/summary.txt && cat acquisition-lee-sudong-2021/summary.txt || true
          test -f acquisition-lee-sudong-2021/report.json && python - <<'PY'
          import json
          from pathlib import Path
          p = Path('acquisition-lee-sudong-2021/report.json')
          if p.exists():
              j = json.loads(p.read_text())
              print(json.dumps({
                  'candidate': j.get('candidate'),
                  'htmlDiscoveredOrteFileIds': j.get('htmlDiscoveredOrteFileIds'),
                  'fullLengthPdfAcquired': j.get('fullLengthPdfAcquired'),
                  'downloadAttempts': j.get('downloadAttempts'),
                  'pdfs': j.get('pdfs'),
              }, ensure_ascii=False, indent=2))
          e = Path('acquisition-lee-sudong-2021/earticle-route-signals.json')
          if e.exists():
              j = json.loads(e.read_text())
              print(json.dumps({
                  'earticleSearch': j.get('search'),
                  'candidateLinks': j.get('candidateLinks'),
                  'pdfs': j.get('pdfs'),
                  'fullLengthPdfAcquired': j.get('fullLengthPdfAcquired'),
                  'probes': j.get('probes'),
              }, ensure_ascii=False, indent=2))
          PY
      - name: Enforce identity boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          j = json.loads(Path('acquisition-lee-sudong-2021/report.json').read_text())
          assert j['candidate']['kciArticleId'] == 'ART002782388'
          assert j['candidate']['doi'] == '10.38113/jstc.2021.11.55.255'
          assert j['candidate']['printedPages'] == '255-288'
          print('KCI acquisition complete; fullLengthPdfAcquired=', j['fullLengthPdfAcquired'])
          e = Path('acquisition-lee-sudong-2021/earticle-route-signals.json')
          if e.exists():
              x = json.loads(e.read_text())
              assert x['title'] == '명리학 육친론의 근원적 고찰'
              assert x['doi'] == '10.38113/jstc.2021.11.55.255'
              print('eArticle linked-route probe complete; fullLengthPdfAcquired=', x['fullLengthPdfAcquired'])
          PY
      - name: Upload bounded rendered evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lee-sudong-2021-bounded-fulltext-evidence
          path: |
            acquisition-lee-sudong-2021/summary.txt
            acquisition-lee-sudong-2021/report.json
            acquisition-lee-sudong-2021/earticle-route-signals.json
            acquisition-lee-sudong-2021/rendered-*.png
          if-no-files-found: warn
          retention-days: 1
