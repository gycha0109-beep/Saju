name: FE009 Release Asset Bootstrap CI

on:
  pull_request:
    paths:
      - 'packages/face-reading/src/release-managed-preview-engine-fe009.ts'
      - 'packages/face-reading/src/release-managed-preview-engine-fe009.test.ts'
      - 'packages/face-reading/src/mediapipe-v0-10-35-geometry-metadata-fe009.generated.ts'
      - 'packages/face-reading/src/preview-engine.ts'
      - 'packages/face-reading/src/preview-engine.test.ts'
      - 'scripts/verify-fe008-preview-engine-package.mjs'
      - 'docs/face-engine/fe009-release-asset-bootstrap.md'
      - '.github/workflows/fe009-release-asset-bootstrap-ci.yml'

permissions:
  contents: read

jobs:
  verify-fe009-release-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build Face Reading package
        run: npm run face:build
      - name: Verify FE009 release asset bootstrap
        run: npx vitest run packages/face-reading/src/release-managed-preview-engine-fe009.test.ts packages/face-reading/src/preview-engine.test.ts
      - name: Verify package import boundary
        run: npm run face:verify:preview-package
