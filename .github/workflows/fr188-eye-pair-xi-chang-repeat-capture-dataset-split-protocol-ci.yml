name: FR188 Xi Chang Repeat Capture Dataset Split Protocol CI

on:
  pull_request:
    paths:
      - 'packages/face-reading/src/eye-pair-xi-chang-repeat-capture-dataset-split-protocol-fr188.ts'
      - 'packages/face-reading/src/eye-pair-xi-chang-repeat-capture-dataset-split-protocol-fr188.test.ts'
      - 'research/face-reading/fr188-eye-pair-xi-chang-repeat-capture-dataset-split-protocol.md'
      - '.github/workflows/fr188-eye-pair-xi-chang-repeat-capture-dataset-split-protocol-ci.yml'

permissions:
  contents: read

jobs:
  verify-fr188-repeat-capture-dataset-split-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build Face Reading package
        run: npm run face:build
      - name: Verify FR188 repeat-capture and dataset-split protocol boundary
        run: npx vitest run packages/face-reading/src/eye-pair-xi-chang-repeat-capture-dataset-split-protocol-fr188.test.ts
