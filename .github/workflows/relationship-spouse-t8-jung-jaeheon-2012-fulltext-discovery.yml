name: Relationship Spouse T8 Jung Jaeheon 2012 Fulltext Discovery

on:
  pull_request:
    paths:
      - 'scripts/discover-relationship-spouse-t8-jung-jaeheon-2012-public-identity.py'
      - 'scripts/inspect-relationship-spouse-t8-jung-jaeheon-2012-riss-public-routes.py'
      - 'scripts/follow-relationship-spouse-t8-jung-jaeheon-2012-riss-fulltext-dispatcher.py'
      - '.github/workflows/relationship-spouse-t8-jung-jaeheon-2012-fulltext-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover-current-public-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded PDF reader
        run: python -m pip install --disable-pip-version-check pypdf==6.0.0
      - name: Discover exact current public RISS identity
        run: python scripts/discover-relationship-spouse-t8-jung-jaeheon-2012-public-identity.py
      - name: Inspect exact row-authored RISS and public institutional routes
        run: python scripts/inspect-relationship-spouse-t8-jung-jaeheon-2012-riss-public-routes.py
      - name: Follow exact current site-authored RISS fulltext dispatcher once
        run: python scripts/follow-relationship-spouse-t8-jung-jaeheon-2012-riss-fulltext-dispatcher.py
      - name: Inspect any exact direct public PDF object
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from pypdf import PdfReader
          root=Path('acquisition-jung-jaeheon-2012')
          report=json.loads((root/'public-route-report.json').read_text(encoding='utf-8'))
          pdf=root/'jung-jaeheon-2012.pdf'
          meta={'observed':pdf.exists(),'pages':0,'encrypted':None,'textChars':0}
          if pdf.exists():
              reader=PdfReader(str(pdf)); texts=[]
              for i,page in enumerate(reader.pages,start=1):
                  texts.append(f'\n===== PHYSICAL_PDF_PAGE_{i} =====\n{page.extract_text() or ""}')
              full=''.join(texts)
              (root/'jung-jaeheon-2012.txt').write_text(full,encoding='utf-8')
              meta.update({'pages':len(reader.pages),'encrypted':bool(reader.is_encrypted),'textChars':len(full)})
              report['pdfInspection']=meta
              report['fullLengthPdfAcquired']=len(reader.pages)>=40 and len(full)>10000
              report['semanticDisposition']='DIRECT_BODY_READY_FOR_REVIEW' if report['fullLengthPdfAcquired'] else 'PARTIAL_OR_INVALID_PDF_NO_BODY_DECISION'
          else:
              report['pdfInspection']=meta
              report['fullLengthPdfAcquired']=False
              if report.get('rissDispatcher',{}).get('disposition') in {
                  'RISS_DISPATCHER_LOGIN_OR_AUTH_BOUNDARY_STOP_NO_BYPASS',
                  'RISS_DISPATCHER_DRM_OR_DEDICATED_VIEWER_SIGNAL_STOP_NO_REPLAY',
                  'RISS_DISPATCHER_NO_DIRECT_BODY_ROUTE_OBSERVED',
              }:
                  report['semanticDisposition']='PUBLIC_ACCESS_BOUNDARY_ONLY_NO_DIRECT_BODY_DECISION'
          (root/'public-route-report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(meta,ensure_ascii=False,indent=2))
          print('fullLengthPdfAcquired=',report['fullLengthPdfAcquired'])
          print('semanticDisposition=',report['semanticDisposition'])
          PY
      - name: Print marriage and spouse semantic contexts when body exists
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('acquisition-jung-jaeheon-2012/jung-jaeheon-2012.txt')
          if not p.exists():
              print('No complete thesis text acquired; semantic review intentionally skipped.')
              raise SystemExit(0)
          t=p.read_text(encoding='utf-8')
          for term in ['결혼','혼인','배우자','부부','처','아내','남편','재성','관성','정재','정관','가족관계','이혼','사별','궁','육친','십신']:
              print(f'\n### TERM {term}')
              shown=0
              for m in re.finditer(re.escape(term),t,re.I):
                  print(re.sub(r'\s+',' ',t[max(0,m.start()-500):min(len(t),m.end()+1200)]))
                  shown+=1
                  if shown>=12: break
              print('COUNT_SHOWN',shown)
          PY
      - name: Enforce exact identity and no-bypass boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('acquisition-jung-jaeheon-2012/public-route-report.json').read_text(encoding='utf-8'))
          assert j['candidate']['author']=='정재헌'
          assert j['exactRow']['control']=='1912fbc7d5e6ba29ffe0bdc3ef48d419'
          assert j['exactRow']['year']=='2012'
          assert j['guessedOpaqueIdentifierCount']==0
          assert j['loginBypass'] is False
          assert j['institutionAuthBypass'] is False
          assert j['paywallBypass'] is False
          assert j['drmRequestExecuted'] is False
          assert j['decryptionActionExecuted'] is False
          assert j['crossSourceSemanticStitching'] is False
          d=j['rissDispatcher']
          assert d['dispatcherImplementationObserved'] is True
          assert d['guessedOpaqueIdentifierCount']==0
          assert d['loginBypass'] is False
          assert d['institutionAuthBypass'] is False
          assert d['paywallBypass'] is False
          assert d['drmRequestExecuted'] is False
          assert d['decryptionActionExecuted'] is False
          print('Jung Jaeheon 2012 exact row identity + exact RISS dispatcher/no-bypass boundary verified')
          PY
      - name: Upload bounded discovery/acquisition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jung-jaeheon-2012-public-identity-discovery
          path: |
            acquisition-jung-jaeheon-2012/report.json
            acquisition-jung-jaeheon-2012/public-route-report.json
            acquisition-jung-jaeheon-2012/riss-dispatcher-report.json
            acquisition-jung-jaeheon-2012/riss-fulltext-dispatch-response.html
            acquisition-jung-jaeheon-2012/riss-row-contexts.json
            acquisition-jung-jaeheon-2012/riss-title-search-*.html
            acquisition-jung-jaeheon-2012/riss-exact-title-current.html
            acquisition-jung-jaeheon-2012/riss-detail.html
            acquisition-jung-jaeheon-2012/riss-original-check.txt
            acquisition-jung-jaeheon-2012/riss-script-*.txt
            acquisition-jung-jaeheon-2012/external-*.html
            acquisition-jung-jaeheon-2012/jung-jaeheon-2012.pdf
            acquisition-jung-jaeheon-2012/jung-jaeheon-2012.txt
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0
