name: N27 isolated 1926/1929 primary folio acquisition
on:
  push:
    branches:
      - research/saju/n27-external-folio-acquisition-20261020
    paths:
      - .github/workflows/n27-lower-folio-isolated.yml
permissions:
  contents: read
jobs:
  public-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download only two public Wikimedia facsimiles, preserve provenance and render leaves
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p n27-isolated-20261020
          python3 -m pip install --quiet 'pymupdf>=1.24,<2'
          python3 - <<'PY'
          import pathlib, urllib.request, urllib.error, hashlib, json, time, traceback
          import fitz
          root=pathlib.Path("n27-isolated-20261020")
          sources={
            "1929-lower-168":"https://upload.wikimedia.org/wikipedia/commons/d/d1/NLC511-027032013020556-10361_%E7%A5%9E%E5%B3%B0%E9%80%9A%E8%80%83_%E7%AC%AC2%E5%8D%B7.pdf",
            "1926-single-167":"https://upload.wikimedia.org/wikipedia/commons/5/50/NLC416-12jh004266-48929_%E7%A5%9E%E5%B3%B0%E9%80%9A%E8%80%83.pdf",
          }
          records={}
          for key,url in sources.items():
            out=root/key;out.mkdir(parents=True,exist_ok=True)
            rec={"source":url,"status":"NOT_ACQUIRED","researchOnly":True}
            for attempt in range(1,4):
              try:
                req=urllib.request.Request(url,headers={"User-Agent":"MyeongHa-N27-PublicOriginalPrintResearch/1.0 (public Wikimedia scan; no authentication)","Accept":"application/pdf"})
                with urllib.request.urlopen(req,timeout=55) as resp:
                  data=resp.read(24*1024*1024+1)
                  rec["statusCode"]=resp.status
                  rec["resolvedUrl"]=resp.url
                  rec["mime"]=resp.headers.get("Content-Type","")
                if len(data)>24*1024*1024:raise ValueError("SAFE_SIZE_CAP")
                if not data.startswith(b"%PDF-"):raise ValueError("NOT_PDF_HEADER")
                path=out/"original.pdf";path.write_bytes(data)
                rec.update(status="ORIGINAL_ACQUIRED",attempt=attempt,bytes=len(data),sha256=hashlib.sha256(data).hexdigest())
                doc=fitz.open(stream=data,filetype="pdf")
                rec["pageCount"]=len(doc)
                if len(doc)<100:raise ValueError("UNEXPECTED_SHORT_PDF")
                wanted=sorted(set(list(range(min(16,len(doc))))+list(range(max(0,len(doc)-28),len(doc)))))
                for idx in wanted:
                  p=doc[idx]
                  pix=p.get_pixmap(matrix=fitz.Matrix(2.0,2.0),alpha=False)
                  pix.save(out/f"page-{idx+1:03d}.png")
                rec["renderedPdfPages1Based"]=[x+1 for x in wanted]
                print("N27_SUCCESS",key,rec["bytes"],rec["sha256"],"pages",rec["pageCount"],flush=True)
                break
              except Exception as e:
                rec["lastError"]=repr(e)
                print("N27_ATTEMPT_ERROR",key,attempt,repr(e)[:300],flush=True)
                time.sleep(3)
            records[key]=rec
            (out/"provenance.json").write_text(json.dumps(rec,indent=2,ensure_ascii=False))
          (root/"manifest.json").write_text(json.dumps(records,indent=2,ensure_ascii=False))
          print("N27_FINAL_SUMMARY",json.dumps({k:r["status"] for k,r in records.items()}),flush=True)
          PY
      - name: Preserve only public PDF bytes, rendered end leaves, and metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n27-isolated-1929-lower-and-1926-167-originals
          path: n27-isolated-20261020/
          retention-days: 14
          if-no-files-found: warn
