name: FR130 Methodology Review Governance Trust Anchor Materialization Admission CI

on:
  pull_request:
    paths:
      - 'packages/face-reading/src/five-officers-intake-methodology-review-governance-trust-anchor-materialization-admission-fr130.ts'
      - 'packages/face-reading/src/five-officers-intake-methodology-review-governance-trust-anchor-materialization-admission-fr130.test.ts'
      - 'packages/face-reading/src/five-officers-intake-methodology-review-governance-trust-anchor-materialization-admission-fr130-hardening.test.ts'
      - 'scripts/verify-fr130-methodology-review-governance-trust-anchor-materialization-admission.mjs'
      - '.github/workflows/fr130-methodology-review-governance-trust-anchor-materialization-admission-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-fr130-methodology-review-governance-trust-anchor-materialization-admission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build Face Reading package
        run: npm run face:build
      - name: Verify FR130 methodology review governance trust-anchor materialization admission
        run: npx vitest run packages/face-reading/src/five-officers-intake-methodology-review-governance-trust-anchor-materialization-admission-fr130.test.ts packages/face-reading/src/five-officers-intake-methodology-review-governance-trust-anchor-materialization-admission-fr130-hardening.test.ts
      - name: Verify FR130 exact predecessor and trust-anchor materialization admission chain
        run: node scripts/verify-fr130-methodology-review-governance-trust-anchor-materialization-admission.mjs
