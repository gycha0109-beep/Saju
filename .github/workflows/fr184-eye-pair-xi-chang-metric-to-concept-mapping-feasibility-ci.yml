name: FR184 Xi Chang Metric To Concept Mapping Feasibility CI

on:
  pull_request:
    paths:
      - 'packages/face-reading/src/eye-pair-xi-chang-metric-to-concept-mapping-feasibility-fr184.ts'
      - 'packages/face-reading/src/eye-pair-xi-chang-metric-to-concept-mapping-feasibility-fr184.test.ts'
      - 'research/face-reading/fr184-eye-pair-xi-chang-metric-to-concept-mapping-feasibility.md'
      - '.github/workflows/fr184-eye-pair-xi-chang-metric-to-concept-mapping-feasibility-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-fr184-mapping-feasibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build Face Reading package
        run: npm run face:build
      - name: Verify FR184 fail-closed mapping feasibility boundary
        run: npx vitest run packages/face-reading/src/eye-pair-xi-chang-metric-to-concept-mapping-feasibility-fr184.test.ts
