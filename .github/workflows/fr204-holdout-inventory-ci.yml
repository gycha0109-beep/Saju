name: FR204 Holdout Inventory CI

on:
  push:
    branches:
      - research/fr204-frozen-calibration-holdout
    paths:
      - 'scripts/run-fr204-morphed-holdout-inventory.mjs'
      - 'research/face-reading/fr204-frozen-calibration-holdout.md'
      - '.github/workflows/fr204-holdout-inventory-ci.yml'
  pull_request:
    paths:
      - 'scripts/run-fr204-morphed-holdout-inventory.mjs'
      - '.github/workflows/fr204-holdout-inventory-ci.yml'

permissions:
  contents: read

concurrency:
  group: fr204-inventory-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build face-reading
        run: npm run face:build
      - name: Syntax-check FR204 inventory
        run: node --check scripts/run-fr204-morphed-holdout-inventory.mjs
      - name: Inventory pinned morphed archives
        run: node scripts/run-fr204-morphed-holdout-inventory.mjs
      - name: Upload FR204 inventory receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fr204-morphed-holdout-inventory
          path: artifacts/face-reading/fr204-morphed-holdout-inventory.json
          if-no-files-found: warn
          retention-days: 14
