name: Relationship Spouse T8 Kim Sanghan 2026 Fulltext Recheck

on:
  pull_request:
    paths:
      - 'scripts/inspect-relationship-spouse-t8-kim-sanghan-2026-current-data-manage.py'
      - 'scripts/recheck-relationship-spouse-t8-kim-sanghan-2026-current-public-fulltext.py'
      - 'scripts/verify-relationship-spouse-t8-kim-sanghan-2026-current-publisher-contract.py'
      - '.github/workflows/relationship-spouse-t8-kim-sanghan-2026-fulltext-recheck.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recheck-current-public-fulltext:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Follow current publisher-authored first-stage data route
        run: python scripts/inspect-relationship-spouse-t8-kim-sanghan-2026-current-data-manage.py
      - name: Enforce first-stage no-content/no-bypass boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('acquisition-kim-sanghan-2026-recheck/current-data-manage-report.json').read_text(encoding='utf-8'))
          assert j['currentFirstStageContract']['directlyObservedOnCurrentEntry'] is True
          assert j['currentFirstStageContract']['route']=='/module/thesis/selectKyoboThesisNttListAjax.ink'
          assert j['currentFirstStageContract']['method']=='POST'
          assert j['contentActionExecuted'] is False
          assert j['guessedOpaqueIdentifierCount']==0
          assert j['loginBypass'] is False
          assert j['institutionAuthBypass'] is False
          assert j['paywallBypass'] is False
          print('Kim Sanghan 2026 current first-stage publisher contract verified')
          PY
      - name: Upload current first-stage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kim-sanghan-2026-current-public-fulltext-recheck
          path: |
            acquisition-kim-sanghan-2026-recheck/current-publisher-entry-v2.html
            acquisition-kim-sanghan-2026-recheck/current-data-manage.html
            acquisition-kim-sanghan-2026-recheck/current-data-script-*.txt
            acquisition-kim-sanghan-2026-recheck/current-data-manage-report.json
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0
