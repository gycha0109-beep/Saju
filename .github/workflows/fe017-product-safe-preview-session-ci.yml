name: FE017 Product-Safe Preview Session CI

on:
  pull_request:
    paths:
      - 'packages/face-reading/src/product-safe-browser-preview-session-fe017.ts'
      - 'packages/face-reading/src/product-safe-browser-preview-session-fe017.test.ts'
      - 'packages/face-reading/src/preview-engine.ts'
      - 'packages/face-reading/src/preview-engine.test.ts'
      - 'scripts/verify-fe008-preview-engine-package.mjs'
      - 'docs/face-engine/fe017-product-safe-preview-session.md'
      - '.github/workflows/fe017-product-safe-preview-session-ci.yml'

permissions:
  contents: read

jobs:
  verify-fe017-product-safe-session:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build Face Reading package
        run: npm run face:build
      - name: Verify FE017 reusable product-safe session
        run: npx vitest run packages/face-reading/src/product-safe-browser-preview-session-fe017.test.ts packages/face-reading/src/preview-engine.test.ts
      - name: Verify package import boundary
        run: npm run face:verify:preview-package
