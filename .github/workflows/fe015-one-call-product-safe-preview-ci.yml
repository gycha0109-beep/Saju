name: FE015 One-Call Product-Safe Preview CI

on:
  pull_request:
    paths:
      - 'packages/face-reading/src/one-call-product-safe-browser-preview-fe015.ts'
      - 'packages/face-reading/src/one-call-product-safe-browser-preview-fe015.test.ts'
      - 'packages/face-reading/src/preview-engine.ts'
      - 'packages/face-reading/src/preview-engine.test.ts'
      - 'scripts/verify-fe008-preview-engine-package.mjs'
      - 'docs/face-engine/fe015-one-call-product-safe-preview.md'
      - '.github/workflows/fe015-one-call-product-safe-preview-ci.yml'

permissions:
  contents: read

jobs:
  verify-fe015-one-call-product-safe-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build Face Reading package
        run: npm run face:build
      - name: Verify FE015 composition
        run: npx vitest run packages/face-reading/src/one-call-product-safe-browser-preview-fe015.test.ts packages/face-reading/src/preview-engine.test.ts
      - name: Verify package import boundary
        run: npm run face:verify:preview-package
