name: Relationship Spouse T8 Eum Jonghee 2019 Fulltext Acquisition

on:
  pull_request:
    paths:
      - 'scripts/acquire-relationship-spouse-t8-eum-jonghee-2019-fulltext.py'
      - 'scripts/probe-relationship-spouse-t8-eum-jonghee-2019-riss-dispatcher.py'
      - 'scripts/probe-relationship-spouse-t8-eum-jonghee-2019-nld-source.py'
      - 'scripts/probe-relationship-spouse-t8-eum-jonghee-2019-nld-action-contract.py'
      - '.github/workflows/relationship-spouse-t8-eum-jonghee-2019-fulltext-acquisition.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire-public-fulltext:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install PDF inspection utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Probe exact public RISS dispatcher implementation
        run: python3 scripts/probe-relationship-spouse-t8-eum-jonghee-2019-riss-dispatcher.py

      - name: Probe exact official NLD source relation
        run: python3 scripts/probe-relationship-spouse-t8-eum-jonghee-2019-nld-source.py

      - name: Probe exact NLD action permission contract
        run: python3 scripts/probe-relationship-spouse-t8-eum-jonghee-2019-nld-action-contract.py

      - name: Probe public thesis routes and inspect bounded semantic pages
        run: python3 scripts/acquire-relationship-spouse-t8-eum-jonghee-2019-fulltext.py

      - name: Print bounded RISS dispatcher evidence
        if: always()
        run: |
          test -f acquisition-eum-jonghee-2019/riss-dispatcher.json && python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('acquisition-eum-jonghee-2019/riss-dispatcher.json')
          if p.exists():
              j = json.loads(p.read_text())
              print(json.dumps({
                  'target': j.get('target'),
                  'tuplePresentOnSearchSurface': j.get('tuplePresentOnSearchSurface'),
                  'pageAuthoredFulltextCalls': j.get('pageAuthoredFulltextCalls'),
                  'docControlNo': j.get('docControlNo'),
                  'docType': j.get('docType'),
                  'originalCheckUrl': j.get('originalCheckUrl'),
                  'originalCheckContractFound': j.get('originalCheckContractFound'),
                  'originalCheck': j.get('originalCheck'),
                  'originalCheckBody': j.get('originalCheckBody'),
              }, ensure_ascii=False, indent=2))
          PY

      - name: Print bounded NLD source and action evidence
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for name in ('nld-source.json', 'nld-action-contract.json'):
              p = Path('acquisition-eum-jonghee-2019') / name
              if not p.exists():
                  continue
              j = json.loads(p.read_text())
              if name == 'nld-source.json':
                  out = {
                      'sourceRelationObserved': j.get('sourceRelationObserved'),
                      'sourceUrl': j.get('sourceUrl'),
                      'nldDetail': j.get('nldDetail'),
                      'getDetailInfo': j.get('getDetailInfo'),
                      'getDetailInfoPayload': j.get('getDetailInfoPayload'),
                      'doActionExtObserved': j.get('doActionExtObserved'),
                      'contentActionExecuted': j.get('contentActionExecuted'),
                  }
              else:
                  out = {
                      'targetMetadata': j.get('targetMetadata'),
                      'derivedSiteAuthoredCalls': j.get('derivedSiteAuthoredCalls'),
                      'commonJs': j.get('commonJs'),
                      'doActionExt': j.get('doActionExt'),
                      'doAction': j.get('doAction'),
                      'checkSession': j.get('checkSession'),
                      'doActionRoutes': j.get('doActionRoutes'),
                      'loginOrSessionGateObserved': j.get('loginOrSessionGateObserved'),
                      'contentActionExecuted': j.get('contentActionExecuted'),
                  }
              print(name)
              print(json.dumps(out, ensure_ascii=False, indent=2))
          PY

      - name: Print bounded acquisition evidence
        if: always()
        run: |
          test -f acquisition-eum-jonghee-2019/summary.txt && cat acquisition-eum-jonghee-2019/summary.txt || true
          test -f acquisition-eum-jonghee-2019/report.json && python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('acquisition-eum-jonghee-2019/report.json')
          if p.exists():
              j = json.loads(p.read_text())
              print(json.dumps({
                  'candidate': j.get('candidate'),
                  'observedIds': j.get('observedIds'),
                  'siteAuthoredCandidateUrls': j.get('siteAuthoredCandidateUrls'),
                  'fullLengthPdfAcquired': j.get('fullLengthPdfAcquired'),
                  'pdf': j.get('pdf'),
                  'semanticPages': j.get('semanticPages'),
                  'accessBoundary': j.get('accessBoundary'),
              }, ensure_ascii=False, indent=2))
          PY

      - name: Enforce candidate identity and acquisition boundary
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          j = json.loads(Path('acquisition-eum-jonghee-2019/report.json').read_text())
          c = j['candidate']
          assert c['author'] == '음종희'
          assert c['year'] == 2019
          assert c['title'] == '四柱命理 宮星에 관한 硏究 : 宮에 따른 十星작용을 중심으로'
          assert c['institution'] == '경기대학교 예술대학원'
          assert c['dbpiaNode'] == 'T15047469'
          assert c['kKnowledgeId'] == '281111307'

          r = json.loads(Path('acquisition-eum-jonghee-2019/riss-dispatcher.json').read_text())
          t = r['target']
          assert t['author'] == '음종희'
          assert t['controlNo'] == 'b3c06fb77553c27dffe0bdc3ef48d419'
          assert t['pMatType'] == 'be54d9b8bc7cdb09'
          assert t['pSubmatType'] == 'f1a8c7a1de0e08b8'
          assert t['fulltextKind'] == 'a8cb3aaead67ab5b'
          assert r['tuplePresentOnSearchSurface'] is True
          assert r['docControlNo'] == '15047469'
          assert r['docType'] == 'T'

          n = json.loads(Path('acquisition-eum-jonghee-2019/nld-source.json').read_text())
          assert n['sourceRelationObserved'] is True
          assert 'unicno=142462' in n['sourceUrl']
          assert 'key_id=CAT-000147672' in n['sourceUrl']
          assert n['metadataTargetMatched'] is True
          assert n['contentActionExecuted'] is False

          a = json.loads(Path('acquisition-eum-jonghee-2019/nld-action-contract.json').read_text())
          assert a['targetMetadata']['author100'] == '음종희'
          assert a['targetMetadata']['dataTypeCode'] == 'DT'
          assert a['targetMetadata']['ucCno'] == 'CAT-000147672'
          assert a['targetMetadata']['targetDivCode'] == 'SP'
          assert a['doActionExt'] is not None
          assert a['doAction'] is not None
          assert a['contentActionExecuted'] is False

          if j['fullLengthPdfAcquired']:
              assert j['pdf'] is not None
              assert j['pdf']['bytes'] > 100000
              assert j['pdf']['pages'] is None or j['pdf']['pages'] > 10
              assert j['semanticPages'], 'full thesis acquired but no bounded semantic pages captured'
          print('Eum Jonghee 2019 identity boundary verified; fullLengthPdfAcquired=', j['fullLengthPdfAcquired'])
          PY

      - name: Upload bounded evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eum-jonghee-2019-bounded-fulltext-evidence
          path: |
            acquisition-eum-jonghee-2019/report.json
            acquisition-eum-jonghee-2019/summary.txt
            acquisition-eum-jonghee-2019/riss-dispatcher.json
            acquisition-eum-jonghee-2019/nld-source.json
            acquisition-eum-jonghee-2019/nld-action-contract.json
            acquisition-eum-jonghee-2019/nld-get-detail-info.json
            acquisition-eum-jonghee-2019/nld-detail.txt
            acquisition-eum-jonghee-2019/*.txt
            acquisition-eum-jonghee-2019/semantic-pages/*.txt
            acquisition-eum-jonghee-2019/semantic-pages/*.png
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0
