name: Face Reading Migration Bootstrap v2

on:
  push:
    branches:
      - migration/face-reading-from-myeongha
    paths:
      - .github/workflows/face-reading-migration-bootstrap-v2.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Saju target
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout pinned MyeongHa source
        uses: actions/checkout@v4
        with:
          repository: gycha0109-beep/MyeongHa
          ref: 09fdc7839f2452bcc8022ba368b03d72b23f31dc
          path: _source_myeongha
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Freeze inventory and copy exact Face package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/migrations packages
          rm -rf packages/face-reading
          cp -a _source_myeongha/packages/face-reading packages/face-reading

          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { mkdirSync, readFileSync, writeFileSync } from 'node:fs';

          const sourceSha = '09fdc7839f2452bcc8022ba368b03d72b23f31dc';
          const sourceRepo = 'gycha0109-beep/MyeongHa';
          const sourceDir = '_source_myeongha';
          const git = (...args) => execFileSync('git', ['-C', sourceDir, ...args], { encoding: 'utf8' }).trim();

          const blobs = new Map();
          for (const row of git('ls-tree', '-r', '--full-tree', sourceSha).split('\n').filter(Boolean)) {
            const match = /^(\d+)\s+(\w+)\s+([0-9a-f]{40})\t(.+)$/.exec(row);
            if (!match) throw new Error(`Unparseable ls-tree row: ${row}`);
            const [, mode, type, blobSha, path] = match;
            if (type === 'blob') blobs.set(path, { mode, blobSha });
          }

          let references = [];
          try {
            const found = execFileSync(
              'git',
              ['-C', sourceDir, 'grep', '-Il', '-E', '(@myeongha/face-reading|packages/face-reading|face-reading|Face Reading|FACE_READING)', '--', '.'],
              { encoding: 'utf8' },
            ).trim();
            references = found ? found.split('\n').map((p) => p.replace(/^\.\//u, '')) : [];
          } catch (error) {
            if (error?.status !== 1) throw error;
          }

          const classify = (path) => {
            if (path.startsWith('packages/face-reading/')) return ['package', 'transfer-byte-preserving'];
            if (/^test\/face-reading.*\.test\.[cm]?[jt]s$/u.test(path)) return ['test', 'verification-source-only'];
            if (/^scripts\/face-reading(?:\/|-)/u.test(path)) return ['script', 'historical-source-only'];
            if (/^\.github\/workflows\/face-reading.*\.ya?ml$/u.test(path)) return ['workflow', 'historical-source-only'];
            if (path.startsWith('research-evidence/face-reading/')) return ['evidence', 'historical-source-only'];
            if (/^docs\/FACE_READING.*\.md$/u.test(path)) return ['doc', 'historical-source-only'];
            return ['reference', 'audit-only'];
          };

          const selected = new Set(references);
          for (const path of blobs.keys()) {
            if (
              path.startsWith('packages/face-reading/') ||
              /^test\/face-reading.*\.test\.[cm]?[jt]s$/u.test(path) ||
              /^scripts\/face-reading(?:\/|-)/u.test(path) ||
              /^\.github\/workflows\/face-reading.*\.ya?ml$/u.test(path) ||
              path.startsWith('research-evidence/face-reading/') ||
              /^docs\/FACE_READING.*\.md$/u.test(path)
            ) selected.add(path);
          }

          const files = [...selected].map((path) => {
            const blob = blobs.get(path);
            if (!blob) throw new Error(`Inventory path is not a tracked blob: ${path}`);
            const [category, disposition] = classify(path);
            return { path, blobSha: blob.blobSha, mode: blob.mode, category, disposition };
          }).sort((a, b) => a.path.localeCompare(b.path));

          const packageFiles = files.filter((file) => file.category === 'package');
          if (packageFiles.length !== 91) throw new Error(`Expected 91 Face package files, got ${packageFiles.length}`);
          const packageJson = packageFiles.find((file) => file.path === 'packages/face-reading/package.json');
          if (packageJson?.blobSha !== '7fc9dc90c84b6aabc9887ff974546308466812e2') {
            throw new Error(`Unexpected package.json blob: ${packageJson?.blobSha ?? 'missing'}`);
          }

          const categoryCounts = {};
          for (const file of files) categoryCounts[file.category] = (categoryCounts[file.category] ?? 0) + 1;

          const manifest = {
            schemaVersion: 'face-reading-migration-manifest/v1',
            source: {
              repository: sourceRepo,
              commit: sourceSha,
              rootTreeSha: git('rev-parse', `${sourceSha}^{tree}`),
              packageTreeSha: git('rev-parse', `${sourceSha}:packages/face-reading`),
              packageSrcTreeSha: git('rev-parse', `${sourceSha}:packages/face-reading/src`),
              packageJsonBlobSha: '7fc9dc90c84b6aabc9887ff974546308466812e2'
            },
            target: {
              repository: 'gycha0109-beep/Saju',
              baseCommit: '6483b0bb8821e8ed2a67b699d51ce9e1aa2b07d3',
              path: 'packages/face-reading',
              migrationBranch: 'migration/face-reading-from-myeongha'
            },
            invariants: {
              sourcePackageFileCount: 91,
              packageName: '@myeongha/face-reading',
              packageVersion: '0.0.0',
              mediapipeTasksVisionVersion: '0.10.35',
              historicalProvenanceMustRemainUnchanged: true,
              methodologySemanticChangesAllowed: false
            },
            inventoryMethod: {
              canonicalPathClasses: [
                'packages/face-reading/**',
                'test/face-reading*.test.*',
                'scripts/face-reading-* and scripts/face-reading/**',
                '.github/workflows/face-reading*.yml|yaml',
                'research-evidence/face-reading/**',
                'docs/FACE_READING*.md'
              ],
              supplementaryReferenceGrep: '(@myeongha/face-reading|packages/face-reading|face-reading|Face Reading|FACE_READING)'
            },
            categoryCounts,
            files
          };

          mkdirSync('docs/migrations', { recursive: true });
          writeFileSync('docs/migrations/face-reading-from-myeongha.manifest.json', `${JSON.stringify(manifest, null, 2)}\n`);

          const pkg = JSON.parse(readFileSync('packages/face-reading/package.json', 'utf8'));
          if (pkg.name !== '@myeongha/face-reading' || pkg.version !== '0.0.0' || pkg.dependencies?.['@mediapipe/tasks-vision'] !== '0.10.35') {
            throw new Error('Migrated Face package identity/dependency drift');
          }
          NODE

          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('docs/migrations/face-reading-from-myeongha.manifest.json', 'utf8'));
          for (const file of manifest.files.filter((entry) => entry.category === 'package')) {
            const actual = execFileSync('git', ['hash-object', file.path], { encoding: 'utf8' }).trim();
            if (actual !== file.blobSha) throw new Error(`Byte mismatch ${file.path}: ${actual} != ${file.blobSha}`);
          }
          console.log(`FACE_PACKAGE_BYTE_PARITY_PASS files=${manifest.invariants.sourcePackageFileCount}`);
          NODE

      - name: Add isolated compiler contract and workspace wiring
        shell: bash
        run: |
          set -euo pipefail
          cat > tsconfig.face-reading.json <<'JSON'
          {
            "compilerOptions": {
              "target": "ES2023",
              "module": "NodeNext",
              "moduleResolution": "NodeNext",
              "strict": true,
              "noUncheckedIndexedAccess": true,
              "exactOptionalPropertyTypes": true,
              "noImplicitOverride": true,
              "useUnknownInCatchVariables": true,
              "verbatimModuleSyntax": true,
              "skipLibCheck": true,
              "forceConsistentCasingInFileNames": true,
              "types": ["node"]
            },
            "include": ["packages/face-reading/src/**/*.ts"]
          }
          JSON

          cat > tsconfig.face-reading.build.json <<'JSON'
          {
            "extends": "./tsconfig.face-reading.json",
            "compilerOptions": {
              "declaration": true,
              "declarationMap": true,
              "sourceMap": true,
              "outDir": "./.face-reading-dist",
              "rootDir": "./packages/face-reading/src"
            },
            "include": ["packages/face-reading/src/**/*.ts"],
            "exclude": ["**/*.test.ts"]
          }
          JSON

          cat > scripts/verify-face-reading-migration.mjs <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('docs/migrations/face-reading-from-myeongha.manifest.json', 'utf8'));
          const packageFiles = manifest.files.filter((entry) => entry.category === 'package');
          if (packageFiles.length !== manifest.invariants.sourcePackageFileCount) throw new Error('Manifest package count drift');
          for (const file of packageFiles) {
            const actual = execFileSync('git', ['hash-object', file.path], { encoding: 'utf8' }).trim();
            if (actual !== file.blobSha) throw new Error(`Face package byte drift: ${file.path}`);
          }
          const pkg = JSON.parse(readFileSync('packages/face-reading/package.json', 'utf8'));
          if (pkg.name !== manifest.invariants.packageName) throw new Error('Face package name drift');
          if (pkg.version !== manifest.invariants.packageVersion) throw new Error('Face package version drift');
          if (pkg.dependencies?.['@mediapipe/tasks-vision'] !== manifest.invariants.mediapipeTasksVisionVersion) throw new Error('Face dependency drift');
          console.log(`FACE_READING_MIGRATION_MANIFEST_PASS files=${packageFiles.length}`);
          NODE

          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'package.json';
          const pkg = JSON.parse(readFileSync(path, 'utf8'));
          pkg.workspaces = ['packages/face-reading'];
          pkg.scripts['face:verify:manifest'] = 'node scripts/verify-face-reading-migration.mjs';
          pkg.scripts['face:typecheck'] = 'tsc -p tsconfig.face-reading.json --noEmit';
          pkg.scripts['face:build'] = 'tsc -p tsconfig.face-reading.build.json';
          pkg.scripts['check:face-reading'] = 'npm run face:verify:manifest && npm run face:typecheck && npm run face:build';
          writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'eslint.config.mjs';
          let text = readFileSync(path, 'utf8');
          const before = "ignores: ['dist/**', 'coverage/**', 'node_modules/**']";
          const after = "ignores: ['dist/**', '.face-reading-dist/**', 'coverage/**', 'node_modules/**', 'packages/face-reading/**']";
          if (!text.includes(before)) throw new Error('Unexpected Saju eslint baseline');
          writeFileSync(path, text.replace(before, after));
          NODE

          npm install --package-lock-only --ignore-scripts

      - name: Remove temporary source checkout
        run: rm -rf _source_myeongha

      - name: Commit migration without workflow mutation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/face-reading docs/migrations/face-reading-from-myeongha.manifest.json scripts/verify-face-reading-migration.mjs tsconfig.face-reading.json tsconfig.face-reading.build.json package.json package-lock.json eslint.config.mjs
          git diff --cached --check
          git commit -m 'feat: migrate Face Reading engine from MyeongHa'
          git push origin HEAD:migration/face-reading-from-myeongha
