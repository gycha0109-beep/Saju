name: Relationship Spouse T8 Song Sangseop 2022 RISS Dispatcher Recheck

on:
  pull_request:
    paths:
      - 'scripts/acquire-relationship-spouse-t8-song-sangseop-2022-riss-dispatcher-public-fulltext.py'
      - '.github/workflows/relationship-spouse-t8-song-sangseop-2022-riss-dispatcher-recheck.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recheck-public-fulltext:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Follow page-authored RISS dispatcher to institutional route
        run: python scripts/acquire-relationship-spouse-t8-song-sangseop-2022-riss-dispatcher-public-fulltext.py
      - name: Enforce exact identity public-body and no-bypass boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('acquisition-song-sangseop-2022-riss-dispatcher-recheck/report.json').read_text(encoding='utf-8'))
          c=j['candidate']; p=j['policy']
          assert c['author']=='송상섭'
          assert c['year']==2022
          assert c['rissId']=='T16377357'
          assert c['rissControl']=='6188af0cf49b0838ffe0bdc3ef48d419'
          assert c['priorAccessBoundaryPr']==374
          assert j['identityDisposition']=='EXACT_RISS_IDENTITY_CONFIRMED'
          assert j['dispatcherContractVerified'] is True
          assert j['dcollectionTargetRecoveredFromRiss'] is True
          assert j['dcollectionItemFetched'] is True
          assert j['dcollectionPublicPdfContractRecovered'] is True
          assert j['publicPdfAcquired'] is True
          dc=next(x for x in j['hops'] if x['name']=='dcollectionItem')
          pdf=next(x for x in j['hops'] if x['name']=='publicPdf')
          assert dc['sourceProvenance']['itemId']=='200000631721'
          assert dc['sourceContract']['drm']=='N'
          assert dc['sourceContract']['agreeVariablePresent'] is False
          assert dc['sourceContract']['messageGateEmpty'] is True
          assert dc['sourceContract']['activeNonDrmPublicPdfRedirect'] is True
          assert dc['sourceContract']['expectedFileSize']==1895533
          assert pdf['isPdf'] is True
          assert pdf['sourceContract']['itemId']=='200000631721'
          assert pdf['sourceContract']['sizeMatchesServerMetadata'] is True
          assert p['guessedOpaqueIdentifierCount']==0
          assert p['onlySiteAuthoredPublicRoutesInspected'] is True
          assert p['loginBypass'] is False
          assert p['institutionAuthBypass'] is False
          assert p['paywallBypass'] is False
          assert p['drmRequestExecuted'] is False
          assert p['decryptionActionExecuted'] is False
          print('Song Sangseop 2022 exact public PDF body and bounded route verified')
          print('pdfSha256=', pdf['sha256'])
          print('pdfBytes=', pdf['bytes'])
          PY
      - name: Upload bounded recheck evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: song-sangseop-2022-riss-dispatcher-recheck-evidence
          path: |
            acquisition-song-sangseop-2022-riss-dispatcher-recheck/report.json
            acquisition-song-sangseop-2022-riss-dispatcher-recheck/*-response.html
            acquisition-song-sangseop-2022-riss-dispatcher-recheck/*.js
            acquisition-song-sangseop-2022-riss-dispatcher-recheck/*.pdf
            acquisition-song-sangseop-2022-riss-dispatcher-recheck/*.bin
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0
