name: FR103 NLC Intake Scan Acquisition

on:
  push:
    branches:
      - codex/fr103-nlc-intake-scan-acquisition
    paths:
      - .github/workflows/fr103-nlc-intake-scan-acquisition.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  freeze-evidence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fr103-nlc-intake-scan-acquisition

      - name: Ensure PDF tooling
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pdfinfo >/dev/null 2>&1 || ! command -v pdftoppm >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi

      - name: Download and verify exact NLC 1925 Commons witness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/fr103-nlc-intake
          url='https://upload.wikimedia.org/wikipedia/commons/2/22/NLC416-13jh001662-59167_%E7%A5%9E%E7%9B%B8%E5%85%A8%E7%B7%A8.pdf'
          curl -L --fail --retry 4 --retry-delay 2 --connect-timeout 20 "$url" -o build/fr103-nlc-intake/witness.pdf
          test "$(stat -c '%s' build/fr103-nlc-intake/witness.pdf)" = '19310489'
          test "$(pdfinfo build/fr103-nlc-intake/witness.pdf | awk '/^Pages:/ {print $2}')" = '576'
          test "$(sha256sum build/fr103-nlc-intake/witness.pdf | awk '{print $1}')" = '94167d8d19d47525535b39e18a20c6b315a3a30751c2063bc2492760f1d927af'

      - name: Render and verify exact scan evidence pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/fr103-nlc-intake/rendered
          for page in 87 88; do
            pdftoppm -f "$page" -l "$page" -singlefile -png -r 320 \
              build/fr103-nlc-intake/witness.pdf \
              "build/fr103-nlc-intake/rendered/page-${page}"
          done
          test "$(sha256sum build/fr103-nlc-intake/rendered/page-87.png | awk '{print $1}')" = '9a3cbda77616c6c359e2aaca173d8f4d3c7ef867449247d9d3887847d9882073'
          test "$(sha256sum build/fr103-nlc-intake/rendered/page-88.png | awk '{print $1}')" = '5ceedcabaa806ab2a4a55a1923681b5b7b246b01c62af42ee8ba56413d207fce'

      - name: Freeze provenance evidence in repository
        shell: bash
        run: |
          set -euo pipefail
          evidence='packages/face-reading/evidence/fr103'
          mkdir -p "$evidence"
          cp build/fr103-nlc-intake/rendered/page-87.png "$evidence/nlc-1925-page-87.png"
          cp build/fr103-nlc-intake/rendered/page-88.png "$evidence/nlc-1925-page-88.png"
          cat > "$evidence/acquisition-provenance.json" <<'JSON'
          {
            "schemaVersion": "fr103-nlc-scan-acquisition-provenance-v1",
            "witnessId": "witness.shenxiang_quanbian.nlc_1925",
            "sourceFilePageRef": "https://commons.wikimedia.org/wiki/File:NLC416-13jh001662-59167_神相全編.pdf",
            "sourcePdfSha256": "sha256:94167d8d19d47525535b39e18a20c6b315a3a30751c2063bc2492760f1d927af",
            "sourcePdfSizeBytes": 19310489,
            "sourcePdfPageCount": 576,
            "renderTool": "pdftoppm",
            "renderDpi": 320,
            "pages": [
              {
                "pdfPage": 87,
                "repositoryPath": "packages/face-reading/evidence/fr103/nlc-1925-page-87.png",
                "sha256": "sha256:9a3cbda77616c6c359e2aaca173d8f4d3c7ef867449247d9d3887847d9882073",
                "role": "section_start_anchor_candidate"
              },
              {
                "pdfPage": 88,
                "repositoryPath": "packages/face-reading/evidence/fr103/nlc-1925-page-88.png",
                "sha256": "sha256:5ceedcabaa806ab2a4a55a1923681b5b7b246b01c62af42ee8ba56413d207fce",
                "role": "target_passage_candidate"
              }
            ],
            "visualVerificationPerformedByAcquisitionRunner": false,
            "ocrUsedForEvidenceAdmission": false,
            "searchIndexUsedForEvidenceAdmission": false
          }
          JSON

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$evidence"
          if git diff --cached --quiet; then
            echo 'evidence already frozen'
            exit 0
          fi
          git commit -m 'research(face-reading): freeze FR103 NLC page evidence'
          git push origin HEAD:codex/fr103-nlc-intake-scan-acquisition
