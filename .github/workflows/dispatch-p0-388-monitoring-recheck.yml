name: Dispatch P0-OPS-01 Monitoring Recheck

on:
  push:
    branches:
      - ops/dispatch-p0-388-monitoring-recheck-20260922

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch monitoring evidence from exact main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: 770956352752cc5db1afedde94c18a75c749a9ab
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          [[ "$main_sha" == "$EXPECTED_MAIN_SHA" ]]
          gh workflow run production-monitoring-evidence.yml             --repo "$GITHUB_REPOSITORY"             --ref main
