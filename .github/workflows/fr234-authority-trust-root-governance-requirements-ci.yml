name: FR234 Authority Trust-Root Governance Requirements CI

on:
  pull_request:
    paths:
      - 'packages/face-reading/src/observable-morphology-authority-trust-root-governance-requirements-fr234.ts'
      - 'packages/face-reading/src/observable-morphology-authority-trust-root-governance-requirements-fr234.test.ts'
      - 'research/face-reading/fr234-authority-trust-root-governance-requirements.md'
      - '.github/workflows/fr234-authority-trust-root-governance-requirements-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'packages/face-reading/src/observable-morphology-authority-trust-root-governance-requirements-fr234.ts'
      - 'packages/face-reading/src/observable-morphology-authority-trust-root-governance-requirements-fr234.test.ts'
      - 'research/face-reading/fr234-authority-trust-root-governance-requirements.md'
      - '.github/workflows/fr234-authority-trust-root-governance-requirements-ci.yml'

jobs:
  fr234-authority-trust-root-governance-requirements:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run face:build
      - run: npx vitest run packages/face-reading/src/observable-morphology-authority-trust-root-governance-requirements-fr234.test.ts
