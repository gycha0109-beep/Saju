name: Saju 500 Birth Eight-Menu Differentiation Audit

on:
  pull_request:
    paths:
      - 'scripts/saju-500-eight-menu-audit.mjs'
      - 'scripts/saju-500-six-menu-question-coverage.mjs'
      - 'scripts/saju-500-six-menu-question-coverage.node-check.mjs'
      - 'scripts/wealth-official-chapter-demo.mjs'
      - 'src/reading/official-reading-wealth-chapter-synthesis.ts'
      - 'src/reading/official-reading-renderer.ts'
      - 'test/official-reading-wealth-chapter-synthesis.test.ts'
      - '.github/workflows/saju-500-reading-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Execute 500 Real Calculation Cases
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout audit commit
        uses: actions/checkout@v4
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Check six-menu question evidence classification
        run: node --test scripts/saju-500-six-menu-question-coverage.node-check.mjs
      - name: Build the real Saju engine
        run: npm run build
      - name: Test official Wealth chapter composition
        run: npx vitest run test/official-reading-wealth-chapter-synthesis.test.ts test/official-reading-detailed-domain-coverage.test.ts test/official-reading-concise-domain-coverage.test.ts
      - name: Generate official Wealth chapters for two real charts
        run: node scripts/wealth-official-chapter-demo.mjs "$RUNNER_TEMP/wealth-chapters"
      - name: Upload Wealth chapter previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saju-wealth-official-chapters
          path: ${{ runner.temp }}/wealth-chapters/*.html
          if-no-files-found: warn
          retention-days: 30
      - name: Run deterministic 500-case audit with eight actual menu engines
        run: node scripts/saju-500-eight-menu-audit.mjs "$RUNNER_TEMP/saju-500-eight-menu-report.json"
      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saju-500-eight-menu-report
          path: ${{ runner.temp }}/saju-500-eight-menu-report.json
          if-no-files-found: warn
          retention-days: 30
