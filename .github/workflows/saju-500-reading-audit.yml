name: Saju 500 Birth Eight-Menu Differentiation Audit

on:
  pull_request:
    paths:
      - 'scripts/saju-500-eight-menu-audit.mjs'
      - 'scripts/saju-500-root-cause.mjs'
      - 'scripts/saju-500-meaning-diff.mjs'
      - 'scripts/saju-500-quality-gate.mjs'
      - 'scripts/saju-500-contrast-audit.mjs'
      - 'scripts/saju-500-research-closeout.mjs'
      - 'scripts/saju-500-capability-reachability-audit.mjs'
      - 'scripts/saju-500-capability-reachability-check.mjs'
      - 'src/research/general-annual-reading-candidate.ts'
      - 'src/research/general-monthly-reading-candidate.ts'
      - 'src/research/temporal-branch-six-observation.ts'
      - 'src/reading/annual-interpretation-facts.ts'
      - 'src/reading/monthly-interpretation-facts.ts'
      - '.github/workflows/saju-500-reading-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Execute 500 Real Calculation Cases
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout audit commit
        uses: actions/checkout@v4
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Build the real Saju engine
        run: npm run build
      - name: Run deterministic 500-case audit with per-chart source evidence
        env:
          SAJU_500_INCLUDE_CASE_ROWS: '1'
        run: node scripts/saju-500-eight-menu-audit.mjs "$RUNNER_TEMP/saju-500-eight-menu-report.json"
      - name: Verify per-menu coverage and exact source/rule provenance
        run: node scripts/saju-500-quality-gate.mjs "$RUNNER_TEMP/saju-500-eight-menu-report.json" "$RUNNER_TEMP/saju-500-quality-report.json"
      - name: Check same-theme different-natal intentional contrasts
        run: node scripts/saju-500-contrast-audit.mjs "$RUNNER_TEMP/saju-500-eight-menu-report.json" "$RUNNER_TEMP/saju-500-contrast-report.json"
      - name: Adjudicate research quality and distinguish product readiness
        run: node scripts/saju-500-research-closeout.mjs "$RUNNER_TEMP/saju-500-eight-menu-report.json" "$RUNNER_TEMP/saju-500-quality-report.json" "$RUNNER_TEMP/saju-500-contrast-report.json" "$RUNNER_TEMP/saju-500-closeout-report.json"
      - name: Audit calculation, individual meaning, synthesis and real menu delivery
        run: node scripts/saju-500-capability-reachability-audit.mjs "$RUNNER_TEMP/saju-500-eight-menu-report.json" "$RUNNER_TEMP/saju-500-capability-report.json"
      - name: Fail closed on invented code, missing cases or broken provenance
        run: node scripts/saju-500-capability-reachability-check.mjs "$RUNNER_TEMP/saju-500-eight-menu-report.json"
      - name: Upload audit and semantic-quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saju-500-eight-menu-report
          path: |
            ${{ runner.temp }}/saju-500-eight-menu-report.json
            ${{ runner.temp }}/saju-500-quality-report.json
            ${{ runner.temp }}/saju-500-contrast-report.json
            ${{ runner.temp }}/saju-500-closeout-report.json
            ${{ runner.temp }}/saju-500-capability-report.json
          if-no-files-found: warn
          retention-days: 30
