name: Relationship Spouse T8 Jo Manseop 2007 Fulltext Acquisition

on:
  pull_request:
    paths:
      - 'scripts/acquire-relationship-spouse-t8-jo-manseop-2007-nanet-public-fulltext.py'
      - '.github/workflows/relationship-spouse-t8-jo-manseop-2007-fulltext-acquisition.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire-current-public-nanet:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact requested head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Verify exact requested head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          echo "exact_head=$actual"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded PDF reader
        run: python -m pip install --disable-pip-version-check pypdf==6.0.0
      - name: Follow exact NANET page-authored public route only
        run: python scripts/acquire-relationship-spouse-t8-jo-manseop-2007-nanet-public-fulltext.py
      - name: Content-address exact PDF and extract locator text when acquired
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          from pypdf import PdfReader
          root=Path('acquisition-jo-manseop-2007')
          report=json.loads((root/'report.json').read_text(encoding='utf-8'))
          pdf=root/'candidate.pdf'
          meta={'observed':pdf.exists(),'pages':0,'encrypted':None,'textChars':0,'sha256':None,'bytes':0}
          if pdf.exists():
              raw=pdf.read_bytes()
              reader=PdfReader(str(pdf))
              texts=[]
              for i,page in enumerate(reader.pages,start=1):
                  texts.append(f'\n===== PHYSICAL_PDF_PAGE_{i} =====\n{page.extract_text() or ""}')
              full=''.join(texts)
              (root/'candidate.txt').write_text(full,encoding='utf-8')
              meta.update({'pages':len(reader.pages),'encrypted':bool(reader.is_encrypted),'textChars':len(full),'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw)})
              report['pdfMetadata']=meta
              report['fullLengthPdfAcquired']=len(reader.pages)>=100 and len(full)>15000
              report['semanticDisposition']='DIRECT_BODY_READY_FOR_RENDER_REVIEW' if report['fullLengthPdfAcquired'] else 'PARTIAL_PDF_ONLY_NO_BODY_DECISION'
          else:
              report['pdfMetadata']=meta
              report['fullLengthPdfAcquired']=False
          (root/'pdf-metadata.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(meta,ensure_ascii=False,indent=2))
          print('fullLengthPdfAcquired=',report['fullLengthPdfAcquired'])
          PY
      - name: Print spouse semantic locator contexts only
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('acquisition-jo-manseop-2007/candidate.txt')
          if not p.exists():
              print('No complete body; semantic review intentionally skipped.')
              raise SystemExit(0)
          t=p.read_text(encoding='utf-8')
          for term in ['배우자','부부','궁합','남자','여자','남편','아내','처','妻','夫','재성','財星','관성','官星','육신','용신','궁위','일지','日支']:
              print(f'\n### TERM {term}')
              shown=0
              for m in re.finditer(re.escape(term),t,re.I):
                  print(re.sub(r'\s+',' ',t[max(0,m.start()-350):min(len(t),m.end()+800)]))
                  shown+=1
                  if shown>=8: break
              print('COUNT_SHOWN',shown)
          PY
      - name: Enforce exact identity and no-bypass boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('acquisition-jo-manseop-2007/report.json').read_text(encoding='utf-8'))
          c=j['candidate']; p=j['policy']
          assert c['title']=='명리이론과 궁합의 상관관계 연구'
          assert c['author']=='조만섭'
          assert c['year']==2007
          assert c['nanetControl']=='KDMT1200725555'
          assert p['guessedOpaqueIdentifierCount']==0
          assert p['loginBypass'] is False
          assert p['institutionAuthBypass'] is False
          assert p['paywallBypass'] is False
          assert p['drmRequestExecuted'] is False
          assert p['decryptionActionExecuted'] is False
          assert p['accessControlBypass'] is False
          print('Jo Manseop 2007 exact identity + no-bypass boundary verified')
          PY
      - name: Upload bounded acquisition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jo-manseop-2007-bounded-fulltext-evidence
          path: |
            acquisition-jo-manseop-2007/report.json
            acquisition-jo-manseop-2007/pdf-metadata.json
            acquisition-jo-manseop-2007/nanet-*.html
            acquisition-jo-manseop-2007/nanet-*.js
            acquisition-jo-manseop-2007/candidate-hop-*
            acquisition-jo-manseop-2007/candidate.pdf
            acquisition-jo-manseop-2007/candidate.txt
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0
