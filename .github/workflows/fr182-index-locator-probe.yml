name: FR182 Indexed Locator Probe

on:
  pull_request:
    paths:
      - '.github/workflows/fr182-index-locator-probe.yml'

permissions:
  contents: read

jobs:
  locate-and-render-fixed-nlc-witness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Download and verify fixed NLC witness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fr182/rendered
          curl --fail --location --retry 3 --output /tmp/fr182/source.pdf \
            'https://upload.wikimedia.org/wikipedia/commons/2/22/NLC416-13jh001662-59167_%E7%A5%9E%E7%9B%B8%E5%85%A8%E7%B7%A8.pdf'
          printf '%s  %s\n' \
            '94167d8d19d47525535b39e18a20c6b315a3a30751c2063bc2492760f1d927af' \
            '/tmp/fr182/source.pdf' | sha256sum --check --strict
          test "$(pdfinfo /tmp/fr182/source.pdf | awk '/^Pages:/ {print $2}')" = '576'
      - name: Locate FR176 clauses in the PDF indexed text
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/fr182/index-hits.txt
          : > /tmp/fr182/hit-pages.txt
          for page in $(seq 1 576); do
            text="$(pdftotext -f "$page" -l "$page" -layout /tmp/fr182/source.pdf - 2>/dev/null | tr -d '\r\n[:space:]' || true)"
            if printf '%s' "$text" | grep -Eq '達摩相眼|達磨相眼|秀而正|細而長|目大而光|目有三角|目長一寸|目尾相垂'; then
              printf 'PAGE %s\n' "$page" | tee -a /tmp/fr182/index-hits.txt
              for term in '達摩相眼' '達磨相眼' '秀而正' '細而長' '目大而光' '目有三角' '目長一寸' '目尾相垂'; do
                if printf '%s' "$text" | grep -Fq "$term"; then
                  printf '  HIT %s\n' "$term" | tee -a /tmp/fr182/index-hits.txt
                fi
              done
              printf '%s\n' "$page" >> /tmp/fr182/hit-pages.txt
            fi
          done
          sort -nu /tmp/fr182/hit-pages.txt -o /tmp/fr182/hit-pages.txt
          cat /tmp/fr182/index-hits.txt
          test -s /tmp/fr182/hit-pages.txt
      - name: Render indexed-hit pages plus one-page visual context
        shell: bash
        run: |
          set -euo pipefail
          {
            while read -r page; do
              for candidate in "$((page - 1))" "$page" "$((page + 1))"; do
                if [ "$candidate" -ge 1 ] && [ "$candidate" -le 576 ]; then
                  printf '%s\n' "$candidate"
                fi
              done
            done < /tmp/fr182/hit-pages.txt
          } | sort -nu > /tmp/fr182/render-pages.txt
          while read -r page; do
            pdftoppm -f "$page" -l "$page" -singlefile -r 320 -png \
              /tmp/fr182/source.pdf "/tmp/fr182/rendered/nlc-1925-page-${page}"
          done < /tmp/fr182/render-pages.txt
          sha256sum /tmp/fr182/rendered/*.png | tee /tmp/fr182/rendered/sha256sums.txt
      - name: Upload locator and visual-review evidence
        uses: actions/upload-artifact@v4
        with:
          name: fr182-index-locator-and-rendered-context
          path: |
            /tmp/fr182/index-hits.txt
            /tmp/fr182/hit-pages.txt
            /tmp/fr182/render-pages.txt
            /tmp/fr182/rendered/*.png
            /tmp/fr182/rendered/sha256sums.txt
          if-no-files-found: error
          retention-days: 1
