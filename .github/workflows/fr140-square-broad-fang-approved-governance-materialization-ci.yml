name: FR140 Square Broad Fang Approved Governance Materialization CI

on:
  pull_request:
    paths:
      - 'governance/face-reading/square-broad-fang-project-owner-methodology-approval-v1.md'
      - 'governance/face-reading/square-broad-fang-project-owner-annotation-governance-designation-v1.md'
      - 'research/face-reading/fr140-square-broad-fang-approved-governance-materialization.md'
      - 'packages/face-reading/src/five-officers-square-broad-fang-approved-governance-materialization-fr140.ts'
      - 'packages/face-reading/src/five-officers-square-broad-fang-approved-governance-materialization-fr140.test.ts'
      - 'packages/face-reading/src/five-officers-square-broad-fang-approved-governance-materialization-fr140-hardening.test.ts'
      - 'scripts/verify-fr140-square-broad-fang-approved-governance-materialization.mjs'
      - '.github/workflows/fr140-square-broad-fang-approved-governance-materialization-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-fr140-square-broad-fang-approved-governance-materialization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build Face Reading package
        run: npm run face:build
      - name: Verify FR140 approved governance materialization
        run: npx vitest run packages/face-reading/src/five-officers-square-broad-fang-approved-governance-materialization-fr140.test.ts packages/face-reading/src/five-officers-square-broad-fang-approved-governance-materialization-fr140-hardening.test.ts
      - name: Verify FR140 exact authority boundary
        run: node scripts/verify-fr140-square-broad-fang-approved-governance-materialization.mjs
