name: Zhuji Yuanhai Direct Scan Workbench

on:
  pull_request:
    paths:
      - '.github/workflows/research-zhuji-yuanhai-direct-scan-workbench.yml'

permissions:
  contents: read

concurrency:
  group: zhuji-yuanhai-direct-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  inspect:
    name: Render bounded Zhuji 四言獨步
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4

      - name: Install scan tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils jq

      - name: Fetch and verify exact Zhuji 第二冊
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/zhuji
          api=/tmp/zhuji/imageinfo.json

          curl --fail --silent --show-error --get \
            'https://commons.wikimedia.org/w/api.php' \
            --data-urlencode 'action=query' \
            --data-urlencode 'format=json' \
            --data-urlencode 'prop=imageinfo' \
            --data-urlencode 'iiprop=url|sha1|size' \
            --data-urlencode 'titles=File:ZJSLib-FLDB-2458-2 新刊合併官板音義評註淵海子平五卷 第二冊.pdf' \
            --output "$api"

          registered_url="$(jq -r '.query.pages[]?.imageinfo[0]?.url // empty' "$api")"
          api_sha1="$(jq -r '.query.pages[]?.imageinfo[0]?.sha1 // empty' "$api")"
          api_size="$(jq -r '.query.pages[]?.imageinfo[0]?.size // empty' "$api")"

          test -n "$registered_url"
          test "$api_sha1" = 'fae363bb817c0fd6332fa18f879a8ea6687140a9'
          test "$api_size" = '83113601'

          curl --fail --location --silent --show-error "$registered_url" \
            --output /tmp/zhuji/ZJSLib-FLDB-2458-2.pdf

          actual_sha1="$(sha1sum /tmp/zhuji/ZJSLib-FLDB-2458-2.pdf | awk '{print $1}')"
          actual_size="$(stat -c '%s' /tmp/zhuji/ZJSLib-FLDB-2458-2.pdf)"
          pages="$(pdfinfo /tmp/zhuji/ZJSLib-FLDB-2458-2.pdf | awk '/^Pages:/ {print $2}')"

          test "$actual_sha1" = 'fae363bb817c0fd6332fa18f879a8ea6687140a9'
          test "$actual_size" = '83113601'
          test "$pages" = '170'

          printf 'asset=ZJSLib-FLDB-2458-2\nsha1=%s\nbytes=%s\npages=%s\n' \
            "$actual_sha1" "$actual_size" "$pages" \
            > /tmp/zhuji/verified-metadata.txt

      - name: Render direct-review pages 87 through 110
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/zhuji/direct-review
          pdftoppm \
            -f 87 -l 110 \
            -r 180 -gray -png \
            /tmp/zhuji/ZJSLib-FLDB-2458-2.pdf \
            /tmp/zhuji/direct-review/page
          cp /tmp/zhuji/verified-metadata.txt /tmp/zhuji/direct-review/
          printf 'section_title_page=87\nterminal_volume_four_page=110\n' \
            > /tmp/zhuji/direct-review/bounded-window.txt

      - name: Upload bounded direct-review artifact
        uses: actions/upload-artifact@v4
        with:
          name: zhuji-yuanhai-four-yan-dubu-p087-p110
          path: /tmp/zhuji/direct-review
          if-no-files-found: error
          retention-days: 1
