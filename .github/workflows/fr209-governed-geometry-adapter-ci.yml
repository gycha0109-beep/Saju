name: FR209 Governed Geometry Adapter CI

on:
  pull_request:
    paths:
      - 'packages/face-reading/src/governed-geometry-to-fr208-adapter-fr209.ts'
      - 'packages/face-reading/src/governed-geometry-to-fr208-adapter-fr209.test.ts'
      - 'packages/face-reading/src/cross-face-neutral-observable-primitives-fr208.ts'
      - 'packages/face-reading/src/face-reading-whole-face-minimum-measurement-inventory-fr207.ts'
      - 'research/face-reading/fr209-governed-geometry-adapter.md'
      - '.github/workflows/fr209-governed-geometry-adapter-ci.yml'

permissions:
  contents: read

jobs:
  verify-fr209-governed-geometry-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build Face Reading package
        run: npm run face:build
      - name: Verify FR209 governed geometry adapter
        run: npx vitest run packages/face-reading/src/governed-geometry-to-fr208-adapter-fr209.test.ts
