name: FR179 Eye-Pair Direct-Source Morphology Representability Reassessment CI

on:
  pull_request:
    paths:
      - 'packages/face-reading/src/eye-pair-direct-source-morphology-representability-reassessment-fr179.ts'
      - 'packages/face-reading/src/eye-pair-direct-source-morphology-representability-reassessment-fr179.test.ts'
      - 'research/face-reading/fr179-eye-pair-direct-source-morphology-representability-reassessment.md'
      - '.github/workflows/fr179-eye-pair-direct-source-morphology-representability-reassessment-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-fr179-reassessment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build Face Reading package
        run: npm run face:build
      - name: Verify FR179 source representability reassessment boundary
        run: npx vitest run packages/face-reading/src/eye-pair-direct-source-morphology-representability-reassessment-fr179.test.ts
