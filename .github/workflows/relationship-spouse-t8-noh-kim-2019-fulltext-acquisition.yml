name: Relationship Spouse T8 Noh Kim 2019 Fulltext Acquisition

on:
  pull_request:
    paths:
      - 'scripts/acquire-relationship-spouse-t8-noh-kim-2019-kci-public-fulltext.py'
      - '.github/workflows/relationship-spouse-t8-noh-kim-2019-fulltext-acquisition.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire-current-public-kci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded PDF reader
        run: python -m pip install --disable-pip-version-check pypdf==6.0.0
      - name: Inspect current site-authored KCI contracts
        run: python scripts/acquire-relationship-spouse-t8-noh-kim-2019-kci-public-fulltext.py
      - name: Inspect any exact site-authored PDF object
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from pypdf import PdfReader

          root=Path('acquisition-noh-kim-2019')
          report=json.loads((root/'report.json').read_text(encoding='utf-8'))
          pdf=root/'candidate.pdf'
          meta={'observed': pdf.exists(), 'pages': 0, 'encrypted': None, 'textChars': 0}
          if pdf.exists():
              reader=PdfReader(str(pdf))
              texts=[]
              for i,page in enumerate(reader.pages, start=1):
                  texts.append(f'\n===== PHYSICAL_PDF_PAGE_{i} =====\n{page.extract_text() or ""}')
              full=''.join(texts)
              (root/'candidate.txt').write_text(full, encoding='utf-8')
              meta.update({'pages': len(reader.pages), 'encrypted': bool(reader.is_encrypted), 'textChars': len(full)})
              report['fullLengthPdfAcquired'] = 11 <= len(reader.pages) <= 13 and len(full) > 5000
              report['semanticDisposition'] = 'DIRECT_BODY_READY_FOR_REVIEW' if report['fullLengthPdfAcquired'] else 'PARTIAL_PDF_ONLY_NO_BODY_DECISION'
          (root/'pdf-metadata.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(meta,ensure_ascii=False,indent=2))
          print('fullLengthPdfAcquired=', report['fullLengthPdfAcquired'])
          PY
      - name: Print spouse and equality semantic contexts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('acquisition-noh-kim-2019/candidate.txt')
          if not p.exists():
              print('No complete article text acquired; semantic review intentionally skipped.')
              raise SystemExit(0)
          t=p.read_text(encoding='utf-8')
          for term in ['처재','妻財','배우자','아내','남편','남녀평등','가부장','재성','관성','사주','일지','십신','육친','배려','존중']:
              print(f'\n### TERM {term}')
              shown=0
              for m in re.finditer(re.escape(term),t,re.I):
                  print(re.sub(r'\s+',' ',t[max(0,m.start()-400):min(len(t),m.end()+900)]))
                  shown+=1
                  if shown>=10: break
              print('COUNT_SHOWN',shown)
          PY
      - name: Enforce exact identity and no-bypass boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('acquisition-noh-kim-2019/report.json').read_text(encoding='utf-8'))
          assert j['candidate']['authors']==['노희범','김성덕']
          assert j['candidate']['year']==2019
          assert j['candidate']['kci']=='ART002459146'
          assert j['candidate']['doi']=='10.22143/HSS21.10.2.15'
          assert j['fallbackOrteFileIdsTried']==[]
          assert j['guessedOpaqueIdentifierCount']==0
          assert j['loginBypass'] is False
          assert j['institutionAuthBypass'] is False
          assert j['paywallBypass'] is False
          assert j['drmRequestExecuted'] is False
          assert j['decryptionActionExecuted'] is False
          print('Noh/Kim 2019 exact identity + no-bypass boundary verified')
          PY
      - name: Upload bounded evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noh-kim-2019-bounded-fulltext-evidence
          path: |
            acquisition-noh-kim-2019/report.json
            acquisition-noh-kim-2019/contract-snippets.json
            acquisition-noh-kim-2019/pdf-metadata.json
            acquisition-noh-kim-2019/detail.html
            acquisition-noh-kim-2019/original-view.html
            acquisition-noh-kim-2019/candidate.pdf
            acquisition-noh-kim-2019/candidate.txt
            acquisition-noh-kim-2019/script-*.txt
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0
