name: Relationship Spouse T8 RISS Fulltext Function Inspection

on:
  pull_request:
    paths:
      - '.github/workflows/relationship-spouse-t8-riss-fulltext-function-inspection.yml'
      - 'scripts/probe-relationship-spouse-t8-riss-fulltext-function.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-fulltext-function:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect RISS fulltextDownload implementation
        run: python3 scripts/probe-relationship-spouse-t8-riss-fulltext-function.py
      - name: Upload bounded implementation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relationship-spouse-t8-riss-fulltext-function-inspection
          path: acquisition-riss-fulltext-function/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
