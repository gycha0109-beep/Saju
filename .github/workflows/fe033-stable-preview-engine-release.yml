name: FE033 Stable Preview Engine Release

on:
  pull_request:
    paths:
      - 'scripts/build-fe033-stable-preview-engine-release-manifest.mjs'
      - 'scripts/verify-fe033-stable-preview-engine-release.mjs'
      - 'docs/face-engine/fe033-stable-preview-engine-release.md'
      - '.github/workflows/fe033-stable-preview-engine-release.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Immutable release tag, e.g. face-preview-engine-v0.1.0'
        required: true
        type: string
      expected_source_commit:
        description: 'Exact Saju source commit SHA to publish'
        required: true
        type: string
      confirmation:
        description: 'Type PUBLISH_FE023_BROWSER_ENGINE'
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-fe033-release-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run face:build:preview-package
      - name: Build and verify FE024 source handoff
        env:
          FE024_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          node scripts/build-fe024-digest-bound-preview-consumer-handoff.mjs
          node scripts/verify-fe024-digest-bound-preview-consumer-handoff.mjs
      - name: Build FE033 release manifest
        run: |
          node scripts/build-fe033-stable-preview-engine-release-manifest.mjs \
            .artifacts/fe024-digest-bound-preview-consumer-handoff \
            face-preview-engine-v0.1.0 \
            "${{ github.event.pull_request.head.sha }}"
      - name: Verify FE033 release contract
        run: |
          node scripts/verify-fe033-stable-preview-engine-release.mjs \
            .artifacts/fe033-stable-preview-engine-release \
            .artifacts/fe024-digest-bound-preview-consumer-handoff \
            face-preview-engine-v0.1.0 \
            "${{ github.event.pull_request.head.sha }}"

  publish-fe033-release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      EXPECTED_SOURCE_COMMIT: ${{ inputs.expected_source_commit }}
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - name: Validate explicit publish authority
        run: |
          test "$CONFIRMATION" = "PUBLISH_FE023_BROWSER_ENGINE"
          test "$EXPECTED_SOURCE_COMMIT" = "$GITHUB_SHA"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists: $RELEASE_TAG" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag already exists: $RELEASE_TAG" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run face:build:preview-package
      - name: Build and verify source handoff
        env:
          FE024_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          node scripts/build-fe024-digest-bound-preview-consumer-handoff.mjs
          node scripts/verify-fe024-digest-bound-preview-consumer-handoff.mjs
      - name: Build and verify stable release manifest
        run: |
          node scripts/build-fe033-stable-preview-engine-release-manifest.mjs \
            .artifacts/fe024-digest-bound-preview-consumer-handoff \
            "$RELEASE_TAG" \
            "$EXPECTED_SOURCE_COMMIT"
          node scripts/verify-fe033-stable-preview-engine-release.mjs \
            .artifacts/fe033-stable-preview-engine-release \
            .artifacts/fe024-digest-bound-preview-consumer-handoff \
            "$RELEASE_TAG" \
            "$EXPECTED_SOURCE_COMMIT"
      - name: Publish GitHub Release assets
        run: |
          TARBALL=".artifacts/fe024-digest-bound-preview-consumer-handoff/myeongha-face-reading-0.0.0.tgz"
          MANIFEST=".artifacts/fe033-stable-preview-engine-release/release-manifest.json"
          cat > .artifacts/fe033-release-notes.md <<EOF
          FE023 browser preview engine handoff.

          Source commit: `$EXPECTED_SOURCE_COMMIT`
          Release tag: `$RELEASE_TAG`

          Consumers must verify the SHA-256 in `release-manifest.json` before installation.
          This release does not publish to an npm/GitHub Packages registry.
          EOF
          gh release create "$RELEASE_TAG" \
            "$TARBALL#myeongha-face-reading-0.0.0.tgz" \
            "$MANIFEST#release-manifest.json" \
            --target "$EXPECTED_SOURCE_COMMIT" \
            --title "$RELEASE_TAG" \
            --notes-file .artifacts/fe033-release-notes.md
