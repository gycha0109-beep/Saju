name: FR193 Corrected Bounded Coverage Gap Selection CI

on:
  pull_request:
    paths:
      - 'packages/face-reading/src/face-reading-bounded-coverage-gap-selection-fr193.ts'
      - 'packages/face-reading/src/face-reading-bounded-coverage-gap-selection-fr193.test.ts'
      - 'research/face-reading/fr193-bounded-coverage-gap-selection.md'
      - '.github/workflows/fr193-bounded-coverage-gap-selection-ci.yml'

permissions:
  contents: read

jobs:
  verify-fr193-bounded-coverage-gap-selection:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build Face Reading package
        run: npm run face:build
      - name: Verify corrected FR193 bounded coverage gap selection
        run: npx vitest run packages/face-reading/src/face-reading-bounded-coverage-gap-selection-fr193.test.ts
