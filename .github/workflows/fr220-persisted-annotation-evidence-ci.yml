name: FR220 Persisted Annotation Evidence CI

on:
  pull_request:
    paths:
      - 'packages/face-reading/src/observable-morphology-human-review-fr219.ts'
      - 'packages/face-reading/src/observable-morphology-persisted-annotation-intake-fr220.ts'
      - 'packages/face-reading/src/observable-morphology-persisted-annotation-intake-fr220.test.ts'
      - 'scripts/verify-fr220-persisted-annotation-evidence.mjs'
      - 'research/face-reading/fr220-persisted-annotation-evidence-intake.md'
      - '.github/workflows/fr220-persisted-annotation-evidence-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'packages/face-reading/src/observable-morphology-human-review-fr219.ts'
      - 'packages/face-reading/src/observable-morphology-persisted-annotation-intake-fr220.ts'
      - 'packages/face-reading/src/observable-morphology-persisted-annotation-intake-fr220.test.ts'
      - 'scripts/verify-fr220-persisted-annotation-evidence.mjs'
      - 'research/face-reading/fr220-persisted-annotation-evidence-intake.md'
      - '.github/workflows/fr220-persisted-annotation-evidence-ci.yml'

permissions:
  contents: read

jobs:
  verify-fr220-persisted-annotation-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build Face Reading package
        run: npm run face:build
      - name: Verify FR220 persisted evidence contract
        run: npx vitest run packages/face-reading/src/observable-morphology-persisted-annotation-intake-fr220.test.ts
      - name: Verify FR220 persisted evidence CLI round-trip
        run: FR220_SMOKE=1 node scripts/verify-fr220-persisted-annotation-evidence.mjs
