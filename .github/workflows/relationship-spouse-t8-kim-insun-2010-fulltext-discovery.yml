name: Relationship Spouse T8 Kim Insun 2010 Fulltext Discovery

on:
  pull_request:
    paths:
      - 'scripts/acquire-relationship-spouse-t8-kim-insun-2010-public-fulltext.py'
      - '.github/workflows/relationship-spouse-t8-kim-insun-2010-fulltext-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire-current-public-fulltext:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded PDF reader
        run: python -m pip install --disable-pip-version-check pypdf==6.0.0
      - name: Resolve exact title and follow current public RISS route
        run: python scripts/acquire-relationship-spouse-t8-kim-insun-2010-public-fulltext.py
      - name: Print compatibility semantic contexts when body exists
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('acquisition-kim-insun-2010/kim-insun-2010.txt')
          if not p.exists():
              print('No complete body acquired; semantic review intentionally skipped.')
              raise SystemExit(0)
          t=p.read_text(encoding='utf-8')
          for term in ['배우자','부부','궁합','궁합론','납음','일간','일지','궁위','육친','십신','관성','재성','남성','여성','남자','여자','남녀']:
              print(f'\n### TERM {term}')
              n=0
              for m in re.finditer(re.escape(term),t,re.I):
                  print(re.sub(r'\s+',' ',t[max(0,m.start()-500):min(len(t),m.end()+1500)]))
                  n+=1
                  if n>=15: break
              print('COUNT_SHOWN',n)
          PY
      - name: Enforce exact search-card identity and no-bypass boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('acquisition-kim-insun-2010/report.json').read_text(encoding='utf-8'))
          c=j['candidate']; card=j['searchDiscovery']['card']; sig=j['detailIdentitySignals']
          assert c['author']=='김인순' and c['year']==2010 and c['title']=='명리학의 궁합론 연구'
          assert c['institution']=='동방대학원대학교'
          assert isinstance(c['control'],str) and len(c['control'])>20
          assert j['searchDiscovery']['resolutionRule']=='EXACT_SITE_AUTHORED_THESIS_SEARCH_RESULT_CARD_TITLE_AUTHOR_SCHOOL_YEAR_TYPE_AND_LITERAL_DETAIL_ROUTE'
          assert '김인순' in card['etc'] and '2010' in card['etc']
          assert '석사' in card['sameCardBlock'] and '동방' in card['sameCardBlock']
          assert card['control']==c['control']
          assert j['formTuple']['control_no']==c['control']
          assert sig['controlLiteralPresent'] and sig['titleLiteralPresent'] and sig['authorLiteralPresent'] and sig['yearLiteralPresent']
          assert j['guessedOpaqueIdentifierCount']==0
          assert not j['loginBypass'] and not j['institutionAuthBypass'] and not j['paywallBypass']
          assert not j['drmRequestExecuted'] and not j['decryptionActionExecuted']
          assert j['tlsVerificationDisabled'] is False and j['crossSourceSemanticStitching'] is False
          if j['semanticDisposition']=='DIRECT_BODY_ACQUIRED_REQUIRES_RENDER_FIRST_REVIEW':
              assert j['fullLengthPdfAcquired'] is True
              assert j['pdfInspection']['pages']>=50 and j['pdfInspection']['encrypted'] is False
          else:
              assert j['semanticDisposition']=='PUBLIC_ACCESS_BOUNDARY_ONLY_NO_DIRECT_BODY_DECISION'
          print('Kim Insun 2010 exact RISS thesis search-card public route verified')
          print('resolved control=',c['control'])
          print('observed candidate RISS ID=',c['rissId'])
          print('semanticDisposition=',j['semanticDisposition'])
          PY
      - name: Upload bounded acquisition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kim-insun-2010-public-route-evidence
          path: |
            acquisition-kim-insun-2010/report.json
            acquisition-kim-insun-2010/riss-search-*.html
            acquisition-kim-insun-2010/riss-candidate-detail.html
            acquisition-kim-insun-2010/riss-detail.html
            acquisition-kim-insun-2010/riss-script-*.txt
            acquisition-kim-insun-2010/riss-fulltext-dispatch-response.html
            acquisition-kim-insun-2010/dcollection-entry.html
            acquisition-kim-insun-2010/kim-insun-2010.pdf
            acquisition-kim-insun-2010/kim-insun-2010.txt
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0
