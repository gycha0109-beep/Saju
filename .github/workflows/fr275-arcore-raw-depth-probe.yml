name: "[WT:face-research] FR275 ARCore Raw Depth Probe"

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/fr275-arcore-raw-depth-probe/**"
      - ".github/workflows/fr275-arcore-raw-depth-probe.yml"

permissions:
  contents: read

jobs:
  build-probe-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
          log-accepted-android-sdk-licenses: "false"
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"
          cache-provider: basic
      - name: Assemble FR275 probe
        working-directory: tools/fr275-arcore-raw-depth-probe
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: fr275-arcore-raw-depth-probe-apk
          path: tools/fr275-arcore-raw-depth-probe/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
