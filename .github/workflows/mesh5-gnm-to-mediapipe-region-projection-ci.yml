name: MESH5 GNM to MediaPipe 468 Region Projection CI

on:
  pull_request:
    paths:
      - '.github/workflows/mesh5-gnm-to-mediapipe-region-projection-ci.yml'
      - 'packages/face-geometry/**'
      - 'packages/face-reading/assets/canonical-face/mediapipe-v0.10.35.manifest.json'
      - 'scripts/verify-face-geometry-mesh5.mjs'
      - 'tools/face-geometry/gnm/**'
      - 'tools/face-reading/blender/fetch_mediapipe_canonical_face.py'
  workflow_dispatch:

jobs:
  verify-gnm-to-mediapipe468-region-projection:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify repository contract
        run: node scripts/verify-face-geometry-mesh5.mjs
      - name: Install exporter dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Compile Python tooling
        run: |
          python -m py_compile \
            tools/face-reading/blender/fetch_mediapipe_canonical_face.py \
            tools/face-geometry/gnm/fetch_gnm_head.py \
            tools/face-geometry/gnm/export_gnm_region_ontology.py \
            tools/face-geometry/gnm/project_gnm_regions_to_mediapipe468.py \
            tools/face-geometry/gnm/build_mediapipe468_projected_region_scene.py
      - name: Fetch and verify exact MediaPipe canonical asset
        run: |
          python tools/face-reading/blender/fetch_mediapipe_canonical_face.py \
            --output /tmp/mediapipe-canonical-face.obj
      - name: Fetch and verify exact GNM Head asset
        run: |
          python tools/face-geometry/gnm/fetch_gnm_head.py \
            --output /tmp/gnm_head.npz
      - name: Export shared GNM provider-region ontology masks
        run: |
          python tools/face-geometry/gnm/export_gnm_region_ontology.py \
            --npz /tmp/gnm_head.npz \
            --output /tmp/gnm-provider-region-ontology.json
      - name: Project shared GNM regions onto MediaPipe 468
        run: |
          python tools/face-geometry/gnm/project_gnm_regions_to_mediapipe468.py \
            --mediapipe-obj /tmp/mediapipe-canonical-face.obj \
            --gnm-npz /tmp/gnm_head.npz \
            --source-regions /tmp/gnm-provider-region-ontology.json \
            --output /tmp/mediapipe468-region-adapter.json
      - name: Verify projected runtime adapter
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          payload = json.loads(Path('/tmp/mediapipe468-region-adapter.json').read_text())
          assert payload['targetVertexCount'] == 468
          assert payload['regionCount'] == 22
          assert payload['supportedRegionCount'] == 20
          assert payload['unsupportedRegionCount'] == 2
          assert payload['policy']['productNeutral'] is True
          assert payload['policy']['runtimeGNMDependency'] is False
          assert payload['policy']['runtimeBlenderDependency'] is False
          assert payload['policy']['productionMetricAuthorized'] is False
          assert payload['assignment']['semanticSideAssignmentEncoded'] is False
          assert payload['registration']['productionDistanceThreshold'] is None
          assert payload['registration']['subjectSpecificFitting'] is False

          supported = [r for r in payload['regions'] if r['status'] == 'projected_authoring_candidate']
          unsupported = [r for r in payload['regions'] if r['status'] == 'unsupported_on_mediapipe468']
          assert {r['sourceRegionId'] for r in unsupported} == {'left_ear', 'right_ear'}
          assert all(r['vertexCount'] == 0 and r['indices'] == [] for r in unsupported)
          assert all(r['vertexCount'] > 0 for r in supported)

          flat = [index for region in supported for index in region['indices']]
          assert len(flat) == 468
          assert len(set(flat)) == 468
          assert set(flat) == set(range(468))
          assert all(0 <= index < 468 for index in flat)

          for region in supported:
              distance = region['projectionDistanceM']
              assert distance is not None
              assert all(math.isfinite(float(distance[key])) and float(distance[key]) >= 0 for key in ('min', 'median', 'p95', 'max'))

          bilateral_adapter_ids = [
              mapping[key]
              for mapping in payload['assignment']['canonicalAxisSideMapping']
              for key in ('negativeXAdapterRegionId', 'positiveXAdapterRegionId')
          ]
          assert all(region_id.endswith('_negative_x') or region_id.endswith('_positive_x') for region_id in bilateral_adapter_ids)
          assert not any(region_id.startswith('left_') or region_id.startswith('right_') for region_id in bilateral_adapter_ids)
          assert all(mapping['semanticSideAuthorized'] is False for mapping in payload['assignment']['canonicalAxisSideMapping'])

          assert [seed['mediapipeIndex'] for seed in payload['inspectionSeeds']] == [234, 454]
          assert len(payload['vertexAssignments']) == 468
          assert [item['mediapipeIndex'] for item in payload['vertexAssignments']] == list(range(468))
          global_distance = payload['registration']['projectionDistanceM']
          assert all(math.isfinite(float(global_distance[key])) and float(global_distance[key]) >= 0 for key in ('min', 'median', 'p95', 'max'))

          print(json.dumps({
              'supportedRegionCount': payload['supportedRegionCount'],
              'unsupportedRegions': unsupported,
              'projectionDistanceM': global_distance,
              'regionVertexCounts': {region['adapterRegionId']: region['vertexCount'] for region in payload['regions']},
              'inspectionSeeds': payload['inspectionSeeds'],
              'canonicalAxisSideMapping': payload['assignment']['canonicalAxisSideMapping'],
          }, sort_keys=True))
          PY
      - name: Install Blender headless rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y blender xvfb xauth libegl1 libgl1-mesa-dri libglx-mesa0
      - name: Build MediaPipe 468 projected-region scene and previews
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          xvfb-run -a blender --background \
            --python tools/face-geometry/gnm/build_mediapipe468_projected_region_scene.py \
            -- \
            --obj /tmp/mediapipe-canonical-face.obj \
            --adapter /tmp/mediapipe468-region-adapter.json \
            --output /tmp/mediapipe468-region-adapter.blend \
            --metadata-out /tmp/mediapipe468-region-adapter-scene-metadata.json \
            --front-preview-out /tmp/mediapipe468-region-adapter-front.png \
            --three-quarter-preview-out /tmp/mediapipe468-region-adapter-three-quarter.png
      - name: Verify Blender artifacts
        run: |
          test -s /tmp/mediapipe468-region-adapter.blend
          test -s /tmp/mediapipe468-region-adapter-scene-metadata.json
          test -s /tmp/mediapipe468-region-adapter-front.png
          test -s /tmp/mediapipe468-region-adapter-three-quarter.png
          grep -q '"vertexCount": 468' /tmp/mediapipe468-region-adapter-scene-metadata.json
          grep -q '"supportedRegionCount": 20' /tmp/mediapipe468-region-adapter-scene-metadata.json
          grep -q '"runtimeGNMDependency": false' /tmp/mediapipe468-region-adapter-scene-metadata.json
          grep -q '"runtimeBlenderDependency": false' /tmp/mediapipe468-region-adapter-scene-metadata.json
          grep -q '"semanticSideAssignmentEncoded": false' /tmp/mediapipe468-region-adapter-scene-metadata.json
          grep -q '"rollDegrees": 0.0' /tmp/mediapipe468-region-adapter-scene-metadata.json
      - name: Upload MESH5 authoring artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mesh5-gnm-to-mediapipe468-region-projection
          if-no-files-found: error
          retention-days: 14
          path: |
            /tmp/mediapipe468-region-adapter.json
            /tmp/mediapipe468-region-adapter.blend
            /tmp/mediapipe468-region-adapter-scene-metadata.json
            /tmp/mediapipe468-region-adapter-front.png
            /tmp/mediapipe468-region-adapter-three-quarter.png
