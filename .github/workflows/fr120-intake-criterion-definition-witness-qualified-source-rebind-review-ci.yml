name: FR120 Intake Criterion Definition Witness-Qualified Source Rebind Review CI

on:
  pull_request:
    paths:
      - 'packages/face-reading/src/five-officers-intake-criterion-definition-witness-qualified-source-rebind-review-fr120.ts'
      - 'packages/face-reading/src/five-officers-intake-criterion-definition-witness-qualified-source-rebind-review-fr120.test.ts'
      - 'packages/face-reading/src/five-officers-intake-criterion-definition-witness-qualified-source-rebind-review-fr120-hardening.test.ts'
      - 'scripts/verify-fr120-intake-criterion-definition-witness-qualified-source-rebind-review.mjs'
      - '.github/workflows/fr120-intake-criterion-definition-witness-qualified-source-rebind-review-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-fr120-criterion-source-rebind-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build Face Reading package
        run: npm run face:build
      - name: Verify FR120 authority boundary
        run: npx vitest run packages/face-reading/src/five-officers-intake-criterion-definition-witness-qualified-source-rebind-review-fr120.test.ts packages/face-reading/src/five-officers-intake-criterion-definition-witness-qualified-source-rebind-review-fr120-hardening.test.ts
      - name: Verify FR120 exact criterion source rebind chain
        run: node scripts/verify-fr120-intake-criterion-definition-witness-qualified-source-rebind-review.mjs
