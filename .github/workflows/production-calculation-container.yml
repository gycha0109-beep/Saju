name: Production Calculation Container

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Production Container Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production calculation image
        run: docker build --tag "myeonghwa-saju-production:${GITHUB_SHA}" .

      - name: Verify production calculation container
        shell: bash
        run: |
          set -euo pipefail

          image="myeonghwa-saju-production:${GITHUB_SHA}"
          container="myeonghwa-saju-production-smoke"
          bearer='container-smoke-active-token'
          health_body="${RUNNER_TEMP}/saju-container-health.txt"
          unauth_body="${RUNNER_TEMP}/saju-container-unauth.txt"
          auth_body="${RUNNER_TEMP}/saju-container-auth.txt"
          wrong_body="${RUNNER_TEMP}/saju-container-wrong.txt"
          log_file="${RUNNER_TEMP}/saju-container.log"

          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          test "$(docker image inspect --format '{{.Config.User}}' "$image")" = 'node'

          docker run \
            --detach \
            --name "$container" \
            --env "SAJU_PRODUCTION_SERVICE_BEARER=$bearer" \
            --publish 127.0.0.1:18080:3000 \
            "$image" >/dev/null

          test "$(docker exec "$container" id -un)" = 'node'

          health_status=''
          for _ in $(seq 1 30); do
            health_status="$(curl --silent --show-error --output "$health_body" --write-out '%{http_code}' http://127.0.0.1:18080/health || true)"
            if [ "$health_status" = '200' ]; then
              break
            fi
            sleep 1
          done
          test "$health_status" = '200'

          unauth_status="$(curl --silent --show-error --output "$unauth_body" --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{' \
            http://127.0.0.1:18080/api/calculations)"
          test "$unauth_status" = '401'

          auth_status="$(curl --silent --show-error --output "$auth_body" --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $bearer" \
            --header 'Content-Type: application/json' \
            --data '{' \
            http://127.0.0.1:18080/api/calculations)"
          test "$auth_status" = '400'

          wrong_status="$(curl --silent --show-error --output "$wrong_body" --write-out '%{http_code}' \
            --request POST \
            --header 'Authorization: Bearer wrong-container-token' \
            --header 'Content-Type: application/json' \
            --data '{' \
            http://127.0.0.1:18080/api/calculations)"
          test "$wrong_status" = '401'

          for response_file in "$health_body" "$unauth_body" "$auth_body" "$wrong_body"; do
            if grep -Fq "$bearer" "$response_file"; then
              echo 'Production calculation container reflected its service credential in an HTTP response.' >&2
              exit 1
            fi
          done

          docker logs "$container" >"$log_file" 2>&1
          if grep -Fq "$bearer" "$log_file"; then
            echo 'Production calculation container reflected its service credential in logs.' >&2
            exit 1
          fi
