name: FR171 Eye Pair C2PA Witness Credential Admission Readiness CI

on:
  pull_request:
    paths:
      - "research/face-reading/fr170-eye-pair-c2pa-external-trust-root-provisioning.md"
      - "research/face-reading/fr171-eye-pair-c2pa-witness-credential-admission-readiness.md"
      - "packages/face-reading/src/eye-pair-c2pa-external-trust-root-provisioning-fr170.ts"
      - "packages/face-reading/src/eye-pair-c2pa-witness-credential-admission-readiness-fr171.ts"
      - "packages/face-reading/src/eye-pair-c2pa-witness-credential-admission-readiness-fr171.test.ts"
      - ".github/workflows/fr171-eye-pair-c2pa-witness-credential-admission-readiness-ci.yml"
  push:
    branches: [main]
    paths:
      - "research/face-reading/fr170-eye-pair-c2pa-external-trust-root-provisioning.md"
      - "research/face-reading/fr171-eye-pair-c2pa-witness-credential-admission-readiness.md"
      - "packages/face-reading/src/eye-pair-c2pa-external-trust-root-provisioning-fr170.ts"
      - "packages/face-reading/src/eye-pair-c2pa-witness-credential-admission-readiness-fr171.ts"
      - "packages/face-reading/src/eye-pair-c2pa-witness-credential-admission-readiness-fr171.test.ts"
      - ".github/workflows/fr171-eye-pair-c2pa-witness-credential-admission-readiness-ci.yml"

permissions:
  contents: read

jobs:
  fr171-eye-pair-c2pa-witness-credential-admission-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Typecheck Face Reading package
        run: npm run face:typecheck
      - name: Build Face Reading package
        run: npm run face:build
      - name: Fetch immutable C2PA governance snapshot required to reconstruct FR170
        run: |
          mkdir -p .tmp/fr171
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/c2pa-org/conformance-public/6273cdcb4f273c7556e74f93825a7a3df87869fb/trust-list/C2PA-TRUST-LIST.json" \
            --output .tmp/fr171/C2PA-TRUST-LIST.json
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/c2pa-org/conformance-public/6273cdcb4f273c7556e74f93825a7a3df87869fb/conforming-products/conforming-products-list.json" \
            --output .tmp/fr171/conforming-products-list.json
          test -s .tmp/fr171/C2PA-TRUST-LIST.json
          test -s .tmp/fr171/conforming-products-list.json
      - name: Test FR170 predecessor and FR171 fail-closed readiness
        env:
          FR170_C2PA_TRUST_LIST_JSON_PATH: .tmp/fr171/C2PA-TRUST-LIST.json
          FR170_C2PA_CONFORMING_PRODUCTS_JSON_PATH: .tmp/fr171/conforming-products-list.json
        run: >-
          npx vitest run
          packages/face-reading/src/eye-pair-c2pa-external-trust-root-provisioning-fr170.test.ts
          packages/face-reading/src/eye-pair-c2pa-witness-credential-admission-readiness-fr171.test.ts
