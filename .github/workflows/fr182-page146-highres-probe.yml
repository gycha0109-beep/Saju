name: FR182 Page 146 High-Res Probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  render-page146-highres:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install PDF renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Download and verify fixed NLC witness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fr182/highres
          curl --fail --location --retry 3 --output /tmp/fr182/source.pdf \
            'https://upload.wikimedia.org/wikipedia/commons/2/22/NLC416-13jh001662-59167_%E7%A5%9E%E7%9B%B8%E5%85%A8%E7%B7%A8.pdf'
          printf '%s  %s\n' \
            '94167d8d19d47525535b39e18a20c6b315a3a30751c2063bc2492760f1d927af' \
            '/tmp/fr182/source.pdf' | sha256sum --check --strict
          test "$(pdfinfo /tmp/fr182/source.pdf | awk '/^Pages:/ {print $2}')" = '576'

      - name: Render pages 145-147 at 320 DPI
        shell: bash
        run: |
          set -euo pipefail
          for page in 145 146 147; do
            pdftoppm -f "$page" -l "$page" -r 320 -png -singlefile \
              /tmp/fr182/source.pdf "/tmp/fr182/highres/nlc-1925-page-${page}"
          done
          sha256sum /tmp/fr182/highres/*.png | sort | tee /tmp/fr182/highres/SHA256SUMS.txt

      - name: Upload high-resolution visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: fr182-page146-highres-145-147
          path: /tmp/fr182/highres/
          retention-days: 1
          if-no-files-found: error
