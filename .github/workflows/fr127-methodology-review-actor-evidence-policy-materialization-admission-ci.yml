name: FR127 Methodology Review Actor Evidence Policy Materialization Admission CI

on:
  pull_request:
    paths:
      - 'packages/face-reading/src/five-officers-intake-methodology-review-actor-evidence-policy-materialization-admission-fr127.ts'
      - 'packages/face-reading/src/five-officers-intake-methodology-review-actor-evidence-policy-materialization-admission-fr127.test.ts'
      - 'packages/face-reading/src/five-officers-intake-methodology-review-actor-evidence-policy-materialization-admission-fr127-hardening.test.ts'
      - 'scripts/verify-fr127-methodology-review-actor-evidence-policy-materialization-admission.mjs'
      - '.github/workflows/fr127-methodology-review-actor-evidence-policy-materialization-admission-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-fr127-methodology-review-actor-evidence-policy-materialization-admission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build Face Reading package
        run: npm run face:build
      - name: Verify FR127 methodology review actor/evidence-policy materialization admission
        run: npx vitest run packages/face-reading/src/five-officers-intake-methodology-review-actor-evidence-policy-materialization-admission-fr127.test.ts packages/face-reading/src/five-officers-intake-methodology-review-actor-evidence-policy-materialization-admission-fr127-hardening.test.ts
      - name: Verify FR127 exact predecessor and actor/evidence-policy materialization chain
        run: node scripts/verify-fr127-methodology-review-actor-evidence-policy-materialization-admission.mjs
