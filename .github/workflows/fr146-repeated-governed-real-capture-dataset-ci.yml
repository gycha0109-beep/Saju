name: FR146 Repeated Governed Real Capture Dataset CI

on:
  pull_request:
    paths:
      - 'research/face-reading/fr146-square-broad-fang-repeated-governed-real-capture-dataset.md'
      - 'packages/face-reading/src/five-officers-square-broad-fang-repeated-governed-real-capture-dataset-fr146.ts'
      - 'packages/face-reading/src/five-officers-square-broad-fang-repeated-governed-real-capture-dataset-fr146.test.ts'
      - 'scripts/verify-fr146-square-broad-fang-repeated-governed-real-capture-dataset.mjs'
      - '.github/workflows/fr146-repeated-governed-real-capture-dataset-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-fr146-repeated-governed-real-capture-dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Typecheck Face Reading package
        run: npm run face:typecheck
      - name: Build Face Reading package
        run: npm run face:build
      - name: Verify FR146 repeated governed real-capture boundary
        run: npx vitest run packages/face-reading/src/five-officers-square-broad-fang-repeated-governed-real-capture-dataset-fr146.test.ts
      - name: Verify FR146 zero-persistence and zero-semantic-promotion contract
        run: node scripts/verify-fr146-square-broad-fang-repeated-governed-real-capture-dataset.mjs
