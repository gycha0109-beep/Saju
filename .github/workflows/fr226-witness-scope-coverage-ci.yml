name: FR226 Witness Scope Coverage CI

on:
  pull_request:
    paths:
      - 'packages/face-reading/src/observable-morphology-candidate-annotation-correspondence-fr222.ts'
      - 'packages/face-reading/src/observable-morphology-repeat-capture-family-fr223.ts'
      - 'packages/face-reading/src/observable-morphology-empirical-study-readiness-fr224.ts'
      - 'packages/face-reading/src/observable-morphology-external-witness-evidence-fr225.ts'
      - 'packages/face-reading/src/observable-morphology-witness-scope-coverage-fr226.ts'
      - 'packages/face-reading/src/observable-morphology-witness-scope-coverage-fr226.test.ts'
      - 'research/face-reading/fr226-witness-scope-coverage.md'
      - '.github/workflows/fr226-witness-scope-coverage-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'packages/face-reading/src/observable-morphology-candidate-annotation-correspondence-fr222.ts'
      - 'packages/face-reading/src/observable-morphology-repeat-capture-family-fr223.ts'
      - 'packages/face-reading/src/observable-morphology-empirical-study-readiness-fr224.ts'
      - 'packages/face-reading/src/observable-morphology-external-witness-evidence-fr225.ts'
      - 'packages/face-reading/src/observable-morphology-witness-scope-coverage-fr226.ts'
      - 'packages/face-reading/src/observable-morphology-witness-scope-coverage-fr226.test.ts'
      - 'research/face-reading/fr226-witness-scope-coverage.md'
      - '.github/workflows/fr226-witness-scope-coverage-ci.yml'

permissions:
  contents: read

jobs:
  verify-fr226-witness-scope-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build Face Reading package
        run: npm run face:build
      - name: Verify FR226 witness-scope coverage contract
        run: npx vitest run packages/face-reading/src/observable-morphology-witness-scope-coverage-fr226.test.ts
