name: Production Latency Evidence

on:
  workflow_dispatch:
    inputs:
      active_bearer_secret_version:
        description: Enabled numeric Secret Manager version for the active Saju service Bearer
        required: true
        type: string
      sample_count:
        description: Sequential authenticated calculation samples (20-500)
        required: true
        default: '100'
        type: string
      timeout_ms:
        description: Per-request timeout in milliseconds (1000-120000)
        required: true
        default: '10000'
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-saju-cloud-run
  cancel-in-progress: false

jobs:
  measure:
    name: Capture immutable revision and latency evidence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-saju
    env:
      GCP_REGION: asia-southeast1
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_DEPLOYER_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      GCP_CLOUD_RUN_SERVICE: ${{ vars.GCP_CLOUD_RUN_SERVICE }}
      GCP_SAJU_ACTIVE_BEARER_SECRET: ${{ vars.GCP_SAJU_ACTIVE_BEARER_SECRET }}
      ACTIVE_BEARER_VERSION: ${{ inputs.active_bearer_secret_version }}
      SAMPLE_COUNT: ${{ inputs.sample_count }}
      TIMEOUT_MS: ${{ inputs.timeout_ms }}

    steps:
      - name: Preflight observation-only evidence contract
        shell: bash
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF" != 'refs/heads/main' ]; then
            echo 'Production latency evidence must be dispatched from main.' >&2
            exit 1
          fi

          required_vars=(
            GCP_PROJECT_ID
            GCP_WORKLOAD_IDENTITY_PROVIDER
            GCP_DEPLOYER_SERVICE_ACCOUNT
            GCP_CLOUD_RUN_SERVICE
            GCP_SAJU_ACTIVE_BEARER_SECRET
          )
          for name in "${required_vars[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required production evidence variable: ${name}." >&2
              exit 1
            fi
          done

          if [[ ! "$ACTIVE_BEARER_VERSION" =~ ^[1-9][0-9]*$ ]]; then
            echo 'active_bearer_secret_version must be a positive numeric Secret Manager version.' >&2
            exit 1
          fi
          if [[ ! "$SAMPLE_COUNT" =~ ^[0-9]+$ ]] || [ "$SAMPLE_COUNT" -lt 20 ] || [ "$SAMPLE_COUNT" -gt 500 ]; then
            echo 'sample_count must be an integer between 20 and 500.' >&2
            exit 1
          fi
          if [[ ! "$TIMEOUT_MS" =~ ^[0-9]+$ ]] || [ "$TIMEOUT_MS" -lt 1000 ] || [ "$TIMEOUT_MS" -gt 120000 ]; then
            echo 'timeout_ms must be an integer between 1000 and 120000.' >&2
            exit 1
          fi

          {
            echo '## Observation-only production evidence contract'
            echo
            echo "- Workflow source SHA: \`$GITHUB_SHA\`"
            echo '- Traffic mutation: **none**'
            echo '- Concurrency group: `production-saju-cloud-run` (serialized with deployment/promotion)'
            echo '- Percentiles are an indicative operational baseline, not a production SLO.'
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: Validate latency sampler syntax
        run: node --check scripts/measure-production-latency.mjs

      - name: Authenticate to Google Cloud using Workload Identity Federation
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK 583.0.0
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          version: '583.0.0'

      - name: Capture exact current production identity
        id: before
        shell: bash
        run: |
          set -euo pipefail
          service_json="${RUNNER_TEMP}/saju-latency-service-before.json"
          revision_json="${RUNNER_TEMP}/saju-latency-revision-before.json"

          gcloud run services describe "$GCP_CLOUD_RUN_SERVICE" \
            --region "$GCP_REGION" \
            --project "$GCP_PROJECT_ID" \
            --format=json > "$service_json"

          revision_count="$(jq '[.status.traffic[]? | select((.percent // 0) == 100 and (.revisionName // "") != "") | .revisionName] | unique | length' "$service_json")"
          if [ "$revision_count" != '1' ]; then
            echo 'Latency evidence requires exactly one explicit revision serving 100% traffic.' >&2
            exit 1
          fi

          revision="$(jq -r '[.status.traffic[]? | select((.percent // 0) == 100 and (.revisionName // "") != "") | .revisionName] | unique | .[0]' "$service_json")"
          service_url="$(jq -r '.status.url // empty' "$service_json")"
          if [[ ! "$service_url" =~ ^https://[^/]+$ ]]; then
            echo 'Cloud Run stable service URL is missing or not an HTTPS origin.' >&2
            exit 1
          fi

          gcloud run revisions describe "$revision" \
            --region "$GCP_REGION" \
            --project "$GCP_PROJECT_ID" \
            --format=json > "$revision_json"

          ready="$(jq -r '[.status.conditions[]? | select(.type == "Ready") | .status] | first // empty' "$revision_json")"
          image_ref="$(jq -r '.spec.containers[0].image // empty' "$revision_json")"
          if [ "$ready" != 'True' ]; then
            echo 'Current 100% production revision is not Ready=True.' >&2
            exit 1
          fi
          if [[ ! "$image_ref" =~ @sha256:[0-9a-f]{64}$ ]]; then
            echo 'Current production revision is not pinned to an exact sha256 image digest.' >&2
            exit 1
          fi

          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "service_url=$service_url" >> "$GITHUB_OUTPUT"
          echo "image_ref=$image_ref" >> "$GITHUB_OUTPUT"

          {
            echo '## Production identity before sampling'
            echo
            echo "- Revision: \`$revision\`"
            echo "- Image: \`$image_ref\`"
            echo '- Traffic: **100%**'
            echo '- Revision Ready: **True**'
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Measure authenticated calculation latency
        id: latency
        shell: bash
        env:
          SAJU_LATENCY_BASE_URL: ${{ steps.before.outputs.service_url }}
          SAJU_LATENCY_REVISION: ${{ steps.before.outputs.revision }}
          SAJU_LATENCY_IMAGE_REF: ${{ steps.before.outputs.image_ref }}
          SAJU_LATENCY_SAMPLE_COUNT: ${{ inputs.sample_count }}
          SAJU_LATENCY_TIMEOUT_MS: ${{ inputs.timeout_ms }}
          SAJU_LATENCY_INTERVAL_MS: '100'
          SAJU_LATENCY_EVIDENCE_PATH: ${{ runner.temp }}/saju-production-latency-evidence.json
        run: |
          set -euo pipefail
          bearer="$(gcloud secrets versions access "$ACTIVE_BEARER_VERSION" \
            --secret "$GCP_SAJU_ACTIVE_BEARER_SECRET" \
            --project "$GCP_PROJECT_ID")"
          if [ -z "$bearer" ]; then
            echo 'Active Saju Bearer secret resolved to an empty value.' >&2
            exit 1
          fi
          echo "::add-mask::$bearer"
          SAJU_LATENCY_BEARER="$bearer" node scripts/measure-production-latency.mjs

      - name: Capture final production identity and enforce stability
        shell: bash
        env:
          EXPECTED_REVISION: ${{ steps.before.outputs.revision }}
          EXPECTED_SERVICE_URL: ${{ steps.before.outputs.service_url }}
          EXPECTED_IMAGE_REF: ${{ steps.before.outputs.image_ref }}
        run: |
          set -euo pipefail
          service_json="${RUNNER_TEMP}/saju-latency-service-after.json"
          revision_json="${RUNNER_TEMP}/saju-latency-revision-after.json"

          gcloud run services describe "$GCP_CLOUD_RUN_SERVICE" \
            --region "$GCP_REGION" \
            --project "$GCP_PROJECT_ID" \
            --format=json > "$service_json"

          revision_count="$(jq '[.status.traffic[]? | select((.percent // 0) == 100 and (.revisionName // "") != "") | .revisionName] | unique | length' "$service_json")"
          if [ "$revision_count" != '1' ]; then
            echo 'Production traffic topology changed during sampling.' >&2
            exit 1
          fi

          revision="$(jq -r '[.status.traffic[]? | select((.percent // 0) == 100 and (.revisionName // "") != "") | .revisionName] | unique | .[0]' "$service_json")"
          service_url="$(jq -r '.status.url // empty' "$service_json")"
          if [ "$revision" != "$EXPECTED_REVISION" ] || [ "$service_url" != "$EXPECTED_SERVICE_URL" ]; then
            echo 'Production revision or stable service URL changed during sampling; evidence is rejected.' >&2
            exit 1
          fi

          gcloud run revisions describe "$revision" \
            --region "$GCP_REGION" \
            --project "$GCP_PROJECT_ID" \
            --format=json > "$revision_json"
          image_ref="$(jq -r '.spec.containers[0].image // empty' "$revision_json")"
          if [ "$image_ref" != "$EXPECTED_IMAGE_REF" ]; then
            echo 'Production revision image identity changed during sampling; evidence is rejected.' >&2
            exit 1
          fi

          {
            echo '## Production identity after sampling'
            echo
            echo "- Revision: \`$revision\`"
            echo "- Image: \`$image_ref\`"
            echo '- Traffic: **100%**'
            echo '- Identity stable for full sample window: **YES**'
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish sanitized per-sample evidence to job log
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/saju-production-latency-evidence.json"
          if [ -f "$evidence" ]; then
            cat "$evidence"
          else
            echo 'No latency evidence JSON was produced.'
          fi
