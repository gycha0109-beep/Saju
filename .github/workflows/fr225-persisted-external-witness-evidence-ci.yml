name: FR225 Persisted External Witness Evidence CI

on:
  pull_request:
    paths:
      - 'packages/face-reading/src/observable-morphology-external-witness-evidence-fr225.ts'
      - 'packages/face-reading/src/observable-morphology-external-witness-evidence-fr225.test.ts'
      - 'research/face-reading/fr225-persisted-external-witness-evidence.md'
      - '.github/workflows/fr225-persisted-external-witness-evidence-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'packages/face-reading/src/observable-morphology-external-witness-evidence-fr225.ts'
      - 'packages/face-reading/src/observable-morphology-external-witness-evidence-fr225.test.ts'
      - 'research/face-reading/fr225-persisted-external-witness-evidence.md'
      - '.github/workflows/fr225-persisted-external-witness-evidence-ci.yml'

permissions:
  contents: read

jobs:
  verify-fr225-persisted-external-witness-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build Face Reading package
        run: npm run face:build
      - name: Verify FR225 persisted witness contract
        run: npx vitest run packages/face-reading/src/observable-morphology-external-witness-evidence-fr225.test.ts
