name: FR165 Eye Pair Prospective Multi Session Recurrence CI

on:
  pull_request:
    paths:
      - "research/face-reading/fr165-eye-pair-prospective-multi-session-recurrence.md"
      - "packages/face-reading/src/eye-pair-prospective-ephemeral-real-capture-series-fr161.ts"
      - "packages/face-reading/src/eye-pair-prospective-recurrence-execution-fr164.ts"
      - "packages/face-reading/src/eye-pair-prospective-multi-session-recurrence-fr165.ts"
      - "packages/face-reading/src/eye-pair-prospective-multi-session-recurrence-fr165.test.ts"
      - ".github/workflows/fr165-eye-pair-prospective-multi-session-recurrence-ci.yml"
  push:
    branches: [main]
    paths:
      - "research/face-reading/fr165-eye-pair-prospective-multi-session-recurrence.md"
      - "packages/face-reading/src/eye-pair-prospective-ephemeral-real-capture-series-fr161.ts"
      - "packages/face-reading/src/eye-pair-prospective-recurrence-execution-fr164.ts"
      - "packages/face-reading/src/eye-pair-prospective-multi-session-recurrence-fr165.ts"
      - "packages/face-reading/src/eye-pair-prospective-multi-session-recurrence-fr165.test.ts"
      - ".github/workflows/fr165-eye-pair-prospective-multi-session-recurrence-ci.yml"

permissions:
  contents: read

jobs:
  fr165-eye-pair-prospective-multi-session-recurrence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: >-
          npx vitest run
          packages/face-reading/src/eye-pair-prospective-recurrence-execution-fr164.test.ts
          packages/face-reading/src/eye-pair-prospective-multi-session-recurrence-fr165.test.ts
