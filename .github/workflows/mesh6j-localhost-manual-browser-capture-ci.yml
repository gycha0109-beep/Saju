jobs:
  verify-manual-browser-capture-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: npm ci
      - name: Typecheck Face Reading
        run: npm run face:typecheck
      - name: Build Face Reading
        run: npm run face:build
      - name: Verify FR104 public mirror fixture
        run: node scripts/verify-fr104-ear-mirror-fixture.mjs
      - name: Syntax-check FR104 mirror client
        run: node --check tools/face-geometry/capture/fr104-ear-mirror-pair.mjs
      - name: Verify FR104 public mirror multi-fixtures
        run: node scripts/verify-fr104-ear-mirror-multifixtures.mjs
      - name: Verify FR104 independent public mirror fixture
        run: node scripts/verify-fr104-ear-mirror-independent-fixture.mjs
      - name: Syntax-check FR104 multi-fixture mirror client
        run: node --check tools/face-geometry/capture/fr104-ear-mirror-multifixture.mjs
      - name: Syntax-check FR104 MakeHuman provider preflight
        run: |
          node --check tools/face-geometry/capture/fr104-makehuman-provider-preflight.mjs
          node --check scripts/run-fr104-makehuman-provider-preflight-ci.mjs

      - name: Syntax-check FR104 MakeHuman transform diagnostics
        run: |
          node --check tools/face-geometry/capture/fr104-makehuman-transform-diagnostics.mjs
          node --check scripts/run-fr104-makehuman-transform-diagnostics-ci.mjs

      - name: Syntax-check FR104 MakeHuman provider rotation dependence
        run: |
          node --check tools/face-geometry/capture/fr104-makehuman-provider-rotation-dependence.mjs
          node --check scripts/run-fr104-makehuman-provider-rotation-dependence-ci.mjs

      - name: Syntax-check FR104 MakeHuman provider rotation compensation
        run: |
          node --check scripts/verify-fr104-mediapipe-rotation-api.mjs
          node --check tools/face-geometry/capture/fr104-makehuman-provider-rotation-compensation.mjs
          node --check scripts/run-fr104-makehuman-provider-rotation-compensation-ci.mjs
          node --check scripts/analyze-fr104-provider-compensated-output-frame.mjs

      - name: Syntax-check FR104 U3.3 prospective composed normalization
        run: |
          node --check tools/face-geometry/capture/fr104-provider-composed-orientation-validation.mjs
          node --check scripts/run-fr104-provider-composed-orientation-validation.mjs
          node --check scripts/admit-fr104-provider-composed-orientation-result.mjs

      - name: Syntax-check FR104 U4A controlled anatomical mapping audit
        run: |
          node --check scripts/analyze-fr104-controlled-anatomical-side-mapping.mjs
          node --check scripts/admit-fr104-controlled-anatomical-side-mapping-result.mjs

      - name: Syntax-check FR104 U4B preregistered render-only builder
        run: node --check scripts/build-fr104-u4b-makehuman-morph-fixture.mjs

      - name: Install projection dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Verify FR104 Florence live transport protocol
        run: |
          python tools/face-reading/ear/run_florence2_ear_live_worker.py --self-test
          node scripts/fr104-florence-live-worker-bridge.mjs --self-test
          node --check scripts/mesh6j-manual-browser-capture-preview.mjs

      - name: Compile authoring tooling
        run: |
          python -m py_compile \
            tools/face-reading/blender/fetch_mediapipe_canonical_face.py \
            tools/face-geometry/gnm/fetch_gnm_head.py \
            tools/face-geometry/gnm/export_gnm_region_ontology.py \
            tools/face-geometry/gnm/project_gnm_regions_to_mediapipe468_weighted.py \
            tools/face-reading/ear/audit_fr104_gnm_anatomical_witness.py \
            tools/face-reading/ear/run_florence2_ear_empirical.py \
            tools/face-reading/ear/run_florence2_ear_live_worker.py
      - name: Verify executable surface contract
        run: node scripts/verify-face-geometry-mesh6j.mjs
      - name: Verify FR269 controlled geometry report
        run: node scripts/analyze-fr269-controlled-geometry.mjs --verify
      - name: Verify LAN mode fails closed without TLS
        run: |
          if MESH6J_LAN=1 node scripts/mesh6j-manual-browser-capture-preview.mjs > /tmp/mesh6j-lan-no-tls.log 2>&1; then
            cat /tmp/mesh6j-lan-no-tls.log
            echo "LAN mode unexpectedly started without TLS material" >&2
            exit 1
          fi
          grep -F "LAN mode requires MESH6J_TLS_KEY and MESH6J_TLS_CERT." /tmp/mesh6j-lan-no-tls.log
      - name: Smoke localhost capture surface
        env:
          MYEONGHWA_MESH6J_SMOKE: '1'
        run: node scripts/mesh6j-manual-browser-capture-preview.mjs
      - name: Run FR104 MakeHuman FaceLandmarker preflight
        run: |
          google-chrome --version
          chromedriver --version
          node scripts/run-fr104-makehuman-provider-preflight-ci.mjs

      - name: Run FR104 MakeHuman transform diagnostics
        run: node scripts/run-fr104-makehuman-transform-diagnostics-ci.mjs

      - name: Run FR104 MakeHuman provider rotation dependence
        run: node scripts/run-fr104-makehuman-provider-rotation-dependence-ci.mjs

      - name: Verify FR104 MediaPipe rotation API artifact
        run: node scripts/verify-fr104-mediapipe-rotation-api.mjs

      - name: Run FR104 MakeHuman provider rotation compensation
        env:
          FR104_U3_2_RESULT_OUT: .cache/face-geometry/fr104-u3-2-result.json
        run: node scripts/run-fr104-makehuman-provider-rotation-compensation-ci.mjs

      - name: Run FR104 compensated output coordinate frame audit
        run: node scripts/analyze-fr104-provider-compensated-output-frame.mjs

      - name: Replay FR104 U3.3 prospective composed normalization exactly
        env:
          FR104_U3_3_RESULT_OUT: .cache/face-geometry/fr104-u3-3-result.json
          FR104_U3_3_EXPECTED_RESULT_SHA256: 793b1059308242d11c176300bd141b70a49c2fa681a49bc6e38e1abddf4aaab4
        run: node scripts/run-fr104-provider-composed-orientation-validation.mjs

      - name: Admit exact FR104 U3.3 prospective result
        env:
          FR104_U3_3_RESULT_IN: .cache/face-geometry/fr104-u3-3-result.json
        run: node scripts/admit-fr104-provider-composed-orientation-result.mjs

      - name: Replay FR104 U4A controlled anatomical mapping exactly
        env:
          FR104_U3_2_RESULT_IN: .cache/face-geometry/fr104-u3-2-result.json
          FR104_U4A_RESULT_OUT: .cache/face-geometry/fr104-u4a-result.json
          FR104_U4A_EXPECTED_RESULT_SHA256: 863b1909b2bb33437496c990fd97529d986b2fca1564addb6e1591d232b7f2cf
        run: node scripts/analyze-fr104-controlled-anatomical-side-mapping.mjs

      - name: Admit exact FR104 U4A controlled anatomical mapping result
        env:
          FR104_U4A_RESULT_IN: .cache/face-geometry/fr104-u4a-result.json
        run: node scripts/admit-fr104-controlled-anatomical-side-mapping-result.mjs
      - name: Create ephemeral CI TLS certificate
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout /tmp/mesh6j-ci-key.pem \
            -out /tmp/mesh6j-ci-cert.pem \
            -days 1 \
            -subj "/CN=127.0.0.1" \
            -addext "subjectAltName=IP:127.0.0.1,DNS:localhost"
      - name: Smoke private-LAN HTTPS capture surface
        env:
          MYEONGHWA_MESH6J_LAN_SMOKE: '1'
          MESH6J_TLS_KEY: /tmp/mesh6j-ci-key.pem
          MESH6J_TLS_CERT: /tmp/mesh6j-ci-cert.pem
        run: node scripts/mesh6j-manual-browser-capture-preview.mjs