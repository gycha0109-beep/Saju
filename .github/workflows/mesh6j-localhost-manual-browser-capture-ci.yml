name: MESH6J Manual Browser Capture Surface CI

on:
  pull_request:
    paths:
      - '.github/workflows/mesh6j-localhost-manual-browser-capture-ci.yml'
      - 'scripts/mesh6j-manual-browser-capture-preview.mjs'
      - 'scripts/mesh6j-private-lan-transport.mjs'
      - 'scripts/verify-face-geometry-mesh6j.mjs'
      - 'tools/face-geometry/capture/mesh6j-operator-capture.html'
      - 'tools/face-geometry/capture/mesh6j-operator-capture.mjs'
      - 'tools/face-geometry/capture/fr251-dry-run-operator.html'
      - 'tools/face-geometry/capture/fr251-dry-run-operator.mjs'
      - 'tools/face-geometry/capture/fr255-repeatability-observation.html'
      - 'tools/face-geometry/capture/fr255-repeatability-observation.mjs'
      - 'packages/face-reading/src/observable-morphology-longitudinal-repeatability-observation-fr255.ts'
      - 'packages/face-reading/src/observable-morphology-longitudinal-repeatability-observation-fr255.test.ts'
      - 'research/face-reading/fr255-longitudinal-repeatability-observation-protocol.md'
      - 'packages/face-reading/src/observable-morphology-capture-geometry-attribution-fr257.ts'
      - 'packages/face-reading/src/observable-morphology-capture-geometry-attribution-fr257.test.ts'
      - 'research/face-reading/fr257-capture-geometry-attribution-protocol.md'
      - 'packages/face-reading/src/observable-morphology-controlled-capture-geometry-sensitivity-fr269.ts'
      - 'packages/face-reading/src/observable-morphology-controlled-capture-geometry-sensitivity-fr269.test.ts'
      - 'scripts/analyze-fr269-controlled-geometry.mjs'
      - 'research/face-reading/fr269-controlled-capture-geometry-sensitivity.md'
      - 'research/face-reading/evidence/fr269-controlled-geometry/**'
      - 'tools/face-geometry/capture/fr274-still-image-diagnostic.html'
      - 'tools/face-geometry/capture/fr274-still-image-diagnostic.mjs'
      - 'packages/face-reading/src/observable-morphology-deterministic-still-image-diagnostic-fr274.ts'
      - 'packages/face-reading/src/observable-morphology-deterministic-still-image-diagnostic-fr274.test.ts'
      - 'research/face-reading/fr274-deterministic-still-image-eye-tilt-diagnostic.md'
      - 'tools/face-geometry/capture/fr279-still-image-eye-chord-decomposition.html'
      - 'tools/face-geometry/capture/fr279-still-image-eye-chord-decomposition.mjs'
      - 'packages/face-reading/src/observable-morphology-fixed-still-screen-eye-chord-fr279.ts'
      - 'packages/face-reading/src/observable-morphology-fixed-still-screen-eye-chord-fr279.test.ts'
      - 'research/face-reading/fr279-fixed-still-screen-eye-chord-decomposition.md'
      - 'research/face-reading/evidence/fr279-fixed-still-screen-eye-chord/**'
      - 'tools/face-geometry/capture/fr281-still-image-metric-eye-chord.html'
      - 'tools/face-geometry/capture/fr281-still-image-metric-eye-chord.mjs'
      - 'packages/face-reading/src/observable-morphology-fixed-still-metric-eye-chord-fr281.ts'
      - 'packages/face-reading/src/observable-morphology-fixed-still-metric-eye-chord-fr281.test.ts'
      - 'research/face-reading/fr281-fixed-still-metric-eye-chord-decomposition.md'
      - 'research/face-reading/evidence/fr281-fixed-still-metric-eye-chord/**'
      - 'packages/face-reading/src/observable-morphology-ephemeral-live-camera-frame-intake-fr242.ts'
      - 'packages/face-reading/src/participant-media-resource-ceiling-fr173-shared.ts'
      - 'packages/face-geometry/docs/mesh6j-localhost-manual-browser-capture-surface.md'
      - 'packages/face-geometry/docs/mesh6j1-private-lan-https-mobile-capture.md'
      - 'packages/face-geometry/docs/mesh6j3-camera-style-mobile-multi-frame-capture.md'
      - 'packages/face-reading/src/mesh6h-browser-camera-frame-source.ts'
      - 'packages/face-reading/src/mesh6i-manual-browser-capture-controller.ts'
      - 'packages/face-reading/src/mesh6g-prospective-operator-capture-session.ts'
      - 'packages/face-reading/src/mediapipe-face-landmarker-runtime-fr26.ts'
      - 'packages/face-reading/src/mediapipe-screen-to-metric-reimplementation-parity-fr76.ts'
      - 'packages/face-reading/src/governed-metric-geometry-runtime-fr77.ts'
      - 'packages/face-reading/assets/canonical-face/mediapipe-v0.10.35.manifest.json'
      - 'packages/face-geometry/assets/bridge/gnm-to-mediapipe468-weighted-region-projection-v2.json'
      - 'packages/face-geometry/assets/regions/gnm-provider-region-ontology-v1.json'
      - 'tools/face-reading/blender/fetch_mediapipe_canonical_face.py'
      - 'tools/face-geometry/gnm/fetch_gnm_head.py'
      - 'tools/face-geometry/gnm/export_gnm_region_ontology.py'
      - 'tools/face-geometry/gnm/project_gnm_regions_to_mediapipe468_weighted.py'
  workflow_dispatch:

jobs:
  verify-manual-browser-capture-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: npm ci
      - name: Typecheck Face Reading
        run: npm run face:typecheck
      - name: Build Face Reading
        run: npm run face:build
      - name: Install projection dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Compile authoring tooling
        run: |
          python -m py_compile \
            tools/face-reading/blender/fetch_mediapipe_canonical_face.py \
            tools/face-geometry/gnm/fetch_gnm_head.py \
            tools/face-geometry/gnm/export_gnm_region_ontology.py \
            tools/face-geometry/gnm/project_gnm_regions_to_mediapipe468_weighted.py
      - name: Verify executable surface contract
        run: node scripts/verify-face-geometry-mesh6j.mjs
      - name: Verify FR269 controlled geometry report
        run: node scripts/analyze-fr269-controlled-geometry.mjs --verify
      - name: Verify LAN mode fails closed without TLS
        run: |
          if MESH6J_LAN=1 node scripts/mesh6j-manual-browser-capture-preview.mjs > /tmp/mesh6j-lan-no-tls.log 2>&1; then
            cat /tmp/mesh6j-lan-no-tls.log
            echo "LAN mode unexpectedly started without TLS material" >&2
            exit 1
          fi
          grep -F "LAN mode requires MESH6J_TLS_KEY and MESH6J_TLS_CERT." /tmp/mesh6j-lan-no-tls.log
      - name: Smoke localhost capture surface
        env:
          MYEONGHWA_MESH6J_SMOKE: '1'
        run: node scripts/mesh6j-manual-browser-capture-preview.mjs
      - name: Upload FR281 pure geometry runtime
        uses: actions/upload-artifact@v4
        with:
          name: fr281-pure-geometry-runtime
          path: |
            .face-reading-dist
            .cache/face-geometry/mesh6j/geometry_pipeline_metadata_landmarks.pbtxt
          if-no-files-found: error
          retention-days: 1
      - name: Create ephemeral CI TLS certificate
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout /tmp/mesh6j-ci-key.pem \
            -out /tmp/mesh6j-ci-cert.pem \
            -days 1 \
            -subj "/CN=127.0.0.1" \
            -addext "subjectAltName=IP:127.0.0.1,DNS:localhost"
      - name: Smoke private-LAN HTTPS capture surface
        env:
          MYEONGHWA_MESH6J_LAN_SMOKE: '1'
          MESH6J_TLS_KEY: /tmp/mesh6j-ci-key.pem
          MESH6J_TLS_CERT: /tmp/mesh6j-ci-cert.pem
        run: node scripts/mesh6j-manual-browser-capture-preview.mjs