name: MESH6J Localhost Manual Browser Capture Surface CI

on:
  pull_request:
    paths:
      - '.github/workflows/mesh6j-localhost-manual-browser-capture-ci.yml'
      - 'scripts/mesh6j-manual-browser-capture-preview.mjs'
      - 'scripts/verify-face-geometry-mesh6j.mjs'
      - 'tools/face-geometry/capture/mesh6j-operator-capture.html'
      - 'tools/face-geometry/capture/mesh6j-operator-capture.mjs'
      - 'packages/face-geometry/docs/mesh6j-localhost-manual-browser-capture-surface.md'
      - 'packages/face-reading/src/mesh6h-browser-camera-frame-source.ts'
      - 'packages/face-reading/src/mesh6i-manual-browser-capture-controller.ts'
      - 'packages/face-reading/src/mesh6g-prospective-operator-capture-session.ts'
      - 'packages/face-reading/src/mediapipe-face-landmarker-runtime-fr26.ts'
      - 'packages/face-reading/src/mediapipe-screen-to-metric-reimplementation-parity-fr76.ts'
      - 'packages/face-reading/src/governed-metric-geometry-runtime-fr77.ts'
      - 'packages/face-reading/assets/canonical-face/mediapipe-v0.10.35.manifest.json'
      - 'packages/face-geometry/assets/bridge/gnm-to-mediapipe468-weighted-region-projection-v2.json'
      - 'packages/face-geometry/assets/regions/gnm-provider-region-ontology-v1.json'
      - 'tools/face-reading/blender/fetch_mediapipe_canonical_face.py'
      - 'tools/face-geometry/gnm/fetch_gnm_head.py'
      - 'tools/face-geometry/gnm/export_gnm_region_ontology.py'
      - 'tools/face-geometry/gnm/project_gnm_regions_to_mediapipe468_weighted.py'
  workflow_dispatch:

jobs:
  verify-localhost-manual-browser-capture-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: npm ci
      - name: Typecheck Face Reading
        run: npm run face:typecheck
      - name: Build Face Reading
        run: npm run face:build
      - name: Install projection dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Compile authoring tooling
        run: |
          python -m py_compile \
            tools/face-reading/blender/fetch_mediapipe_canonical_face.py \
            tools/face-geometry/gnm/fetch_gnm_head.py \
            tools/face-geometry/gnm/export_gnm_region_ontology.py \
            tools/face-geometry/gnm/project_gnm_regions_to_mediapipe468_weighted.py
      - name: Verify executable surface contract
        run: node scripts/verify-face-geometry-mesh6j.mjs
      - name: Smoke localhost capture surface
        env:
          MYEONGHWA_MESH6J_SMOKE: '1'
        run: node scripts/mesh6j-manual-browser-capture-preview.mjs
