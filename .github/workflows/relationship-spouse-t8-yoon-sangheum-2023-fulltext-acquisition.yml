name: Relationship Spouse T8 Yoon Sangheum 2023 Fulltext Acquisition

on:
  pull_request:
    paths:
      - 'scripts/acquire-relationship-spouse-t8-yoon-sangheum-2023-kci-public-fulltext.py'
      - 'scripts/follow-yoon-sangheum-2023-kci-concrete-file-contract.py'
      - 'scripts/inspect-yoon-sangheum-2023-kci-riss-provider-route.py'
      - 'scripts/inspect-yoon-sangheum-2023-riss-paid-provider-boundary.py'
      - '.github/workflows/relationship-spouse-t8-yoon-sangheum-2023-fulltext-acquisition.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire-current-public-kci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded PDF reader
        run: python -m pip install --disable-pip-version-check pypdf==6.0.0
      - name: Inspect current site-authored KCI contracts
        run: python scripts/acquire-relationship-spouse-t8-yoon-sangheum-2023-kci-public-fulltext.py
      - name: Follow exact current KCI concrete file contract when exposed
        run: python scripts/follow-yoon-sangheum-2023-kci-concrete-file-contract.py
      - name: Inspect exact KCI-authored RISS provider route
        run: python scripts/inspect-yoon-sangheum-2023-kci-riss-provider-route.py
      - name: Inspect RISS paid-provider boundary without invoking original view
        run: python scripts/inspect-yoon-sangheum-2023-riss-paid-provider-boundary.py
      - name: Inspect any exact site-authored PDF object
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from pypdf import PdfReader
          root=Path('acquisition-yoon-sangheum-2023')
          report=json.loads((root/'report.json').read_text(encoding='utf-8'))
          pdf=root/'candidate.pdf'
          meta={'observed':pdf.exists(),'pages':0,'encrypted':None,'textChars':0}
          if pdf.exists():
              reader=PdfReader(str(pdf)); texts=[]
              for i,page in enumerate(reader.pages,start=1):
                  texts.append(f'\n===== PHYSICAL_PDF_PAGE_{i} =====\n{page.extract_text() or ""}')
              full=''.join(texts); (root/'candidate.txt').write_text(full,encoding='utf-8')
              meta.update({'pages':len(reader.pages),'encrypted':bool(reader.is_encrypted),'textChars':len(full)})
              report['fullLengthPdfAcquired']=20 <= len(reader.pages) <= 26 and len(full)>8000
              report['semanticDisposition']='DIRECT_BODY_READY_FOR_REVIEW' if report['fullLengthPdfAcquired'] else 'PARTIAL_OR_NO_PDF_NO_BODY_DECISION'
          else:
              report['fullLengthPdfAcquired']=False
              report['semanticDisposition']='ACCESS_BOUNDARY_ONLY_NO_DIRECT_BODY_DECISION'
          (root/'pdf-metadata.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(meta,ensure_ascii=False,indent=2)); print('fullLengthPdfAcquired=',report['fullLengthPdfAcquired'])
          PY
      - name: Print spouse and gender-role semantic contexts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('acquisition-yoon-sangheum-2023/candidate.txt')
          if not p.exists():
              print('No complete article text acquired; semantic review intentionally skipped.'); raise SystemExit(0)
          t=p.read_text(encoding='utf-8')
          for term in ['배우자','처','아내','남편','성역할','남명','여명','재성','관성','재관','부친','모친','아버지','어머니','공존','위계','육친','십신']:
              print(f'\n### TERM {term}'); shown=0
              for m in re.finditer(re.escape(term),t,re.I):
                  print(re.sub(r'\s+',' ',t[max(0,m.start()-400):min(len(t),m.end()+900)])); shown+=1
                  if shown>=10:break
              print('COUNT_SHOWN',shown)
          PY
      - name: Enforce exact identity and no-bypass boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('acquisition-yoon-sangheum-2023/report.json').read_text(encoding='utf-8'))
          assert j['candidate']['author']=='윤상흠'
          assert j['candidate']['year']==2023
          assert j['candidate']['kci']=='ART003042567'
          assert j['candidate']['doi']=='10.35203/EACT.2023.15.33'
          assert j['fallbackOrteFileIdsTried']==[]
          assert j['guessedOpaqueIdentifierCount']==0
          assert j['loginBypass'] is False
          assert j['institutionAuthBypass'] is False
          assert j['paywallBypass'] is False
          assert j['drmRequestExecuted'] is False
          assert j['decryptionActionExecuted'] is False
          assert j['rissProvider']['uniqueTargetRissUrl']=='http://www.riss.kr/link?id=A108917392'
          assert j['rissProvider']['rissTarget']['finalUrl'].endswith('control_no=37b95c18ae24bef64884a65323211ff0')
          assert j['rissProvider']['contentDownloadExecuted'] is False
          assert j['rissProvider']['guessedOpaqueIdentifierCount']==0
          b=j['rissPaidProviderBoundary']
          assert b['exactPaidKoreaScholarProviderObserved'] is True
          assert b['disposition']=='RISS_EXPLICIT_PAID_KOREASCHOLAR_PROVIDER_STOP_NO_PAYWALL_BYPASS'
          assert b['originalViewInvoked'] is False
          assert b['koreaScholarContentRequestExecuted'] is False
          assert b['contentDownloadExecuted'] is False
          assert b['guessedOpaqueIdentifierCount']==0
          assert b['paywallBypass'] is False
          assert j['fullLengthPdfAcquired'] is False
          assert j['semanticDisposition']=='ACCESS_BOUNDARY_ONLY_NO_DIRECT_BODY_DECISION'
          print('Yoon Sangheum 2023 exact KCI->RISS paid-provider access boundary verified; no semantic body decision')
          PY
      - name: Upload bounded evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yoon-sangheum-2023-bounded-fulltext-evidence
          path: |
            acquisition-yoon-sangheum-2023/report.json
            acquisition-yoon-sangheum-2023/contract-snippets.json
            acquisition-yoon-sangheum-2023/pdf-metadata.json
            acquisition-yoon-sangheum-2023/detail.html
            acquisition-yoon-sangheum-2023/download-service.html
            acquisition-yoon-sangheum-2023/kci-riss-provider.xml
            acquisition-yoon-sangheum-2023/riss-provider-report.json
            acquisition-yoon-sangheum-2023/riss-target.html
            acquisition-yoon-sangheum-2023/riss-paid-provider-boundary.json
            acquisition-yoon-sangheum-2023/riss-script-*.txt
            acquisition-yoon-sangheum-2023/candidate.pdf
            acquisition-yoon-sangheum-2023/candidate.txt
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0
