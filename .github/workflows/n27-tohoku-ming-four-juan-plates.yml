name: N27 Tohoku University 2018 Ming four-juan photo plates audit
on:
  push:
    branches: [research/saju/n27-external-folio-acquisition-20261020]
    paths: ['.github/workflows/n27-tohoku-ming-four-juan-plates.yml']
permissions:
  contents: read
jobs:
  public-scholarly-article:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Fetch officially public research article and render plates 16 through 19
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p n27-tohoku-print-plates
          python3 -m pip install --quiet 'pymupdf>=1.24,<2'
          python3 - <<'PY'
          import pathlib,urllib.request,urllib.error,hashlib,json,fitz,time
          root=pathlib.Path("n27-tohoku-print-plates")
          urls=[
            "https://tohoku.repo.nii.ac.jp/record/124963/files/1343-9332-2018-22-1.pdf",
            "https://files.core.ac.uk/download/236169096.pdf"
          ]
          audit={"title":"建陽本「萬暦新歳」刊記考","author":"磯部彰","publication":2018,"sourceCandidates":urls,"acquisitionAttempts":[],"state":"NOT_ACQUIRED","originalBibliographyWitnessCertified":False}
          for url in urls:
            row={"url":url,"status":"UNTRIED"}
            try:
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 (publicly released university scholarly article reading)","Accept":"application/pdf"})
              with urllib.request.urlopen(req,timeout=65) as resp:
                chunks=bytearray()
                while True:
                  b=resp.read(1024*1024)
                  if not b:break
                  if len(chunks)+len(b)>35*1024*1024:raise ValueError("SAFE_SIZE_CAP")
                  chunks.extend(b)
                row.update(http=resp.status,mime=resp.headers.get("Content-Type",""))
              raw=bytes(chunks)
              if not raw.startswith(b"%PDF-"):raise ValueError("NOT_PDF")
              doc=fitz.open(stream=raw,filetype="pdf")
              row.update(status="PUBLIC_PDF_ACQUIRED",sha256=hashlib.sha256(raw).hexdigest(),bytes=len(raw),pageCount=len(doc))
              (root/"public-academic-paper.pdf").write_bytes(raw)
              # Research article 29 pages; figure numbers 16-19 on printed pages about 18-23.
              indices=list(range(max(0,min(16,len(doc)-1)),min(len(doc),24)))
              for i in indices:
                doc[i].get_pixmap(matrix=fitz.Matrix(2,2),alpha=False).save(root/f"pdf-page-{i+1:02d}.png")
              row["renderedPdfPages1Based"]=[i+1 for i in indices]
              row["figureCaptionPages"]=[]
              for ix,p in enumerate(doc):
                t=p.get_text("text")
                if any(term in t for term in ["図版 16","図版16","図版 17","図版17","図版 18","図版18","図版 19","図版19"]):
                  row["figureCaptionPages"].append(ix+1)
              audit["state"]="PUBLIC_PDF_PAGES_RENDERED"
              audit["successfulSource"]=url
              audit["acquisitionAttempts"].append(row)
              print("N27_TOHOKU_SUCCESS",url,len(raw),len(doc),row["figureCaptionPages"],flush=True)
              break
            except urllib.error.HTTPError as e:row.update(status="HTTP_ERROR",http=e.code)
            except Exception as e:row.update(status="ERROR",reason=repr(e)[:240])
            audit["acquisitionAttempts"].append(row)
            print("N27_TOHOKU_SOURCE",url,row["status"],row.get("http"),flush=True)
            time.sleep(1)
          (root/"manifest.json").write_text(json.dumps(audit,ensure_ascii=False,indent=2))
          PY
      - name: Preserve only public academic PDF, figures and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n27-tohoku-academic-original-ming-folio-figures
          path: n27-tohoku-print-plates/
          retention-days: 14
