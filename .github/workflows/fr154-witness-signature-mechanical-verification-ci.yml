name: FR154 Witness Signature Mechanical Verification CI

on:
  pull_request:
    paths:
      - 'packages/face-reading/src/five-officers-square-broad-fang-independent-session-witness-evidence-intake-fr153.ts'
      - 'packages/face-reading/src/five-officers-square-broad-fang-witness-signature-mechanical-verification-fr154.ts'
      - 'packages/face-reading/src/five-officers-square-broad-fang-witness-signature-mechanical-verification-fr154.test.ts'
      - 'research/face-reading/fr154-square-broad-fang-witness-signature-mechanical-verification.md'
      - 'scripts/verify-fr154-square-broad-fang-witness-signature-mechanical-verification.mjs'
      - '.github/workflows/fr154-witness-signature-mechanical-verification-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-fr154-witness-signature-mechanical-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Typecheck Face Reading package
        run: npm run face:typecheck
      - name: Build Face Reading package
        run: npm run face:build
      - name: Test FR154 witness signature mechanical verification
        run: >-
          npx vitest run
          packages/face-reading/src/five-officers-square-broad-fang-witness-signature-mechanical-verification-fr154.test.ts
      - name: Verify FR154 fail-closed witness signature authority
        run: node scripts/verify-fr154-square-broad-fang-witness-signature-mechanical-verification.mjs
      - name: Publish FR154 public runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: fr154-public-runtime
          path: .face-reading-dist
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true
