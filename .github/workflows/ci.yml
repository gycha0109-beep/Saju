name: CI

on:
  workflow_call:
    inputs:
      candidate_pr:
        required: true
        type: string
      candidate_head:
        required: true
        type: string
      candidate_base:
        required: true
        type: string
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: CI Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      full: ${{ steps.plan.outputs.full }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_head || github.sha }}
          fetch-depth: 0
      - name: Assemble pinned integration candidate
        if: inputs.candidate_head != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_PR: ${{ inputs.candidate_pr }}
          CANDIDATE_HEAD: ${{ inputs.candidate_head }}
          CANDIDATE_BASE: ${{ inputs.candidate_base }}
        run: node scripts/ci/integration-candidate.mjs prepare

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Require integration protection before staged CI
        if: github.event_name == 'pull_request' && vars.CI_STAGED_VERIFICATION == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CI_STAGED_VERIFICATION: ${{ vars.CI_STAGED_VERIFICATION }}
        run: node scripts/ci/integration-candidate.mjs policy
      - name: Resolve PR test plan
        id: plan
        env:
          CI_STAGED_VERIFICATION: ${{ vars.CI_STAGED_VERIFICATION }}
          CANDIDATE_HEAD: ${{ inputs.candidate_head }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci/pr-test-plan.mjs

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run affected tests and static contracts
        if: steps.plan.outputs.full == 'false'
        run: node scripts/ci/run-affected-tests.mjs

      - name: Natal internal personalization and five-domain HTML smoke
        run: |
          node --test scripts/natal-reader-review-packet.check.mjs
          node scripts/natal-personalization-audit.mjs "$RUNNER_TEMP/natal-baseline.json"
          node --input-type=module -e "import {readFileSync} from 'node:fs'; import assert from 'node:assert/strict'; const n=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/natal-baseline.n24-expanded-source.json','utf8')); assert.equal(n.caseCount,35); assert.equal(n.cases.length,35); assert.equal(n.originalLeftUnreadCount,0); assert.ok(n.cases.every(c=>c.originalLeftUnreadCount===0 && c.firstScreenOriginalCount+c.additionalOriginalCount===c.completeOriginalCount && (!c.birthTimeKnown ? c.completeOriginalCount===0 : true))); assert.equal(n.createsNewInterpretation,false); assert.equal(n.meaningDifferentiationProven,false); assert.equal(n.mayPublish,false); assert.equal(n.maySell,false);"
          node --input-type=module -e "import {readFileSync} from 'node:fs'; import assert from 'node:assert/strict'; const n=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/natal-baseline.n21-reader-first.json','utf8')); assert.equal(n.caseCount,35); assert.equal(n.cases.length,35); assert.ok(n.cases.every(c=>c.displayedDomainDistinctiveCount+c.displayedCrossDomainSharedCount===c.displayedActualInterpretationCount)); assert.equal(n.displayedCrossDomainSharedCount,0); assert.equal(n.sourceMeaningDifferenceProven,false); assert.equal(n.mayPublish,false); assert.equal(n.maySell,false); assert.ok(n.casesWithoutActualReading>=2); assert.ok(n.cases.every(c=>!c.meaningDifferentiationProven && !c.createsNewInterpretation && !c.mayPublish && !c.maySell && (!c.birthTimeKnown ? c.displayedActualInterpretationCount===0 : true)));"
          node scripts/natal-mur-shadow-audit.mjs "$RUNNER_TEMP/natal-mur-shadow.json"
          node scripts/natal-n13-structural-research-packet.mjs "$RUNNER_TEMP/natal-n13-research.json" "$RUNNER_TEMP/natal-n13-research.html"
          node scripts/natal-n14-linked-t8-research-packet.mjs "$RUNNER_TEMP/natal-n14-linked.json" "$RUNNER_TEMP/natal-n14-linked.html"
          node scripts/natal-n15-narrowed-research-packet.mjs "$RUNNER_TEMP/natal-n15-filtered.json" "$RUNNER_TEMP/natal-n15-filtered.html"
          node scripts/natal-n20-mixed-relation-packet.mjs "$RUNNER_TEMP/natal-n20-mixed.json" "$RUNNER_TEMP/natal-n20-mixed.html"
          node --input-type=module -e "import {readFileSync} from 'node:fs'; import assert from 'node:assert/strict'; const p=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/natal-n20-mixed.json','utf8')); assert.equal(p.caseCount,8); assert.equal(p.consumerInterpretationAuthorized,false); assert.equal(p.mayPublish,false); assert.equal(p.maySell,false); assert.ok(p.cases.every(c=>c.lifecycle==='internal_research_only' && c.mixedPairs.every(x=>x.uniqueT5ClaimIds.length===3 && x.observedFamilies.length===3 && x.sourceLocators.length>=2 && !x.realLifeOutcomeInferred && !x.relationCancellationInferred && !x.consumerProjectionAuthorized))); const h=readFileSync(process.env.RUNNER_TEMP+'/natal-n20-mixed.html','utf8'); assert.match(h,/Research/u);"
          node --input-type=module -e "import {readFileSync} from 'node:fs'; import assert from 'node:assert/strict'; const p=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/natal-n15-filtered.json','utf8')); assert.equal(p.sampleCount,8); assert.ok(p.originalCandidateCount>=8); assert.ok(p.structuralObservationCount>0); assert.equal(p.unsupportedConsumerConclusionsEmitted,0); assert.equal(p.consumerAuthorized,false); assert.equal(p.productionAuthorized,false); assert.ok(p.cases.every(c=>c.originalConsumerConclusionCount===0 && c.decisions.every(d=>d.originalConsumerConclusionAllowed===false && d.modernBehaviorInferenceAllowed===false && ((d.decision==='structural_observation_only')===(typeof d.researchStructuralText==='string'))))); const h=readFileSync(process.env.RUNNER_TEMP+'/natal-n15-filtered.html','utf8'); assert.match(h,/Research\/HOLD/u);"
          node --input-type=module -e "import {readFileSync} from 'node:fs'; import assert from 'node:assert/strict'; const q=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/natal-n14-linked.json','utf8')); assert.equal(q.caseCount,8); assert.ok(q.casesWithLinks>0); assert.ok(q.totalLinkedPairs>=q.casesWithLinks); assert.equal(q.consumerAuthorized,false); assert.equal(q.productionAuthorized,false); assert.ok(q.cases.every(c=>c.status==='research_only' && c.mayExposeAsConsumerInterpretation===false && c.linkedPairs.every(p=>!p.transitiveCausalInferenceAuthorized && !p.modernConsumerInferenceAuthorized && !p.publicationAuthorized && p.independentUpstreamT5ClaimRefs.length===3))); const h=readFileSync(process.env.RUNNER_TEMP+'/natal-n14-linked.html','utf8'); assert.match(h,/연구 검토 전용/u);"
          node --input-type=module -e "import {readFileSync} from 'node:fs'; import assert from 'node:assert/strict'; const p=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/natal-n13-research.json','utf8')); assert.equal(p.caseCount,8); assert.ok(p.matchedCaseCount>0); assert.equal(p.researchOnly,true); assert.equal(p.consumerPreviewAuthorized,false); assert.equal(p.productionAuthorized,false); assert.ok(p.cases.some(c=>c.relationCount>0)); assert.ok(p.cases.every(c=>c.sentences.every(s=>s.researchOnly && !s.consumerProjectionAuthorized && s.sourceLocators.length===2 && s.upstreamClaimRefs.length===2))); const h=readFileSync(process.env.RUNNER_TEMP+'/natal-n13-research.html','utf8'); assert.match(h,/내부 연구 검토 전용/u);"
          node --input-type=module -e "import {readFileSync} from 'node:fs'; import assert from 'node:assert/strict'; const s=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/natal-mur-shadow.json','utf8')); assert.equal(s.caseCount,35); assert.equal(s.technicalDeliveredCount,33); assert.equal(s.usefulCompleteCount,0); assert.equal(s.cases.length,35); assert.ok(s.cases.every(c=>c.lifecycle==='internal_quality_shadow' && c.mayChangeProductDelivery===false && c.mayApproveResearchSemantics===false && c.usefulComplete===false));"
          node --input-type=module -e "import {readFileSync} from 'node:fs'; import assert from 'node:assert/strict'; const r=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/natal-baseline.roles.json','utf8')); assert.equal(r.cases,35); assert.equal(r.meaningIdenticalPairs,20); assert.equal(r.rolePositionDifferences,20); assert.equal(r.remainIdenticalMeaningPairs,r.meaningIdenticalPairs); assert.equal(r.mayPublish,false); assert.equal(r.maySell,false);"
          node --input-type=module -e "import {readFileSync} from 'node:fs'; import assert from 'node:assert/strict'; const m=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/natal-baseline.meaning.json','utf8')); assert.equal(m.realConsumerCaseCount,35); assert.equal(m.consumerTextUnique,32); assert.equal(m.meaningTextUnique,18); assert.equal(m.actualRepeatedConsumerPairs,0); assert.equal(m.repeatedMeaningPairs,20); assert.equal(m.pairsSeparatedOnlyByCalculatedFacts,20); assert.equal(m.semanticCompletionGranted,false); assert.equal(m.mayPublish,false);"
          node --input-type=module -e "import {readFileSync} from 'node:fs'; import assert from 'node:assert/strict'; const x=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/natal-baseline.consumer.json','utf8')); assert.equal(x.caseCount,35); assert.equal(x.reconstructedLegacyRepeatedPairs,20); assert.equal(x.actualConsumerRepeatedPairs,0); assert.equal(x.resolvedPriorCopyCollisions,20); assert.equal(x.mayPublish,false);"
          node --input-type=module -e "import {readFileSync} from 'node:fs'; import assert from 'node:assert/strict'; const c=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/natal-baseline.context.json','utf8')); assert.equal(c.caseCount,35); assert.equal(c.mayPublish,false); assert.equal(c.maySell,false); assert.equal(c.previousRepeatedPairs,20); assert.ok(c.contextualizedPairs>0); assert.ok(c.contextualizedPairs<=c.previousRepeatedPairs);"
          node --input-type=module -e "import {readFileSync} from 'node:fs'; import assert from 'node:assert/strict'; const x=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/natal-baseline.rules.json','utf8')); const b=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/natal-baseline.meaning.json','utf8')); assert.equal(x.numberOfCases,35); assert.equal(x.mayPublish,false); assert.equal(x.maySell,false); assert.equal(x.researchEvidenceIsNotProductionAuthority,true); assert.equal(x.pairsWithSameCopyDifferentFacts.length,b.repeatedMeaningPairs); assert.equal(x.warningCounts.sameCopyDifferentRules,17); assert.equal(x.warningCounts.sameCopySameRulesDifferentChart,3);"
          node --input-type=module -e "import {readFileSync} from 'node:fs'; import assert from 'node:assert/strict'; const n=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/natal-baseline.n8-trace.json','utf8')); assert.equal(n.pairs.length,3); assert.equal(n.cases.length,5); assert.equal(n.explicitThemePreviewAdmission,'none'); assert.equal(n.mayPublish,false); assert.equal(n.maySell,false); assert.equal(n.mayPromoteResearchMeaning,false); assert.equal(n.sourceToParagraphMappingProven,false); assert.ok(n.pairs.every(p=>p.differentResearchThemeClaims && p.sameClaimOwnedCanonicalCopy && p.sameConsumerMeaning && !p.sourceToParagraphMappingProven)); assert.ok(n.cases.every(c=>c.rulePackLifecycle==='research' && c.researchThemes.length>0 && c.researchThemes.every(t=>t.targetedByProfile && t.projectedToCanonicalUnit && t.hasCanonicalText && t.includedInOfficialPlan)));"
          node --input-type=module -e "import {readFileSync} from 'node:fs'; import assert from 'node:assert/strict'; const t=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/natal-baseline.n25-trace.json','utf8')); assert.equal(t.caseCount,5); assert.equal(t.cases.length,5); assert.equal(new Set(t.cases.map(c=>c.caseId)).size,5); assert.ok(t.atomCount>0); assert.equal(t.exactUniqueMatches+t.ambiguousMatches+t.unprovenMatches,t.atomCount); assert.equal(t.mayPublish,false); assert.equal(t.maySell,false); assert.equal(t.mayApproveResearchMeaning,false); assert.ok(t.cases.every(c=>c.atoms.length>0 && c.atoms.every(a=>a.primaryUnitIds.length===1 && a.claimIds.length===1 && a.claimTypes.length===1 && !a.semanticDifferentiationProven)));"
          node --input-type=module -e "import {readFileSync} from 'node:fs'; import assert from 'node:assert/strict'; const p=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/natal-baseline.n25b-all-pairs.json','utf8')); assert.equal(p.rawCasePairCount,20); assert.equal(p.uniqueChartPairCount,19); assert.ok(p.executedDistinctCaseCount>=5); assert.ok(p.totalExecutedConsumerAtoms>=35); assert.equal(p.findings.length,19); assert.equal(Object.values(p.categoryCounts).reduce((s,n)=>s+n,0),19); assert.equal(p.mayPublish,false); assert.equal(p.maySell,false); assert.equal(p.mayApproveResearchMeaning,false); assert.equal(p.meaningDifferentiationProven,false); assert.ok(p.findings.every(x=>!x.semanticErrorProven && x.researchOrBridgeReviewRequired));"
          node --input-type=module -e "import {readFileSync} from 'node:fs'; import assert from 'node:assert/strict'; const n=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/natal-baseline.n9-repetition.json','utf8')); assert.equal(n.cases,35); assert.equal(n.exactRepeatItemsAfterCompaction,0); assert.deepEqual(n.casesWithExactRepeatsAfterCompaction,[]); assert.equal(n.distinctMeaningFingerprintsAfterCompaction,18); assert.equal(n.repeatedMeaningPairsAfterCompaction,20); assert.equal(n.semanticCompletionGranted,false); assert.equal(n.mayPublish,false); assert.equal(n.maySell,false);"
          node --input-type=module -e "import {readFileSync} from 'node:fs'; import assert from 'node:assert/strict'; const t=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/natal-baseline.n10-triage.json','utf8')); assert.equal(t.casePairCount,20); assert.equal(t.uniqueDisplayedChartPairCount,19); assert.deepEqual(t.casePairCategoryCounts,{same_rules_different_chart:3,same_family_different_channel:3,changed_family_or_mixture:8,added_or_missing_research_theme:6,other_rule_change:0}); assert.deepEqual(t.uniqueChartPairCategoryCounts,{same_rules_different_chart:3,same_family_different_channel:3,changed_family_or_mixture:8,added_or_missing_research_theme:5,other_rule_change:0}); assert.equal(t.mayPublish,false); assert.equal(t.maySell,false); assert.equal(t.mayApproveResearchMeaning,false);"
          node --input-type=module -e "import {readFileSync} from 'node:fs'; import assert from 'node:assert/strict'; const h=readFileSync(process.env.RUNNER_TEMP+'/natal-baseline.n11-review.html','utf8'); assert.equal((h.match(/<article class=/gu) || []).length,10); assert.equal((h.match(/사람 검수 기록 — 미완료/gu) || []).length,10); assert.match(h,/실제 사용자 본문/u); assert.match(h,/partial_evidence/u); assert.match(h,/delivered/u); assert.match(h,/사람 검수 미완료/u);"
          node scripts/natal-personalized-preview.mjs 1996-01-09 09:30 "$RUNNER_TEMP/natal-preview.html"
          node --input-type=module -e "import {readFileSync} from 'node:fs'; import assert from 'node:assert/strict'; const h=readFileSync(process.env.RUNNER_TEMP+'/natal-preview.html','utf8'); assert.match(h,/이 분야에만 전달된 풀이/u); assert.match(h,/분야별 고유 풀이/u); assert.match(h,/분야별 상세 실제 원문/u); assert.match(h,/해석 문장을 중복 없이/u);"
          node --input-type=module -e "import {readFileSync} from 'node:fs'; import assert from 'node:assert/strict'; const h=readFileSync(process.env.RUNNER_TEMP+'/natal-preview.html','utf8'); assert.match(h,/내 명식에서 확인된 십신 관계/u); assert.match(h,/연구용 관측 · 공식 해석 아님/u); assert.match(h,/Research/u); assert.match(h,/내 사주풀이, 핵심부터 읽기/u);"
          node --input-type=module -e "import {readFileSync} from 'node:fs'; import assert from 'node:assert/strict'; const h=readFileSync(process.env.RUNNER_TEMP+'/natal-preview.html','utf8'); assert.match(h,/내 사주를 한 장으로 읽기/u); assert.match(h,/N16 내부 Preview 정리/u); assert.match(h,/실제 응답 출처/u); assert.match(h,/새 해석은 만들지 않습니다/u);"
          node --input-type=module -e "import {readFileSync} from 'node:fs'; import assert from 'node:assert/strict'; const report=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/natal-baseline.json','utf8')); assert.equal(report.numberOfCases,35); assert.equal(report.mayPublish,false); assert.equal(report.maySell,false); const html=readFileSync(process.env.RUNNER_TEMP+'/natal-preview.html','utf8'); assert.match(html,/명식을 종합해서 읽는 출발점/u); assert.match(html,/내 명식의 구조를 반영한 해석/u); assert.match(html,/MYEONGHA/u)"

      - name: Upload internal natal N3 evidence
        uses: actions/upload-artifact@v4
        with:
          name: natal-n3-audit-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/natal-baseline.json
            ${{ runner.temp }}/natal-baseline.n21-reader-first.json
            ${{ runner.temp }}/natal-baseline.rules.json
            ${{ runner.temp }}/natal-baseline.context.json
            ${{ runner.temp }}/natal-baseline.consumer.json
            ${{ runner.temp }}/natal-baseline.meaning.json
            ${{ runner.temp }}/natal-baseline.roles.json
            ${{ runner.temp }}/natal-baseline.n8-trace.json
            ${{ runner.temp }}/natal-baseline.n25-trace.json
            ${{ runner.temp }}/natal-baseline.n25b-all-pairs.json
            ${{ runner.temp }}/natal-baseline.n9-repetition.json
            ${{ runner.temp }}/natal-baseline.n10-triage.json
            ${{ runner.temp }}/natal-baseline.n11-review.html
            ${{ runner.temp }}/natal-mur-shadow.json
            ${{ runner.temp }}/natal-n13-research.json
            ${{ runner.temp }}/natal-n13-research.html
            ${{ runner.temp }}/natal-n14-linked.json
            ${{ runner.temp }}/natal-n14-linked.html
            ${{ runner.temp }}/natal-n15-filtered.json
            ${{ runner.temp }}/natal-n15-filtered.html
            ${{ runner.temp }}/natal-n20-mixed.json
            ${{ runner.temp }}/natal-n20-mixed.html
            ${{ runner.temp }}/natal-preview.html
          if-no-files-found: error
          retention-days: 7

      - name: Research preview smoke
        run: npm run preview:research:smoke

  test:
    needs: quality
    if: needs.quality.outputs.full == 'true'
    name: CI Tests (${{ matrix.shard }}/16)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: true
      max-parallel: ${{ inputs.candidate_head != '' && 4 || 8 }}
      matrix:
        # Longest-first priority after narrowing test imports (PR #1971).
        # Shard membership is unchanged; only matrix scheduling priority changes.
        shard: [13, 9, 4, 11, 5, 12, 14, 2, 3, 8, 6, 10, 7, 1, 15, 16]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_head || github.sha }}
          fetch-depth: 0
      - name: Assemble pinned integration candidate
        if: inputs.candidate_head != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_PR: ${{ inputs.candidate_pr }}
          CANDIDATE_HEAD: ${{ inputs.candidate_head }}
          CANDIDATE_BASE: ${{ inputs.candidate_base }}
        run: node scripts/ci/integration-candidate.mjs prepare

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Run full regression shard
        run: npm run test -- --shard=${{ matrix.shard }}/16

  verify:
    name: CI Verify
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs:
      - quality
      - test
    if: ${{ always() }}

    steps:
      - name: Require every CI gate
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.test.result }}
          FULL_SELECTED: ${{ needs.quality.outputs.full }}
        shell: bash
        run: |
          set -euo pipefail
          test "$QUALITY_RESULT" = "success"
          if [[ "$FULL_SELECTED" == "true" ]]; then
            test "$TEST_RESULT" = "success"
          else
            test "$TEST_RESULT" = "skipped"
          fi
