name: CI

on:
  workflow_call:
    inputs:
      candidate_pr:
        required: true
        type: string
      candidate_head:
        required: true
        type: string
      candidate_base:
        required: true
        type: string
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: CI Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      full: ${{ steps.plan.outputs.full }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_head || github.sha }}
          fetch-depth: 0
      - name: Assemble pinned integration candidate
        if: inputs.candidate_head != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_PR: ${{ inputs.candidate_pr }}
          CANDIDATE_HEAD: ${{ inputs.candidate_head }}
          CANDIDATE_BASE: ${{ inputs.candidate_base }}
        run: node scripts/ci/integration-candidate.mjs prepare

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Require integration protection before staged CI
        if: github.event_name == 'pull_request' && vars.CI_STAGED_VERIFICATION == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CI_STAGED_VERIFICATION: ${{ vars.CI_STAGED_VERIFICATION }}
        run: node scripts/ci/integration-candidate.mjs policy
      - name: Resolve PR test plan
        id: plan
        env:
          CI_STAGED_VERIFICATION: ${{ vars.CI_STAGED_VERIFICATION }}
          CANDIDATE_HEAD: ${{ inputs.candidate_head }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci/pr-test-plan.mjs

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run affected tests and static contracts
        if: steps.plan.outputs.full == 'false'
        run: node scripts/ci/run-affected-tests.mjs

      - name: Natal internal personalization and five-domain HTML smoke
        run: |
          node scripts/natal-personalization-audit.mjs "$RUNNER_TEMP/natal-baseline.json"
          node --input-type=module -e "import {readFileSync} from 'node:fs'; import assert from 'node:assert/strict'; const x=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/natal-baseline.consumer.json','utf8')); assert.equal(x.caseCount,35); assert.equal(x.reconstructedLegacyRepeatedPairs,6); assert.equal(x.actualConsumerRepeatedPairs,0); assert.equal(x.resolvedPriorCopyCollisions,6); assert.equal(x.mayPublish,false);"
          node --input-type=module -e "import {readFileSync} from 'node:fs'; import assert from 'node:assert/strict'; const c=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/natal-baseline.context.json','utf8')); assert.equal(c.caseCount,35); assert.equal(c.mayPublish,false); assert.equal(c.maySell,false); assert.equal(c.previousRepeatedPairs,6); assert.ok(c.contextualizedPairs>0); assert.ok(c.contextualizedPairs<=c.previousRepeatedPairs);"
          node --input-type=module -e "import {readFileSync} from 'node:fs'; import assert from 'node:assert/strict'; const x=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/natal-baseline.rules.json','utf8')); const b=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/natal-baseline.json','utf8')); assert.equal(x.numberOfCases,35); assert.equal(x.mayPublish,false); assert.equal(x.maySell,false); assert.equal(x.researchEvidenceIsNotProductionAuthority,true); assert.equal(x.pairsWithSameCopyDifferentFacts.length,b.contrasts.filter(p=>p.kind==='different_facts_same_interpretation').length);"
          node scripts/natal-personalized-preview.mjs 1996-01-09 09:30 "$RUNNER_TEMP/natal-preview.html"
          node --input-type=module -e "import {readFileSync} from 'node:fs'; import assert from 'node:assert/strict'; const report=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/natal-baseline.json','utf8')); assert.equal(report.numberOfCases,35); assert.equal(report.mayPublish,false); assert.equal(report.maySell,false); const html=readFileSync(process.env.RUNNER_TEMP+'/natal-preview.html','utf8'); assert.match(html,/명식을 종합해서 읽는 출발점/u); assert.match(html,/내 명식의 구조를 반영한 해석/u); assert.match(html,/MYEONGHA/u)"

      - name: Upload internal natal N3 evidence
        uses: actions/upload-artifact@v4
        with:
          name: natal-n3-audit-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/natal-baseline.json
            ${{ runner.temp }}/natal-baseline.rules.json
            ${{ runner.temp }}/natal-baseline.context.json
            ${{ runner.temp }}/natal-baseline.consumer.json
            ${{ runner.temp }}/natal-preview.html
          if-no-files-found: error
          retention-days: 7

      - name: Research preview smoke
        run: npm run preview:research:smoke

  test:
    needs: quality
    if: needs.quality.outputs.full == 'true'
    name: CI Tests (${{ matrix.shard }}/16)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: true
      max-parallel: ${{ inputs.candidate_head != '' && 4 || 8 }}
      matrix:
        # Longest-first priority after narrowing test imports (PR #1971).
        # Shard membership is unchanged; only matrix scheduling priority changes.
        shard: [13, 9, 4, 11, 5, 12, 14, 2, 3, 8, 6, 10, 7, 1, 15, 16]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_head || github.sha }}
          fetch-depth: 0
      - name: Assemble pinned integration candidate
        if: inputs.candidate_head != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_PR: ${{ inputs.candidate_pr }}
          CANDIDATE_HEAD: ${{ inputs.candidate_head }}
          CANDIDATE_BASE: ${{ inputs.candidate_base }}
        run: node scripts/ci/integration-candidate.mjs prepare

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Run full regression shard
        run: npm run test -- --shard=${{ matrix.shard }}/16

  verify:
    name: CI Verify
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs:
      - quality
      - test
    if: ${{ always() }}

    steps:
      - name: Require every CI gate
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.test.result }}
          FULL_SELECTED: ${{ needs.quality.outputs.full }}
        shell: bash
        run: |
          set -euo pipefail
          test "$QUALITY_RESULT" = "success"
          if [[ "$FULL_SELECTED" == "true" ]]; then
            test "$TEST_RESULT" = "success"
          else
            test "$TEST_RESULT" = "skipped"
          fi
