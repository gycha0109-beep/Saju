name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: CI Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Research preview smoke
        run: npm run preview:research:smoke

  test:
    name: CI Tests (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Run full regression shard
        run: npm run test -- --shard=${{ matrix.shard }}/2

  verify:
    name: CI Verify
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs:
      - quality
      - test
    if: ${{ always() && !cancelled() }}

    steps:
      - name: Require every CI gate
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.test.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$QUALITY_RESULT" = "success"
          test "$TEST_RESULT" = "success"
