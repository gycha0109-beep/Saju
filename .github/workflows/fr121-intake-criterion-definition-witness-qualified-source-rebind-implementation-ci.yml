name: FR121 Intake Criterion Definition Witness-Qualified Source Rebind Implementation CI

on:
  pull_request:
    paths:
      - 'packages/face-reading/src/five-officers-intake-criterion-definition-witness-qualified-source-rebind-implementation-fr121.ts'
      - 'packages/face-reading/src/five-officers-intake-criterion-definition-witness-qualified-source-rebind-implementation-fr121.test.ts'
      - 'packages/face-reading/src/five-officers-intake-criterion-definition-witness-qualified-source-rebind-implementation-fr121-hardening.test.ts'
      - 'scripts/verify-fr121-intake-criterion-definition-witness-qualified-source-rebind-implementation.mjs'
      - '.github/workflows/fr121-intake-criterion-definition-witness-qualified-source-rebind-implementation-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-fr121-criterion-source-rebind-implementation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build Face Reading package
        run: npm run face:build
      - name: Verify FR121 persistence authority boundary
        run: npx vitest run packages/face-reading/src/five-officers-intake-criterion-definition-witness-qualified-source-rebind-implementation-fr121.test.ts packages/face-reading/src/five-officers-intake-criterion-definition-witness-qualified-source-rebind-implementation-fr121-hardening.test.ts
      - name: Verify FR121 exact criterion source rebind chain
        run: node scripts/verify-fr121-intake-criterion-definition-witness-qualified-source-rebind-implementation.mjs
