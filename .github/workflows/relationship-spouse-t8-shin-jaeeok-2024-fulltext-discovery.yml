name: Relationship Spouse T8 Shin Jaeeok 2024 Fulltext Discovery

on:
  pull_request:
    paths:
      - 'scripts/discover-relationship-spouse-t8-shin-jaeeok-2024-public-identity.py'
      - 'scripts/inspect-relationship-spouse-t8-shin-jaeeok-2024-riss-public-routes.py'
      - 'scripts/follow-relationship-spouse-t8-shin-jaeeok-2024-riss-fulltext-dispatcher.py'
      - '.github/workflows/relationship-spouse-t8-shin-jaeeok-2024-fulltext-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover-current-public-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover exact current public RISS identity
        run: python scripts/discover-relationship-spouse-t8-shin-jaeeok-2024-public-identity.py
      - name: Inspect exact RISS route contracts
        run: python scripts/inspect-relationship-spouse-t8-shin-jaeeok-2024-riss-public-routes.py
      - name: Follow exact site-authored RISS fulltext dispatcher once
        run: python scripts/follow-relationship-spouse-t8-shin-jaeeok-2024-riss-fulltext-dispatcher.py
      - name: Enforce exact identity and no-bypass boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('acquisition-shin-jaeeok-2024/public-route-report.json')
          j=json.loads(p.read_text(encoding='utf-8'))
          assert j['candidate']['author']=='신재억'
          assert j['candidate']['year']==2024
          assert j['exactRow']['control']=='49df877f9b4f8a08ffe0bdc3ef48d419'
          assert j['exactRow']['rissId']=='T16939654'
          assert j['exactRow']['uci']=='I804:44004-000000033581'
          assert j['guessedOpaqueIdentifierCount']==0
          assert j['loginBypass'] is False
          assert j['institutionAuthBypass'] is False
          assert j['paywallBypass'] is False
          assert j['drmRequestExecuted'] is False
          assert j['decryptionActionExecuted'] is False
          assert j['crossSourceSemanticStitching'] is False
          d=j['rissDispatcher']
          assert d['dispatcherImplementationObserved'] is True
          assert d['guessedOpaqueIdentifierCount']==0
          assert d['loginBypass'] is False
          assert d['institutionAuthBypass'] is False
          assert d['paywallBypass'] is False
          assert d['drmRequestExecuted'] is False
          assert d['decryptionActionExecuted'] is False
          print('Shin Jae-eok 2024 exact RISS route/no-bypass boundary verified')
          PY
      - name: Upload bounded route evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shin-jaeeok-2024-public-route-evidence
          path: |
            acquisition-shin-jaeeok-2024/report.json
            acquisition-shin-jaeeok-2024/public-route-report.json
            acquisition-shin-jaeeok-2024/riss-dispatcher-report.json
            acquisition-shin-jaeeok-2024/riss-fulltext-dispatch-response.html
            acquisition-shin-jaeeok-2024/riss-title-search-*.html
            acquisition-shin-jaeeok-2024/riss-detail.html
            acquisition-shin-jaeeok-2024/riss-script-*.txt
            acquisition-shin-jaeeok-2024/shin-jaeeok-2024.pdf
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0
