name: FR182 Volume 3 Visual Locator Probe

on:
  pull_request:
    paths:
      - '.github/workflows/fr182-volume3-visual-locator-probe.yml'

permissions:
  contents: read

jobs:
  render-visual-locator-range:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Download and verify fixed NLC witness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fr182/pages
          curl --fail --location --retry 3 --output /tmp/fr182/source.pdf \
            'https://upload.wikimedia.org/wikipedia/commons/2/22/NLC416-13jh001662-59167_%E7%A5%9E%E7%9B%B8%E5%85%A8%E7%B7%A8.pdf'
          printf '%s  %s\n' \
            '94167d8d19d47525535b39e18a20c6b315a3a30751c2063bc2492760f1d927af' \
            '/tmp/fr182/source.pdf' | sha256sum --check --strict
          test "$(pdfinfo /tmp/fr182/source.pdf | awk '/^Pages:/ {print $2}')" = '576'
      - name: Render broad visual locator range 100-220
        shell: bash
        run: |
          set -euo pipefail
          for page in $(seq 100 220); do
            pdftoppm -f "$page" -l "$page" -singlefile -r 90 -jpeg -jpegopt quality=72 \
              /tmp/fr182/source.pdf "/tmp/fr182/pages/nlc-1925-page-${page}"
          done
          test "$(find /tmp/fr182/pages -name '*.jpg' | wc -l)" = '121'
          sha256sum /tmp/fr182/pages/*.jpg > /tmp/fr182/pages/sha256sums-locator.txt
      - name: Upload visual locator pages
        uses: actions/upload-artifact@v4
        with:
          name: fr182-volume3-visual-locator-pages-100-220
          path: /tmp/fr182/pages/
          if-no-files-found: error
          retention-days: 1
