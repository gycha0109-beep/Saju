name: "[WT:saju-research] SA-7D-B1 1935 Jingxuan Liunian Once"
on:
  push:
    branches:
      - research/saju-research/sa7d-b1-volume5-scan
    paths:
      - scripts/research/sa7d_b1_1935_jingxuan_mingli_yueyan_scan.py
      - .github/workflows/sa7d-b1-1935-jingxuan-liunian-once.yml
permissions:
  contents: read
concurrency:
  group: sa7d-b1-1935-jingxuan-liunian-once
  cancel-in-progress: false
jobs:
  source-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install fixed JPEG validator
        run: python -m pip install --disable-pip-version-check --no-cache-dir "Pillow==11.3.0"
      - name: Fetch bounded 1935 Qing-derived printed Flow-Year fu original-page images
        run: python scripts/research/sa7d_b1_1935_jingxuan_mingli_yueyan_scan.py
      - name: Save source-page images and hashes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sa7d-b1-1935-jingxuan-liunian-source-proof
          path: .scan-1935-jingxuan/
          retention-days: 5
          if-no-files-found: warn
          include-hidden-files: true
