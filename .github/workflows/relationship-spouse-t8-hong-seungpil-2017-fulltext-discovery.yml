name: Relationship Spouse T8 Hong Seungpil 2017 Fulltext Discovery

on:
  pull_request:
    paths:
      - 'scripts/acquire-relationship-spouse-t8-hong-seungpil-2017-public-fulltext.py'
      - '.github/workflows/relationship-spouse-t8-hong-seungpil-2017-fulltext-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire-current-public-fulltext:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded PDF reader
        run: python -m pip install --disable-pip-version-check pypdf==6.0.0
      - name: Follow exact current public RISS route
        run: python scripts/acquire-relationship-spouse-t8-hong-seungpil-2017-public-fulltext.py
      - name: Print spouse and compatibility semantic contexts when body exists
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('acquisition-hong-seungpil-2017/hong-seungpil-2017.txt')
          if not p.exists():
              print('No complete body acquired; semantic review intentionally skipped.')
              raise SystemExit(0)
          t=p.read_text(encoding='utf-8')
          for term in ['배우자','부부','결혼','혼인','남편','아내','처','재성','관성','정재','정관','일지','배우자궁','궁합','음양','용신','상신','남자','여자','남성','여성']:
              print(f'\n### TERM {term}')
              shown=0
              for m in re.finditer(re.escape(term),t,re.I):
                  print(re.sub(r'\s+',' ',t[max(0,m.start()-500):min(len(t),m.end()+1500)]))
                  shown+=1
                  if shown>=15:
                      break
              print('COUNT_SHOWN',shown)
          PY
      - name: Enforce exact identity and no-bypass boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('acquisition-hong-seungpil-2017/report.json').read_text(encoding='utf-8'))
          c=j['candidate']
          assert c['author']=='홍승필' and c['year']==2017
          assert c['rissId']=='T14388745'
          assert c['control']=='8ebdb4487e4de984ffe0bdc3ef48d419'
          assert j['formTuple']['control_no']=='8ebdb4487e4de984ffe0bdc3ef48d419'
          assert j['formTuple']['p_mat_type']=='be54d9b8bc7cdb09'
          assert j['guessedOpaqueIdentifierCount']==0
          assert j['loginBypass'] is False and j['institutionAuthBypass'] is False and j['paywallBypass'] is False
          assert j['drmRequestExecuted'] is False and j['decryptionActionExecuted'] is False
          assert j['crossSourceSemanticStitching'] is False
          print('Hong Seungpil 2017 exact RISS/no-bypass public route verified')
          print('semanticDisposition=',j['semanticDisposition'])
          PY
      - name: Upload bounded acquisition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hong-seungpil-2017-public-route-evidence
          path: |
            acquisition-hong-seungpil-2017/report.json
            acquisition-hong-seungpil-2017/riss-detail.html
            acquisition-hong-seungpil-2017/riss-script-*.txt
            acquisition-hong-seungpil-2017/riss-fulltext-dispatch-response.html
            acquisition-hong-seungpil-2017/dcollection-entry.html
            acquisition-hong-seungpil-2017/dcollection-follow-*.html
            acquisition-hong-seungpil-2017/hong-seungpil-2017.pdf
            acquisition-hong-seungpil-2017/hong-seungpil-2017.txt
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0
