name: FR208 Cross-Face Neutral Observable Primitives CI

on:
  pull_request:
    paths:
      - 'packages/face-reading/src/cross-face-neutral-observable-primitives-fr208.ts'
      - 'packages/face-reading/src/cross-face-neutral-observable-primitives-fr208.test.ts'
      - 'packages/face-reading/src/face-reading-observable-morphology-measurement-boundary-fr206.ts'
      - 'packages/face-reading/src/face-reading-whole-face-minimum-measurement-inventory-fr207.ts'
      - 'research/face-reading/fr208-cross-face-neutral-observable-primitives.md'
      - '.github/workflows/fr208-cross-face-neutral-observable-primitives-ci.yml'

permissions:
  contents: read

jobs:
  verify-fr208-cross-face-primitives:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build Face Reading package
        run: npm run face:build
      - name: Verify FR208 neutral observable primitives
        run: npx vitest run packages/face-reading/src/cross-face-neutral-observable-primitives-fr208.test.ts
