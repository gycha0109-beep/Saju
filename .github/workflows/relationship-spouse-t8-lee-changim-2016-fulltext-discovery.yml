name: Relationship Spouse T8 Lee Changim 2016 Fulltext Discovery

on:
  pull_request:
    paths:
      - 'scripts/discover-relationship-spouse-t8-lee-changim-2016-public-fulltext.py'
      - 'scripts/review-relationship-spouse-t8-lee-changim-2016-body.py'
      - '.github/workflows/relationship-spouse-t8-lee-changim-2016-fulltext-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover-current-public-fulltext:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded PDF reader
        run: python -m pip install --disable-pip-version-check pypdf==6.0.0
      - name: Discover exact RISS identity and follow only page-authored public routes
        run: python scripts/discover-relationship-spouse-t8-lee-changim-2016-public-fulltext.py
      - name: Extract body locators only when a PDF was actually acquired
        run: python scripts/review-relationship-spouse-t8-lee-changim-2016-body.py
      - name: Enforce exact identity and no-bypass boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('acquisition-lee-changim-2016')
          acquisition=json.loads((root/'report.json').read_text(encoding='utf-8'))
          body=json.loads((root/'body-review.json').read_text(encoding='utf-8'))
          assert acquisition['identityResolved'] is True
          assert acquisition['candidate']['author'] == '이창임'
          assert acquisition['candidate']['year'] == 2016
          assert acquisition['candidate']['title'] == '子平四柱를 통한 夫婦宮合 硏究 : 宮位論을 中心으로'
          assert acquisition['resolvedExactRow']['control']
          for key in ['guessedOpaqueIdentifierCount','loginBypass','institutionAuthBypass','paywallBypass','drmRequestExecuted','decryptionActionExecuted','tlsVerificationDisabled','crossSourceSemanticStitching']:
              expected = 0 if key == 'guessedOpaqueIdentifierCount' else False
              assert acquisition['policy'][key] == expected, (key, acquisition['policy'][key])
          assert body['bodyLevelAdmissionDecisionMade'] is False
          if body['bodyObserved']:
              assert body['pdfSha256'] == acquisition['pdfSha256']
              assert body['pdfPages'] > 1
              assert body['semanticDisposition'] == 'FULL_BODY_ACQUIRED_REQUIRES_RENDER_FIRST_DIRECT_REVIEW'
          else:
              assert body['semanticDisposition'] == 'NO_DIRECT_BODY_ACQUIRED_NO_BODY_LEVEL_DECISION'
          print('Lee Changim 2016 exact identity/no-bypass/body-admission boundary verified')
          PY
      - name: Upload bounded acquisition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lee-changim-2016-public-fulltext-evidence
          path: |
            acquisition-lee-changim-2016/report.json
            acquisition-lee-changim-2016/body-review.json
            acquisition-lee-changim-2016/riss-search-*.html
            acquisition-lee-changim-2016/riss-detail.html
            acquisition-lee-changim-2016/hop-*.html
            acquisition-lee-changim-2016/hop-*.bin
            acquisition-lee-changim-2016/lee-changim-2016.pdf
            acquisition-lee-changim-2016/lee-changim-2016.txt
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0
