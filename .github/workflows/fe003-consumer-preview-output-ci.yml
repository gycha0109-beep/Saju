name: FE003 Consumer Preview Output CI

on:
  pull_request:
    paths:
      - 'packages/face-reading/src/consumer-safe-preview-output-fe003.ts'
      - 'packages/face-reading/src/consumer-safe-preview-output-fe003.test.ts'
      - 'packages/face-reading/src/preview-face-engine-runtime-fe002.ts'
      - 'packages/face-reading/src/preview-observable-engine-fe001.ts'
      - 'docs/face-engine/fe003-consumer-safe-preview-output.md'
      - '.github/workflows/fe003-consumer-preview-output-ci.yml'

permissions:
  contents: read

jobs:
  verify-fe003-consumer-preview-output:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build Face Reading package
        run: npm run face:build
      - name: Verify FE003 consumer-safe preview output
        run: npx vitest run packages/face-reading/src/consumer-safe-preview-output-fe003.test.ts
