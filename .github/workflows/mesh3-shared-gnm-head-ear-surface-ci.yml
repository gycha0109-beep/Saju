name: MESH3 Shared GNM Head Ear Surface CI

on:
  pull_request:
    paths:
      - '.github/workflows/mesh3-shared-gnm-head-ear-surface-ci.yml'
      - 'packages/face-geometry/**'
      - 'scripts/verify-face-geometry-mesh3.mjs'
      - 'tools/face-geometry/gnm/**'
  workflow_dispatch:

jobs:
  verify-shared-gnm-head:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify repository contract
        run: node scripts/verify-face-geometry-mesh3.mjs
      - name: Install exporter dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Compile Python tooling
        run: |
          python -m py_compile \
            tools/face-geometry/gnm/fetch_gnm_head.py \
            tools/face-geometry/gnm/export_gnm_template_head.py \
            tools/face-geometry/gnm/build_gnm_head_scene.py
      - name: Fetch and verify exact GNM Head asset
        run: |
          python tools/face-geometry/gnm/fetch_gnm_head.py \
            --output /tmp/gnm_head.npz
      - name: Export neutral full-head surface and provider ear masks
        run: |
          python tools/face-geometry/gnm/export_gnm_template_head.py \
            --npz /tmp/gnm_head.npz \
            --obj-out /tmp/gnm-head-neutral.obj \
            --regions-out /tmp/gnm-head-provider-regions.json \
            --metadata-out /tmp/gnm-head-export-metadata.json
      - name: Verify exported GNM geometry
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          meta = json.loads(Path('/tmp/gnm-head-export-metadata.json').read_text())
          regions = json.loads(Path('/tmp/gnm-head-provider-regions.json').read_text())
          assert meta['vertexCount'] > 468
          assert meta['triangleCount'] > 0
          assert meta['leftEarVertexCount'] > 0
          assert meta['rightEarVertexCount'] > 0
          assert meta['runtimeGNMDependency'] is False
          assert {r['id'] for r in regions['regions']} == {'left_ear', 'right_ear'}
          assert Path('/tmp/gnm-head-neutral.obj').stat().st_size > 0
          print(json.dumps(meta, sort_keys=True))
          PY
      - name: Install Blender headless rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y blender xvfb xauth libegl1 libgl1-mesa-dri libglx-mesa0
      - name: Build shared GNM head scene and ear preview
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          xvfb-run -a blender --background \
            --python tools/face-geometry/gnm/build_gnm_head_scene.py \
            -- \
            --obj /tmp/gnm-head-neutral.obj \
            --regions /tmp/gnm-head-provider-regions.json \
            --output /tmp/gnm-head-ear-regions.blend \
            --metadata-out /tmp/gnm-head-scene-metadata.json \
            --preview-out /tmp/gnm-head-ear-preview.png
      - name: Verify Blender artifacts
        run: |
          test -s /tmp/gnm-head-ear-regions.blend
          test -s /tmp/gnm-head-ear-preview.png
          test -s /tmp/gnm-head-scene-metadata.json
          grep -q '"productNeutral": true' /tmp/gnm-head-scene-metadata.json
          grep -q '"directMediaPipeVertexIdentity": false' /tmp/gnm-head-scene-metadata.json
      - name: Upload MESH3 authoring artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mesh3-shared-gnm-head-ear-surface
          if-no-files-found: error
          retention-days: 14
          path: |
            /tmp/gnm-head-neutral.obj
            /tmp/gnm-head-provider-regions.json
            /tmp/gnm-head-export-metadata.json
            /tmp/gnm-head-ear-regions.blend
            /tmp/gnm-head-scene-metadata.json
            /tmp/gnm-head-ear-preview.png
