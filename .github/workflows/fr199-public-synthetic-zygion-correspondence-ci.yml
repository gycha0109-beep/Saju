name: FR199 Public Synthetic Zygion Correspondence CI

on:
  push:
    branches:
      - research/fr199-public-synthetic-zygion-correspondence
    paths:
      - 'packages/face-reading/src/face-reading-public-synthetic-zygion-correspondence-fr199.ts'
      - 'packages/face-reading/src/face-reading-public-synthetic-zygion-correspondence-fr199.test.ts'
      - 'scripts/run-fr199-public-reference-experiment.mjs'
      - 'scripts/run-fr199-public-provider-experiment.mjs'
      - 'research/face-reading/fr199-public-synthetic-zygion-correspondence.md'
      - '.github/workflows/fr199-public-synthetic-zygion-correspondence-ci.yml'
  pull_request:
    paths:
      - 'packages/face-reading/src/face-reading-public-synthetic-zygion-correspondence-fr199.ts'
      - 'packages/face-reading/src/face-reading-public-synthetic-zygion-correspondence-fr199.test.ts'
      - 'scripts/run-fr199-public-reference-experiment.mjs'
      - 'scripts/run-fr199-public-provider-experiment.mjs'
      - 'research/face-reading/fr199-public-synthetic-zygion-correspondence.md'
      - '.github/workflows/fr199-public-synthetic-zygion-correspondence-ci.yml'

permissions:
  contents: read

jobs:
  fr199:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Typecheck face-reading
        run: npm run face:typecheck
      - name: Build face-reading
        run: npm run face:build
      - name: FR199 deterministic tests
        run: npx vitest run packages/face-reading/src/face-reading-public-synthetic-zygion-correspondence-fr199.test.ts
      - name: FR199 public source-exact reference experiment
        run: node scripts/run-fr199-public-reference-experiment.mjs
      - name: FR199 real MediaPipe provider experiment
        run: node scripts/run-fr199-public-provider-experiment.mjs
      - name: Upload FR199 provider experiment receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fr199-public-provider-experiment
          path: artifacts/face-reading/fr199-public-provider-experiment.json
          if-no-files-found: warn
          retention-days: 14
