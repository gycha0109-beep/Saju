name: FE023 Digest-Bound Product Session CI

on:
  pull_request:
    paths:
      - 'packages/face-reading/src/digest-bound-product-preview-session-fe023.ts'
      - 'packages/face-reading/src/digest-bound-product-preview-session-fe023.test.ts'
      - 'packages/face-reading/src/preview-engine.ts'
      - 'packages/face-reading/src/preview-engine.test.ts'
      - 'scripts/verify-fe008-preview-engine-package.mjs'
      - 'docs/face-engine/fe023-digest-bound-product-preview-session.md'
      - '.github/workflows/fe023-digest-bound-product-session-ci.yml'

permissions:
  contents: read

jobs:
  verify-fe023-digest-bound-product-session:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build Face Reading package
        run: npm run face:build
      - name: Verify FE023 digest-bound product session
        run: npx vitest run packages/face-reading/src/digest-bound-product-preview-session-fe023.test.ts packages/face-reading/src/preview-engine.test.ts
      - name: Verify package import boundary
        run: npm run face:verify:preview-package
