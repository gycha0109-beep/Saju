name: tmp-fr307-runtime-export-v2

on:
  push:
    branches:
      - ops/tmp-fr307-runtime-export-20261006
    paths:
      - .github/workflows/tmp-fr307-runtime-export-v2.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Prepare runtime bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle/site-packages bundle/model

          python -m pip install --upgrade pip
          python -m pip install huggingface-hub==0.29.3
          python -m pip install --target bundle/site-packages --no-deps             transformers==4.49.0             tokenizers==0.21.4             timm==1.0.22             huggingface-hub==0.29.3

          PYTHONPATH="$PWD/bundle/site-packages" python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id="microsoft/Florence-2-base",
              revision="5ca5edf5bd017b9919c05d08aebef5e4c7ac3bac",
              local_dir="bundle/model",
              local_dir_use_symlinks=False,
          )
          PY

          find bundle/model -type f -printf '%P %s\n' | sort > bundle/model-files.txt
          python - <<'PY'
          from pathlib import Path
          total=sum(p.stat().st_size for p in Path("bundle").rglob("*") if p.is_file())
          print(f"bundle_bytes={total}")
          PY

      - name: Upload runtime bundle
        uses: actions/upload-artifact@v4
        with:
          name: fr307-runtime-bundle-v2
          path: bundle
          retention-days: 1
          compression-level: 0
