name: FR227 External Evidence Byte Inspection CI

on:
  pull_request:
    paths:
      - 'packages/face-reading/src/observable-morphology-external-witness-evidence-fr225.ts'
      - 'packages/face-reading/src/observable-morphology-external-evidence-byte-inspection-fr227.ts'
      - 'packages/face-reading/src/observable-morphology-external-evidence-byte-inspection-fr227.test.ts'
      - 'research/face-reading/fr227-external-evidence-byte-inspection.md'
      - '.github/workflows/fr227-external-evidence-byte-inspection-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'packages/face-reading/src/observable-morphology-external-witness-evidence-fr225.ts'
      - 'packages/face-reading/src/observable-morphology-external-evidence-byte-inspection-fr227.ts'
      - 'packages/face-reading/src/observable-morphology-external-evidence-byte-inspection-fr227.test.ts'
      - 'research/face-reading/fr227-external-evidence-byte-inspection.md'
      - '.github/workflows/fr227-external-evidence-byte-inspection-ci.yml'

permissions:
  contents: read

jobs:
  verify-fr227-external-evidence-byte-inspection:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build Face Reading package
        run: npm run face:build
      - name: Verify FR227 external-evidence byte inspection
        run: npx vitest run packages/face-reading/src/observable-morphology-external-evidence-byte-inspection-fr227.test.ts
