name: FR147 Capture Condition Governance CI

on:
  pull_request:
    paths:
      - 'research/face-reading/fr146-square-broad-fang-repeated-governed-real-capture-dataset.md'
      - 'research/face-reading/fr147-square-broad-fang-capture-condition-governance.md'
      - 'packages/face-reading/src/five-officers-square-broad-fang-repeated-governed-real-capture-dataset-fr146.ts'
      - 'packages/face-reading/src/five-officers-square-broad-fang-capture-condition-governance-fr147.ts'
      - 'packages/face-reading/src/five-officers-square-broad-fang-capture-condition-governance-fr147.test.ts'
      - 'scripts/verify-fr147-square-broad-fang-capture-condition-governance.mjs'
      - '.github/workflows/fr147-capture-condition-governance-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-fr147-capture-condition-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Typecheck Face Reading package
        run: npm run face:typecheck
      - name: Build Face Reading package
        run: npm run face:build
      - name: Verify FR147 capture-condition governance boundary
        run: >-
          npx vitest run
          packages/face-reading/src/five-officers-square-broad-fang-capture-condition-governance-fr147.test.ts
      - name: Verify FR147 fail-closed authority and privacy contract
        run: node scripts/verify-fr147-square-broad-fang-capture-condition-governance.mjs
