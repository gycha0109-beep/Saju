name: Dispatch P0-OPS-01 Observation Evidence

on:
  push:
    branches:
      - ops/dispatch-p0-388-observation-evidence-20260923

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch exact-main observation evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: c1a3241ec6186fee2e8e6ef1a1336c0d5b6c1b70
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          [[ "$main_sha" == "$EXPECTED_MAIN_SHA" ]]

          gh workflow run production-monitoring-evidence.yml             --repo "$GITHUB_REPOSITORY"             --ref main

          gh workflow run production-latency-evidence.yml             --repo "$GITHUB_REPOSITORY"             --ref main             -f active_bearer_secret_version=1             -f sample_count=100             -f timeout_ms=10000
