name: Relationship Spouse T8 Park Hyeyoung 2018 Fulltext Acquisition

on:
  pull_request:
    paths:
      - 'scripts/acquire-relationship-spouse-t8-park-hyeyoung-2018-public-routes.py'
      - 'scripts/inspect-riss-fulltext-dispatch-park-hyeyoung-2018.py'
      - 'scripts/inspect-riss-national-library-bridge-park-hyeyoung-2018.py'
      - 'scripts/inspect-relationship-spouse-t8-park-hyeyoung-2018-nld-public-metadata-v2.py'
      - 'scripts/inspect-relationship-spouse-t8-park-hyeyoung-2018-nanet-public-route.py'
      - '.github/workflows/relationship-spouse-t8-park-hyeyoung-2018-fulltext-acquisition.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire-public-fulltext:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe exact public RISS and directly exposed institutional routes
        run: python scripts/acquire-relationship-spouse-t8-park-hyeyoung-2018-public-routes.py
      - name: Inspect RISS fulltext dispatcher source without content request
        run: python scripts/inspect-riss-fulltext-dispatch-park-hyeyoung-2018.py
      - name: Inspect exact RISS national-library local-bib routing context
        run: python scripts/inspect-riss-national-library-bridge-park-hyeyoung-2018.py
      - name: Inspect exact NLD target metadata and anonymous access boundary
        run: python scripts/inspect-relationship-spouse-t8-park-hyeyoung-2018-nld-public-metadata-v2.py
      - name: Inspect exact NANET public search-row and viewer boundary
        run: python scripts/inspect-relationship-spouse-t8-park-hyeyoung-2018-nanet-public-route.py
      - name: Print bounded evidence
        if: always()
        run: |
          test -f acquisition-park-hyeyoung-2018/summary.txt && cat acquisition-park-hyeyoung-2018/summary.txt || true
          test -f acquisition-park-hyeyoung-2018/riss-fulltext-dispatch-evidence.json && cat acquisition-park-hyeyoung-2018/riss-fulltext-dispatch-evidence.json || true
          test -f acquisition-park-hyeyoung-2018/riss-national-library-bridge-evidence.json && cat acquisition-park-hyeyoung-2018/riss-national-library-bridge-evidence.json || true
          test -f acquisition-park-hyeyoung-2018/nld-report.json && cat acquisition-park-hyeyoung-2018/nld-report.json || true
          test -f acquisition-park-hyeyoung-2018/nanet-report.json && cat acquisition-park-hyeyoung-2018/nanet-report.json || true
      - name: Enforce exact identity and no-bypass boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('acquisition-park-hyeyoung-2018/report.json').read_text())
          d=json.loads(Path('acquisition-park-hyeyoung-2018/riss-fulltext-dispatch-evidence.json').read_text())
          b=json.loads(Path('acquisition-park-hyeyoung-2018/riss-national-library-bridge-evidence.json').read_text())
          n=json.loads(Path('acquisition-park-hyeyoung-2018/nld-report.json').read_text())
          a=json.loads(Path('acquisition-park-hyeyoung-2018/nanet-report.json').read_text())
          assert j['candidate']['author']=='박혜영'
          assert j['candidate']['title']=='명리학 통변의 다양성 모색에 관한 연구 : 육친론을 중심으로'
          assert j['candidate']['riss']=='T14752312'
          assert j['riss']['control']=='90b96055ae1e4289ffe0bdc3ef48d419'
          assert j['riss']['fulltextTuples'] == [{
              'control_no':'90b96055ae1e4289ffe0bdc3ef48d419',
              'p_mat_type':'be54d9b8bc7cdb09',
              'p_submat_type':'f1a8c7a1de0e08b8',
              'fulltext_kind':'a8cb3aaead67ab5b'
          }]
          assert j['riss']['originalCheck']['body']=='{"flag":"T"}'
          assert j['guessedOpaqueIdentifierCount']==0
          assert j['loginBypass'] is False
          assert j['institutionAuthBypass'] is False
          assert j['paywallBypass'] is False
          assert j['drmRequestExecuted'] is False
          assert j['decryptionActionExecuted'] is False
          assert j['crossSourceSemanticStitching'] is False
          assert d['contentDownloadExecuted'] is False
          assert d['guessedOpaqueIdentifierCount']==0
          assert b['expectedBibno']=='KDM201900838'
          assert b['fieldName']=='nationalLibraryLocalBibno'
          assert b['exactHiddenFieldObserved'] is True
          assert b['bridgeRequestExecuted'] is False
          assert b['contentDownloadExecuted'] is False
          assert b['guessedOpaqueIdentifierCount']==0
          assert b['actionableRouteWindowCount']==0
          assert b['scriptOccurrenceCount']==0
          assert b['disposition']=='RISS_NATIONAL_LIBRARY_LOCAL_BIBNO_PRESENT_NO_SITE_AUTHORED_ROUTING_CONTRACT'
          assert n['metadataContract']['observed'] is True
          assert n['metadata']['title']=='명리학 통변의 다양성 모색에 관한 연구'
          assert n['metadata']['subTitle']=='육친론을 중심으로'
          assert n['metadata']['author']=='박혜영'
          assert n['metadata']['uniCno']=='162263'
          assert n['metadata']['ucCno']=='CAT-000168477'
          assert n['metadata']['dataTypeCode']=='DT'
          assert n['metadata']['targetDivCode']=='SP'
          assert n['anonymousSession']['requiresLogin'] is True
          assert n['anonymousSession']['returnsFalseBeforeAuthorityCheck'] is True
          assert n['targetActions']['executed'] is False
          assert n['contentActionExecuted'] is False
          assert n['accessAuthorityRequestExecuted'] is False
          assert n['allowedExternalFulltextUrls']==[]
          assert n['disposition']=='NLD_ANONYMOUS_LOGIN_GATE_NO_ALTERNATE_PUBLIC_FULLTEXT_URL'
          assert n['guessedOpaqueIdentifierCount']==0
          assert n['loginBypass'] is False
          assert n['institutionAuthBypass'] is False
          assert n['paywallBypass'] is False
          assert n['drmRequestExecuted'] is False
          assert n['decryptionActionExecuted'] is False
          assert a['candidate']['title']=='명리학 통변의 다양성 모색에 관한 연구 : 육친론을 중심으로'
          assert a['candidate']['author']=='박혜영'
          assert a['guessedOpaqueIdentifierCount']==0
          assert a['contentAssetActionExecuted'] is False
          assert a['drmRequestExecuted'] is False
          assert a['loginBypass'] is False
          assert a['institutionAuthBypass'] is False
          assert a['paywallBypass'] is False
          # NANET transport failure must never be collapsed into "no control".
          if a['exactControl'] is not None:
              assert a['controlResolutionDisposition']=='EXACT_PUBLIC_SEARCH_ROW_CONTROL_RESOLVED'
              assert a['search']['fetchSucceeded'] is True
              assert a['search']['exactRowControls']==[a['exactControl']]
              assert a['detail']['titleObserved'] is True
              assert a['detail']['authorObserved'] is True
              assert a['detail']['controlObserved'] is True
          elif a['controlResolutionDisposition']=='PUBLIC_SEARCH_FETCH_UNAVAILABLE':
              assert a['search']['fetchSucceeded'] is False
              assert a['search']['meta']['error']
              assert a['search']['exactRowControls']==[]
              assert a['detail']=={}
              assert a['viewer']=={}
              assert a['docviewer']=={}
          else:
              assert a['controlResolutionDisposition']=='NO_UNIQUE_EXACT_PUBLIC_SEARCH_ROW_CONTROL'
              assert a['search']['fetchSucceeded'] is True
          print('Park Hyeyoung exact RISS bridge/NLD/NANET bounded acquisition contract verified')
          PY
      - name: Upload bounded evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: park-hyeyoung-2018-bounded-fulltext-evidence
          path: |
            acquisition-park-hyeyoung-2018/report.json
            acquisition-park-hyeyoung-2018/summary.txt
            acquisition-park-hyeyoung-2018/riss-detail.html
            acquisition-park-hyeyoung-2018/riss-title-search.html
            acquisition-park-hyeyoung-2018/riss-original-check.txt
            acquisition-park-hyeyoung-2018/riss-fulltext-dispatch-evidence.json
            acquisition-park-hyeyoung-2018/riss-national-library-bridge-evidence.json
            acquisition-park-hyeyoung-2018/digital-knowledge.html
            acquisition-park-hyeyoung-2018/institutional-*.html
            acquisition-park-hyeyoung-2018/nld-detail.html
            acquisition-park-hyeyoung-2018/nld-metadata-response.json
            acquisition-park-hyeyoung-2018/nld-report.json
            acquisition-park-hyeyoung-2018/nanet-search.html
            acquisition-park-hyeyoung-2018/nanet-occurrence-contexts.json
            acquisition-park-hyeyoung-2018/nanet-detail.html
            acquisition-park-hyeyoung-2018/nanet-inner.js
            acquisition-park-hyeyoung-2018/nanet-viewer-bootstrap.html
            acquisition-park-hyeyoung-2018/docviewer-bootstrap.html
            acquisition-park-hyeyoung-2018/nanet-report.json
            acquisition-park-hyeyoung-2018/park-hyeyoung-2018.pdf
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0
