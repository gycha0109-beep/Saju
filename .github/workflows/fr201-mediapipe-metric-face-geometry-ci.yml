name: FR201 MediaPipe Metric Face Geometry CI

on:
  push:
    branches:
      - research/fr201-mediapipe-metric-face-geometry
    paths:
      - 'packages/face-reading/src/face-reading-mediapipe-metric-geometry-fr201.ts'
      - 'packages/face-reading/src/face-reading-mediapipe-metric-geometry-fr201.test.ts'
      - 'scripts/run-fr201-public-mediapipe-metric-face-geometry-experiment.mjs'
      - 'research/face-reading/fr201-mediapipe-metric-face-geometry.md'
      - '.github/workflows/fr201-mediapipe-metric-face-geometry-ci.yml'
  pull_request:
    paths:
      - 'packages/face-reading/src/face-reading-mediapipe-metric-geometry-fr201.ts'
      - 'packages/face-reading/src/face-reading-mediapipe-metric-geometry-fr201.test.ts'
      - 'scripts/run-fr201-public-mediapipe-metric-face-geometry-experiment.mjs'
      - 'research/face-reading/fr201-mediapipe-metric-face-geometry.md'
      - '.github/workflows/fr201-mediapipe-metric-face-geometry-ci.yml'

permissions:
  contents: read

jobs:
  fr201:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Typecheck face-reading
        run: npm run face:typecheck
      - name: Build face-reading
        run: npm run face:build
      - name: FR201 deterministic tests
        run: npx vitest run packages/face-reading/src/face-reading-mediapipe-metric-geometry-fr201.test.ts
      - name: FR201 real MediaPipe metric face geometry experiment
        run: node scripts/run-fr201-public-mediapipe-metric-face-geometry-experiment.mjs
      - name: Upload FR201 experiment receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fr201-public-mediapipe-metric-face-geometry-experiment
          path: artifacts/face-reading/fr201-public-mediapipe-metric-face-geometry-experiment.json
          if-no-files-found: warn
          retention-days: 14
