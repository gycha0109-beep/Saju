name: Relationship Spouse T8 Go Jaemin 2016 Public Fulltext Acquisition

on:
  pull_request:
    paths:
      - 'scripts/acquire-relationship-spouse-t8-go-jaemin-2016-public-fulltext.py'
      - 'scripts/acquire-relationship-spouse-t8-go-jaemin-2016-riss-js-stage2.py'
      - 'scripts/acquire-relationship-spouse-t8-go-jaemin-2016-riss-post-stage3.py'
      - 'scripts/acquire-relationship-spouse-t8-go-jaemin-2016-dcollection-tls-stage4.py'
      - '.github/workflows/relationship-spouse-t8-go-jaemin-2016-public-fulltext-acquisition.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire-public-fulltext:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Follow exact RISS-authored public routes only
        run: python scripts/acquire-relationship-spouse-t8-go-jaemin-2016-public-fulltext.py
      - name: Recover exact RISS fulltext JavaScript contract
        run: python scripts/acquire-relationship-spouse-t8-go-jaemin-2016-riss-js-stage2.py
      - name: Execute exact candidate-page-authored RISS POST contracts
        run: python scripts/acquire-relationship-spouse-t8-go-jaemin-2016-riss-post-stage3.py
      - name: Retry exact RISS-returned dCollection URI with transport-only TLS workaround
        run: python scripts/acquire-relationship-spouse-t8-go-jaemin-2016-dcollection-tls-stage4.py
      - name: Enforce identity and no-access-bypass boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('acquisition-go-jaemin-2016/report.json').read_text(encoding='utf-8'))
          s=json.loads(Path('acquisition-go-jaemin-2016-stage2/report.json').read_text(encoding='utf-8'))
          t=json.loads(Path('acquisition-go-jaemin-2016-stage3/report.json').read_text(encoding='utf-8'))
          u=json.loads(Path('acquisition-go-jaemin-2016-stage4/report.json').read_text(encoding='utf-8'))
          c=j['candidate']; p=j['policy']; i=j['identityObserved']; sp=s['policy']; tp=t['policy']; up=u['policy']; o=s['observedCandidateInputs']
          assert c['author']=='고재민' and c['year']==2016 and c['title']=='四柱命理의 宮星과 格局用神論 硏究'
          assert c['rissId']=='T14040293' and c['rissControl']=='01535e75dd09ae73ffe0bdc3ef48d419'
          assert i['title'] and i['author'] and i['year'] and i['rissId'] and i['originalViewLabel']
          assert all(x['guessedOpaqueIdentifierCount']==0 for x in (p,sp,tp,up))
          for x in (p,sp,tp,up):
              assert x['loginBypass'] is False
              assert x['institutionAuthBypass'] is False
              assert x['paywallBypass'] is False
              assert x['drmRequestExecuted'] is False
              assert x['decryptionActionExecuted'] is False
          assert up['credentialAdded'] is False
          assert up['tlsCertificateVerificationDisabled'] is True
          assert up['onlyExactRissReturnedAndLiteralSameHostAuthoredRoutesFollowed'] is True
          assert sp['contentRouteExecuted'] is False
          assert tp['ttsUriRewriteApplied'] is False and tp['onlyRawServerReturnedLiteralUriFollowed'] is True
          assert t['rawReturnedUrls']==['http://dhu.dcollection.net/jsp/common/SvcOrgDownLoad.jsp?item_id=000002241914']
          assert u['exactRissReturnedUrl']==t['rawReturnedUrls'][0]
          assert o['docType']=='T' and o['controlNo']=='14040293' and o['nationalLibraryLocalBibno']=='KDM201705404'
          assert s['pageAuthoredOriginalCheckEndpoint']=='/detail/originalCheck.do'
          assert t['originalCheck'].get('json')=={'flag':'T'}
          print('Go Jaemin 2016 staged public acquisition policy verified')
          print('stage4PdfCount=',len(u['pdfs']))
          print('stage4Boundary=',u['boundary'])
          for pdf in u['pdfs']:
              print('pdfSha256=',pdf['sha256'],'bytes=',pdf['bytes'],'final=',pdf['finalUrl'])
          PY
      - name: Upload bounded acquisition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-jaemin-2016-public-fulltext-evidence
          path: |
            acquisition-go-jaemin-2016/report.json
            acquisition-go-jaemin-2016/summary.txt
            acquisition-go-jaemin-2016/*.html.txt
            acquisition-go-jaemin-2016/*.pdf
            acquisition-go-jaemin-2016-stage2/report.json
            acquisition-go-jaemin-2016-stage2/summary.txt
            acquisition-go-jaemin-2016-stage2/*.js.txt
            acquisition-go-jaemin-2016-stage3/report.json
            acquisition-go-jaemin-2016-stage3/summary.txt
            acquisition-go-jaemin-2016-stage3/*.txt
            acquisition-go-jaemin-2016-stage3/*.pdf
            acquisition-go-jaemin-2016-stage4/report.json
            acquisition-go-jaemin-2016-stage4/summary.txt
            acquisition-go-jaemin-2016-stage4/*.html.txt
            acquisition-go-jaemin-2016-stage4/*.pdf
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0
