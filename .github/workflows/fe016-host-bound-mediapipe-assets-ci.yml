name: FE016 Host-Bound MediaPipe Assets CI

on:
  pull_request:
    paths:
      - 'packages/face-reading/src/host-bound-mediapipe-runtime-assets-fe016.ts'
      - 'packages/face-reading/src/host-bound-mediapipe-runtime-assets-fe016.test.ts'
      - 'packages/face-reading/src/preview-engine.ts'
      - 'packages/face-reading/src/preview-engine.test.ts'
      - 'scripts/verify-fe008-preview-engine-package.mjs'
      - 'docs/face-engine/fe016-host-bound-mediapipe-assets.md'
      - '.github/workflows/fe016-host-bound-mediapipe-assets-ci.yml'

permissions:
  contents: read

jobs:
  verify-fe016-host-bound-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build Face Reading package
        run: npm run face:build
      - name: Verify FE016 runtime asset factory
        run: npx vitest run packages/face-reading/src/host-bound-mediapipe-runtime-assets-fe016.test.ts packages/face-reading/src/preview-engine.test.ts
      - name: Verify package import boundary
        run: npm run face:verify:preview-package
