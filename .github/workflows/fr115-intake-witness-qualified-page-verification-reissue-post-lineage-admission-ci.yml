name: FR115 Intake Witness-Qualified Page Verification Reissue Post-Lineage Admission CI

on:
  pull_request:
    paths:
      - 'packages/face-reading/src/five-officers-intake-witness-qualified-page-verification-reissue-post-lineage-admission-review-fr115.ts'
      - 'packages/face-reading/src/five-officers-intake-witness-qualified-page-verification-reissue-post-lineage-admission-review-fr115.test.ts'
      - 'packages/face-reading/src/five-officers-intake-witness-qualified-page-verification-reissue-post-lineage-admission-review-fr115-hardening.test.ts'
      - 'scripts/verify-fr115-intake-witness-qualified-page-verification-reissue-post-lineage-admission.mjs'
      - '.github/workflows/fr115-intake-witness-qualified-page-verification-reissue-post-lineage-admission-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-fr115-post-lineage-reissue-admission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build Face Reading package
        run: npm run face:build
      - name: Verify FR115 authority boundary
        run: npx vitest run packages/face-reading/src/five-officers-intake-witness-qualified-page-verification-reissue-post-lineage-admission-review-fr115.test.ts packages/face-reading/src/five-officers-intake-witness-qualified-page-verification-reissue-post-lineage-admission-review-fr115-hardening.test.ts
      - name: Verify FR115 exact admission chain
        run: node scripts/verify-fr115-intake-witness-qualified-page-verification-reissue-post-lineage-admission.mjs
