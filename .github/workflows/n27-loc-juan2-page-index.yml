name: N27 LOC Juan 2 targeted missing primary images

on:
  push:
    branches: [research/saju/natal-19-pair-semantic-return-20261017]
    paths: ['.github/workflows/n27-loc-juan2-page-index.yml']

permissions:
  contents: read

jobs:
  missing-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Retrieve only 34 previously missing official IIIF preview images with rate-limit stop
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet Pillow
          mkdir -p loc-juan2-missing/pages loc-juan2-missing/sheets
          python3 - <<'PY'
          import hashlib, io, json, pathlib, time, urllib.error, urllib.request
          from PIL import Image, ImageDraw
          root=pathlib.Path('loc-juan2-missing')
          targets=[13, *range(27,60)]
          base='https://tile.loc.gov/image-services/iiif/service:asian:lcnclscd:2014514308:1A002:'
          headers={'User-Agent':'MyeongHa-N27 scholarly primary-text inspection (public IIIF, paced single request)'}
          results=[]
          blocked=False
          for i in targets:
              # Verified path template from previously acquired official LOC page-index.
              image_id=f'{i-1:02d}b{i:02d}a'
              url=base+image_id+'/full/pct:25/0/default.jpg'
              if blocked:
                  results.append({'page':i,'status':'NOT_REQUESTED_AFTER_LIMIT','url':url})
                  continue
              time.sleep(4.0)
              try:
                  req=urllib.request.Request(url,headers=headers)
                  with urllib.request.urlopen(req,timeout=45) as response:
                      payload=response.read()
                  image=Image.open(io.BytesIO(payload));image.verify()
                  dst=root/'pages'/f'loc-juan2-{i:02d}.jpg'
                  dst.write_bytes(payload)
                  results.append({'page':i,'status':'FETCHED','url':url,
                                  'bytes':len(payload),'sha256':hashlib.sha256(payload).hexdigest()})
                  print('N27_LOC_MISSING_FETCHED',i,len(payload),flush=True)
              except urllib.error.HTTPError as e:
                  results.append({'page':i,'status':'HTTP_'+str(e.code),'url':url})
                  print('N27_LOC_MISSING_HTTP',i,e.code,flush=True)
                  if e.code in (429,403): blocked=True
              except Exception as e:
                  results.append({'page':i,'status':'ERROR','url':url,'error':repr(e)[:200]})
                  print('N27_LOC_MISSING_ERROR',i,repr(e)[:120],flush=True)
          (root/'missing-page-index.json').write_text(json.dumps(results,ensure_ascii=False,indent=2))
          successes=[x for x in results if x['status']=='FETCHED']
          print('N27_LOC_MISSING_OK',len(successes),'OF',len(targets),flush=True)
          for start in range(0,len(targets),12):
              items=targets[start:start+12]
              sheet=Image.new('RGB',(3*460,4*570),'white')
              draw=ImageDraw.Draw(sheet)
              for j,i in enumerate(items):
                  x=(j%3)*460; y=(j//3)*570
                  draw.text((x+6,y+4),f'LOC Juan 2 image {i:02d}',fill='black')
                  p=root/'pages'/f'loc-juan2-{i:02d}.jpg'
                  if p.exists():
                      with Image.open(p) as src:
                          im=src.convert('RGB')
                          im.thumbnail((446,533))
                          sheet.paste(im,(x+(460-im.width)//2,y+25))
              sheet.save(root/'sheets'/f'loc-juan2-missing-{start+1:02d}-{start+len(items):02d}.jpg',quality=80)
          PY
      - name: Upload targeted acquisition record and print contact sheets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n27-loc-juan2-only-missing-34
          path: loc-juan2-missing
          retention-days: 14
