name: N27 LOC Juan 2 terminal image provenance check

on:
  push:
    branches: [research/saju/natal-19-pair-semantic-return-20261017]
    paths: ['.github/workflows/n27-loc-juan2-page-index.yml']

permissions:
  contents: read

jobs:
  tail-page-lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Inspect LOC official segment 59 then one inferred IIIF candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p n27-loc-terminal/pages
          python3 - <<'PY'
          import hashlib, json, pathlib, time, urllib.request, urllib.error
          root=pathlib.Path('n27-loc-terminal')
          url='https://www.loc.gov/resource/lcnclscd.2014514308.1A002/?sp=59&fo=json'
          known58='https://tile.loc.gov/image-services/iiif/service:asian:lcnclscd:2014514308:1A002:57b000/full/pct:25/0/default.jpg'
          inferred59=known58.replace(':57b000/', ':58b000/')
          report={'ordinal':59,'known_58_iiif':known58,
                  'attempts':[],'result':'NOT_FETCHED',
                  'inference_is_an_unverified_candidate':True}
          headers={'User-Agent':'MyeongHa-N27-public-source-research/1.0 (paced, single-image)'}
          def get(u, timeout=18):
              req=urllib.request.Request(u,headers=headers)
              with urllib.request.urlopen(req,timeout=timeout) as f:
                  return f.read(),f.headers.get('Content-Type','')
          def record(u,kind):
              attempt={'kind':kind,'url':u}
              report['attempts'].append(attempt)
              try:
                  data,mime=get(u)
                  attempt['status']='HTTP_200'
                  attempt['content_type']=mime
                  attempt['bytes']=len(data)
                  return data
              except urllib.error.HTTPError as e:
                  attempt['status']='HTTP_'+str(e.code)
              except Exception as e:
                  attempt['status']='ERROR';attempt['error']=repr(e)[:180]
              return None
          metadata=record(url,'official_ordinal_59_json')
          candidate=None
          if metadata:
              try:
                  meta=json.loads(metadata)
                  images=meta.get('segments',[{}])[0].get('image_url',[])
                  c=[x.split('#')[0] for x in images if '/pct:25/' in x]
                  report['official_image_url_candidates']=c[:3]
                  if c: candidate=c[0]
              except Exception as e:
                  report['metadata_parse_error']=repr(e)[:180]
          time.sleep(6)
          if candidate:
              payload=record(candidate,'official_iiif_image')
          else:
              payload=record(inferred59,'single_inferred_iiif_image')
          if payload and payload.startswith(b'\xff\xd8\xff'):
              p=root/'pages'/'loc-juan2-59.jpg'
              p.write_bytes(payload)
              report.update(result='FETCHED',
                            identification='OFFICIAL_METADATA' if candidate else 'IIIF_PATTERN_INFERRED_NEEDS_CATALOG_CONFIRMATION',
                            bytes=len(payload),sha256=hashlib.sha256(payload).hexdigest())
          elif payload:
              report['result']='HTTP_200_NON_JPEG'
          (root/'terminal-image-result.json').write_text(json.dumps(report,indent=2,ensure_ascii=False))
          print('LOC_59_RESULT', report['result'],flush=True)
          print('LOC_59_ATTEMPTS',[(x['kind'],x.get('status')) for x in report['attempts']],flush=True)
          PY
      - name: Preserve only official request evidence and verified image bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n27-loc-juan2-terminal-image-check
          path: n27-loc-terminal
          retention-days: 14
