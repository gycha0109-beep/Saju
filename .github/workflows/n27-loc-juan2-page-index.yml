name: N27 LOC Juan 2 final two page metadata lookup

on:
  push:
    branches: [research/saju/natal-19-pair-semantic-return-20261017]
    paths: ['.github/workflows/n27-loc-juan2-page-index.yml']

permissions:
  contents: read

jobs:
  tail-page-lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Resolve official LOC image paths for remaining 58 and 59 only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p loc-juan2-tail/pages
          python3 - <<'PY'
          import hashlib,json,pathlib,time,urllib.request,urllib.error
          root=pathlib.Path('loc-juan2-tail')
          base='https://www.loc.gov/resource/lcnclscd.2014514308.1A002/'
          headers={'User-Agent':'MyeongHa-N27 scholarly archival inspection; two paced official metadata lookups'}
          out=[]
          blocked=False
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=40) as f:return f.read()
          for i in (58,59):
              if blocked:
                  out.append({'page':i,'status':'NOT_REQUESTED_AFTER_LIMIT'})
                  continue
              time.sleep(5)
              rec={'page':i,'metadata_url':base+'?fo=json&sp='+str(i)}
              try:
                  meta=json.loads(get(rec['metadata_url']))
                  candidates=meta.get('segments',[{}])[0].get('image_url',[])
                  rec['candidate_image_urls']=candidates
                  matching=[s for s in candidates if '/pct:25/' in s]
                  if not matching:
                      rec['status']='NO_PCT25_IMAGE_URL'
                  else:
                      url=matching[0].split('#')[0]
                      rec['url']=url
                      time.sleep(5)
                      blob=get(url)
                      (root/'pages'/f'loc-juan2-{i:02d}.jpg').write_bytes(blob)
                      rec.update(status='FETCHED',bytes=len(blob),sha256=hashlib.sha256(blob).hexdigest())
              except urllib.error.HTTPError as e:
                  rec['status']='HTTP_'+str(e.code)
                  if e.code in (403,429):blocked=True
              except Exception as e:
                  rec['status']='ERROR';rec['error']=repr(e)[:200]
              out.append(rec)
              print('N27_LOC_TAIL_RESULT',i,rec['status'],flush=True)
          (root/'tail-index.json').write_text(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Preserve exact endpoint results and successful image bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n27-loc-juan2-tail-58-59
          path: loc-juan2-tail
          retention-days: 14
