name: FR238 Research Live Capture Session Runtime CI

on:
  pull_request:
    paths:
      - 'packages/face-reading/src/observable-morphology-research-live-capture-session-runtime-fr238.ts'
      - 'packages/face-reading/src/observable-morphology-research-live-capture-session-runtime-fr238.test.ts'
      - 'research/face-reading/fr238-research-live-capture-session-runtime.md'
      - '.github/workflows/fr238-research-live-capture-session-runtime-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'packages/face-reading/src/observable-morphology-research-live-capture-session-runtime-fr238.ts'
      - 'packages/face-reading/src/observable-morphology-research-live-capture-session-runtime-fr238.test.ts'
      - 'research/face-reading/fr238-research-live-capture-session-runtime.md'
      - '.github/workflows/fr238-research-live-capture-session-runtime-ci.yml'

jobs:
  fr238-research-live-capture-session-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run face:build
      - run: npx vitest run packages/face-reading/src/observable-morphology-research-live-capture-session-runtime-fr238.test.ts
