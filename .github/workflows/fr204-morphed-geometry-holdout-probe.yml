name: FR204 Morphed Geometry Holdout Probe

on:
  push:
    branches:
      - research/fr204-morphed-geometry-holdout
    paths:
      - '.github/workflows/fr204-morphed-geometry-holdout-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe pinned morphed archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fr204
          declare -A URLS
          URLS[male-23]='https://raw.githubusercontent.com/research-digitized-rhinoplasty/3D-face-morph-dataset-male/c3417d0f71b3c37444f77085f0715bf0700333b6/morphed-3D/male-23.zip'
          URLS[male-27]='https://raw.githubusercontent.com/research-digitized-rhinoplasty/3D-face-morph-dataset-male/c3417d0f71b3c37444f77085f0715bf0700333b6/morphed-3D/male-27.zip'
          URLS[female-26]='https://raw.githubusercontent.com/research-digitized-rhinoplasty/3D-face-morph-dataset-female/804bbf72a0e377c1175a6a38fd1f833242b775b3/morphed-3D/female-26.zip'
          URLS[female-28]='https://raw.githubusercontent.com/research-digitized-rhinoplasty/3D-face-morph-dataset-female/804bbf72a0e377c1175a6a38fd1f833242b775b3/morphed-3D/female-28.zip'
          for id in male-23 male-27 female-26 female-28; do
            echo "===== ${id} ====="
            curl --fail --location --silent --show-error "${URLS[$id]}" -o "/tmp/fr204/${id}.zip"
            sha256sum "/tmp/fr204/${id}.zip"
            unzip -Z1 "/tmp/fr204/${id}.zip" | sed -n '1,200p'
          done
