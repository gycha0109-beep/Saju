name: Relationship Spouse T8 Kim Sanghan 2026 Exact KCI Reacquisition

on:
  pull_request:
    paths:
      - 'scripts/acquire-relationship-spouse-t8-kim-sanghan-2026-exact-kci.py'
      - '.github/workflows/relationship-spouse-t8-kim-sanghan-exact-kci-reacquisition.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reacquire-public-kci-fulltext:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF inspection dependencies
        run: python -m pip install --disable-pip-version-check 'pypdf[crypto]' pymupdf
      - name: Probe exact public KCI backend
        run: python scripts/acquire-relationship-spouse-t8-kim-sanghan-2026-exact-kci.py
      - name: Print bounded acquisition evidence
        if: always()
        run: |
          test -f acquisition-kim-sanghan-2026/summary.txt && cat acquisition-kim-sanghan-2026/summary.txt || true
          test -f acquisition-kim-sanghan-2026/report.json && python - <<'PY'
          import json
          from pathlib import Path
          p = Path('acquisition-kim-sanghan-2026/report.json')
          if p.exists():
              j = json.loads(p.read_text())
              print(json.dumps({
                  'candidate': j.get('candidate'),
                  'discoveredOrteFileIds': j.get('discoveredOrteFileIds'),
                  'fullLengthPdfAcquired': j.get('fullLengthPdfAcquired'),
                  'downloadAttempts': j.get('downloadAttempts'),
                  'pdfs': j.get('pdfs'),
              }, ensure_ascii=False, indent=2))
          PY
      - name: Enforce acquisition identity boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          j = json.loads(Path('acquisition-kim-sanghan-2026/report.json').read_text())
          assert j['candidate']['kciArticleId'] == 'ART003370620'
          assert j['candidate']['doi'] == '10.55793/jkhc.2026.33.631'
          assert j['candidate']['printedPages'] == '631-665'
          print('Identity boundary verified; fullLengthPdfAcquired=', j['fullLengthPdfAcquired'])
          PY
      - name: Upload bounded rendered evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kim-sanghan-2026-exact-kci-bounded-evidence
          path: |
            acquisition-kim-sanghan-2026/summary.txt
            acquisition-kim-sanghan-2026/report.json
            acquisition-kim-sanghan-2026/rendered-*.png
          if-no-files-found: warn
          retention-days: 1
