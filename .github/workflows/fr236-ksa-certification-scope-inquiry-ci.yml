name: FR236 KSA Certification Scope Inquiry CI

on:
  pull_request:
    paths:
      - 'packages/face-reading/src/observable-morphology-ksa-certification-scope-inquiry-fr236.ts'
      - 'packages/face-reading/src/observable-morphology-ksa-certification-scope-inquiry-fr236.test.ts'
      - 'research/face-reading/fr236-ksa-certification-scope-inquiry-package.md'
      - '.github/workflows/fr236-ksa-certification-scope-inquiry-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'packages/face-reading/src/observable-morphology-ksa-certification-scope-inquiry-fr236.ts'
      - 'packages/face-reading/src/observable-morphology-ksa-certification-scope-inquiry-fr236.test.ts'
      - 'research/face-reading/fr236-ksa-certification-scope-inquiry-package.md'
      - '.github/workflows/fr236-ksa-certification-scope-inquiry-ci.yml'

jobs:
  fr236-ksa-certification-scope-inquiry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run face:build
      - run: npx vitest run packages/face-reading/src/observable-morphology-ksa-certification-scope-inquiry-fr236.test.ts
