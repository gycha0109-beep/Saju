name: FR197 Provider Zygion Validation Protocol CI

on:
  pull_request:
    paths:
      - 'packages/face-reading/src/face-reading-provider-zygion-validation-protocol-fr197.ts'
      - 'packages/face-reading/src/face-reading-provider-zygion-validation-protocol-fr197.test.ts'
      - 'research/face-reading/fr197-provider-zygion-validation-protocol.md'
      - '.github/workflows/fr197-provider-zygion-validation-protocol-ci.yml'

permissions:
  contents: read

jobs:
  verify-fr197-provider-zygion-validation-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build Face Reading package
        run: npm run face:build
      - name: Verify FR197 provider-to-neutral zygion validation protocol
        run: npx vitest run packages/face-reading/src/face-reading-provider-zygion-validation-protocol-fr197.test.ts
