name: "[WT:saju-research] SA-7D-B1 Volume5 One-shot Page Proof"
on:
  push:
    branches:
      - research/saju-research/sa7d-b1-volume5-scan
    paths:
      - scripts/research/acquire_sa7d_b1_volume5_scan.py
      - scripts/research/acquire_sa7d_b1_volume5_page_previews.py
      - .github/workflows/sa7d-b1-volume5-once.yml
  workflow_dispatch:
    inputs:
      watchtower_track:
        description: CI Watchtower Track Key
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: sa7d-b1-volume5-original-acquisition
  cancel-in-progress: false
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install exact PDF page image validator
        run: python -m pip install --disable-pip-version-check --no-cache-dir "Pillow==11.3.0"
      - name: Acquire Commons-issued page thumbnails, not PDF original
        run: python scripts/research/acquire_sa7d_b1_volume5_page_previews.py
      - name: Upload direct PDF-derived preview manifest (not primary PDF evidence)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sa7d-b1-volume5-page-previews
          path: .scan-evidence/
          if-no-files-found: warn
          retention-days: 5
          include-hidden-files: true
