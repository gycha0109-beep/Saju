name: Relationship Spouse T8 Nam Gidong 2020 Fulltext Discovery

on:
  pull_request:
    paths:
      - 'scripts/acquire-relationship-spouse-t8-nam-gidong-2020-public-fulltext.py'
      - '.github/workflows/relationship-spouse-t8-nam-gidong-2020-fulltext-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire-current-public-fulltext:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded PDF reader
        run: python -m pip install --disable-pip-version-check pypdf==6.0.0
      - name: Follow exact current public RISS route
        run: python scripts/acquire-relationship-spouse-t8-nam-gidong-2020-public-fulltext.py
      - name: Print spouse and compatibility semantic contexts when body exists
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('acquisition-nam-gidong-2020/nam-gidong-2020.txt')
          if not p.exists():
              print('No complete body acquired; semantic review intentionally skipped.')
              raise SystemExit(0)
          t=p.read_text(encoding='utf-8')
          for term in ['배우자궁','배우자성','배우자','부부','궁합','혼인','결혼','남편','아내','재성','관성','정재','정관','일지','女命','男命','여명','남명','여자','남자','성별','중화','해로','이별']:
              print(f'\n### TERM {term}')
              shown=0
              for m in re.finditer(re.escape(term),t,re.I):
                  print(re.sub(r'\s+',' ',t[max(0,m.start()-500):min(len(t),m.end()+1500)]))
                  shown+=1
                  if shown>=15:
                      break
              print('COUNT_SHOWN',shown)
          PY
      - name: Enforce exact identity and no-bypass boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('acquisition-nam-gidong-2020/report.json').read_text(encoding='utf-8'))
          c=j['candidate']
          assert c['author']=='남기동' and c['year']==2020
          assert c['rissId']=='T15540056'
          assert c['control']=='6e314e369d786dffffe0bdc3ef48d419'
          assert j['formTuple']['control_no']=='6e314e369d786dffffe0bdc3ef48d419'
          assert j['formTuple']['p_mat_type']=='be54d9b8bc7cdb09'
          assert j['guessedOpaqueIdentifierCount']==0
          assert j['loginBypass'] is False and j['institutionAuthBypass'] is False and j['paywallBypass'] is False
          assert j['drmRequestExecuted'] is False and j['decryptionActionExecuted'] is False
          assert j['tlsVerificationDisabled'] is False and j['crossSourceSemanticStitching'] is False
          if j['semanticDisposition']=='DIRECT_BODY_ACQUIRED_REQUIRES_RENDER_FIRST_REVIEW':
              assert j['fullLengthPdfAcquired'] is True
              assert j['pdfInspection']['pages'] >= 150
              assert j['pdfInspection']['encrypted'] is False
          else:
              assert j['semanticDisposition']=='PUBLIC_ACCESS_BOUNDARY_ONLY_NO_DIRECT_BODY_DECISION'
          print('Nam Gidong 2020 exact RISS/no-bypass public route verified')
          print('semanticDisposition=',j['semanticDisposition'])
          PY
      - name: Upload bounded acquisition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nam-gidong-2020-public-route-evidence
          path: |
            acquisition-nam-gidong-2020/report.json
            acquisition-nam-gidong-2020/riss-detail.html
            acquisition-nam-gidong-2020/riss-script-*.txt
            acquisition-nam-gidong-2020/riss-fulltext-dispatch-response.html
            acquisition-nam-gidong-2020/dcollection-entry.html
            acquisition-nam-gidong-2020/dcollection-follow-*.html
            acquisition-nam-gidong-2020/nam-gidong-2020.pdf
            acquisition-nam-gidong-2020/nam-gidong-2020.txt
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0
