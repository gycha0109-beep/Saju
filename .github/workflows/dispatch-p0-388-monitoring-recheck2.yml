name: Dispatch P0-OPS-01 Monitoring Recheck 2

on:
  push:
    branches:
      - ops/dispatch-p0-388-monitoring-recheck2-20260923

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch monitoring evidence from exact main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: c1a3241ec6186fee2e8e6ef1a1336c0d5b6c1b70
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          [[ "$main_sha" == "$EXPECTED_MAIN_SHA" ]]
          gh workflow run production-monitoring-evidence.yml             --repo "$GITHUB_REPOSITORY"             --ref main
