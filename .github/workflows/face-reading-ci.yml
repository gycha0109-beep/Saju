name: Face Reading CI

on:
  pull_request:
    paths:
      - 'packages/face-reading/**'
      - 'docs/migrations/face-reading-from-myeongha.manifest.json'
      - 'scripts/verify-face-reading-migration.mjs'
      - 'scripts/verify-fr76-mediapipe-parity.mjs'
      - 'scripts/verify-fr77-governed-metric-runtime.mjs'
      - 'scripts/verify-fr78-governed-metric-lips-surface.mjs'
      - 'scripts/verify-fr79-pose-normalized-lips-geometry.mjs'
      - 'scripts/verify-fr80-neutral-mouth-contour-metric.mjs'
      - 'scripts/verify-fr82-neutral-mouth-relative-size-metric.mjs'
      - 'scripts/verify-fr85-role-free-contour-nesting.mjs'
      - 'scripts/verify-fr88-role-free-minimum-set-separation.mjs'
      - 'tsconfig.face-reading.json'
      - 'tsconfig.face-reading.build.json'
      - 'package.json'
      - 'package-lock.json'
      - 'eslint.config.mjs'
      - '.github/workflows/face-reading-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  saju-existing-engine-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check

  face-reading-parity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migrated Saju target
        uses: actions/checkout@v4
        with:
          path: target

      - name: Checkout frozen MyeongHa source
        uses: actions/checkout@v4
        with:
          repository: gycha0109-beep/MyeongHa
          ref: 09fdc7839f2452bcc8022ba368b03d72b23f31dc
          path: source

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify migrated package bytes and compiler contract
        working-directory: target
        run: |
          npm ci
          npm run check:face-reading

      - name: Verify FR61 provider candidate boundary
        working-directory: target
        run: npx vitest run packages/face-reading/src/production-neutral-observation-provider-fr61.test.ts

      - name: Verify FR62 governed neutral geometry boundary
        working-directory: target
        run: npx vitest run packages/face-reading/src/governed-neutral-geometry-fr62.test.ts

      - name: Verify FR63 morphology admission boundary
        working-directory: target
        run: npx vitest run packages/face-reading/src/morphology-admission-fr63.test.ts

      - name: Verify FR64 V1 methodology admission boundary
        working-directory: target
        run: npx vitest run packages/face-reading/src/v1-methodology-admission-fr64.test.ts packages/face-reading/src/v1-methodology-admission-fr64-hardening.test.ts

      - name: Verify FR65 release-exact lips topology admission boundary
        working-directory: target
        run: npx vitest run packages/face-reading/src/mediapipe-lips-topology-admission-fr65.test.ts

      - name: Verify FR66 lips contour neutral surface boundary
        working-directory: target
        run: npx vitest run packages/face-reading/src/lips-contour-neutral-surface-fr66.test.ts

      - name: Verify FR67 lips pose-normalization requirements boundary
        working-directory: target
        run: npx vitest run packages/face-reading/src/lips-pose-normalization-requirements-fr67.test.ts

      - name: Verify FR68 release-exact transform semantics boundary
        working-directory: target
        run: npx vitest run packages/face-reading/src/mediapipe-face-geometry-transform-semantics-fr68.test.ts

      - name: Verify FR69 Web metric geometry surface gap boundary
        working-directory: target
        run: npx vitest run packages/face-reading/src/mediapipe-web-metric-geometry-gap-fr69.test.ts

      - name: Verify FR70 mouth criterion authority gap boundary
        working-directory: target
        run: npx vitest run packages/face-reading/src/five-officers-mouth-criterion-authority-gap-fr70.test.ts

      - name: Verify FR71 mouth source witness readiness boundary
        working-directory: target
        run: npx vitest run packages/face-reading/src/five-officers-mouth-source-witness-readiness-fr71.test.ts

      - name: Verify FR72 mouth direct-source candidate extension boundary
        working-directory: target
        run: npx vitest run packages/face-reading/src/five-officers-mouth-direct-source-candidate-extension-fr72.test.ts

      - name: Verify FR73 mouth indexed section anchor boundary
        working-directory: target
        run: npx vitest run packages/face-reading/src/five-officers-mouth-indexed-section-anchor-fr73.test.ts

      - name: Verify FR74 mouth scan-image acquisition readiness boundary
        working-directory: target
        run: npx vitest run packages/face-reading/src/five-officers-mouth-scan-image-acquisition-readiness-fr74.test.ts

      - name: Verify FR75 MediaPipe release-exact metric geometry admission boundary
        working-directory: target
        run: npx vitest run packages/face-reading/src/mediapipe-release-exact-metric-geometry-admission-fr75.test.ts

      - name: Verify FR76 MediaPipe screen-to-metric reimplementation boundary
        working-directory: target
        run: npx vitest run packages/face-reading/src/mediapipe-screen-to-metric-reimplementation-parity-fr76.test.ts

      - name: Verify FR76 MediaPipe exact golden parity
        working-directory: target
        run: npm run face:verify:fr76-parity

      - name: Verify FR77 governed metric geometry runtime boundary
        working-directory: target
        run: npx vitest run packages/face-reading/src/governed-metric-geometry-runtime-fr77.test.ts

      - name: Verify FR77 exact governed metric geometry runtime
        working-directory: target
        run: npm run face:verify:fr77-runtime

      - name: Verify FR78 governed metric lips surface boundary
        working-directory: target
        run: npx vitest run packages/face-reading/src/governed-metric-lips-surface-fr78.test.ts

      - name: Verify FR78 exact governed metric lips surface
        working-directory: target
        run: npm run face:verify:fr78-lips-surface

      - name: Verify FR79 pose-normalized lips geometry boundary
        working-directory: target
        run: npx vitest run packages/face-reading/src/pose-normalized-lips-geometry-fr79.test.ts

      - name: Verify FR79 exact pose-normalized lips projection
        working-directory: target
        run: npm run face:verify:fr79-pose-normalized-lips

      - name: Verify FR80 neutral mouth contour metric boundary
        working-directory: target
        run: npx vitest run packages/face-reading/src/neutral-mouth-contour-metric-fr80.test.ts

      - name: Verify FR80 exact neutral mouth contour metric
        working-directory: target
        run: npm run face:verify:fr80-neutral-mouth-metric

      - name: Verify FR81 mouth metric binding review boundary
        working-directory: target
        run: npx vitest run packages/face-reading/src/five-officers-mouth-metric-binding-review-fr81.test.ts

      - name: Verify FR82 neutral mouth relative size metric boundary
        working-directory: target
        run: npx vitest run packages/face-reading/src/neutral-mouth-relative-size-metric-fr82.test.ts

      - name: Verify FR82 exact neutral mouth relative size metric
        working-directory: target
        run: npm run face:verify:fr82-neutral-mouth-relative-size

      - name: Verify FR83 square-broad combined binding review boundary
        working-directory: target
        run: npx vitest run packages/face-reading/src/five-officers-square-broad-combined-binding-review-fr83.test.ts

      - name: Verify FR84 neutral lip-band geometry feasibility boundary
        working-directory: target
        run: npx vitest run packages/face-reading/src/neutral-lip-band-geometry-feasibility-review-fr84.test.ts packages/face-reading/src/neutral-lip-band-geometry-feasibility-review-fr84-hardening.test.ts

      - name: Verify FR85 role-free contour nesting runtime boundary
        working-directory: target
        run: npx vitest run packages/face-reading/src/role-free-lips-contour-nesting-runtime-fr85.test.ts packages/face-reading/src/role-free-lips-contour-nesting-runtime-fr85-hardening.test.ts

      - name: Verify FR85 exact role-free contour nesting runtime
        working-directory: target
        run: npm run face:verify:fr85-role-free-contour-nesting

      - name: Verify FR86 role-free cross-contour correspondence feasibility boundary
        working-directory: target
        run: npx vitest run packages/face-reading/src/role-free-cross-contour-correspondence-feasibility-review-fr86.test.ts packages/face-reading/src/role-free-cross-contour-correspondence-feasibility-review-fr86-hardening.test.ts

      - name: Verify FR88 role-free minimum set separation runtime boundary
        working-directory: target
        run: npx vitest run packages/face-reading/src/role-free-minimum-set-separation-runtime-fr88.test.ts packages/face-reading/src/role-free-minimum-set-separation-runtime-fr88-hardening.test.ts

      - name: Verify FR88 exact role-free minimum set separation runtime
        working-directory: target
        run: npm run face:verify:fr88-role-free-minimum-set-separation

      - name: Verify FR89 role-free whole-contour separation summary feasibility boundary
        working-directory: target
        run: npx vitest run packages/face-reading/src/role-free-whole-contour-separation-summary-feasibility-review-fr89.test.ts packages/face-reading/src/role-free-whole-contour-separation-summary-feasibility-review-fr89-hardening.test.ts

      - name: Verify FR90 certified arclength mean integration algorithm boundary
        working-directory: target
        run: npx vitest run packages/face-reading/src/role-free-arclength-mean-integration-algorithm-review-fr90.test.ts packages/face-reading/src/role-free-arclength-mean-integration-algorithm-review-fr90-hardening.test.ts

      - name: Verify FR91 certified arclength mean runtime numeric policy boundary
        working-directory: target
        run: npx vitest run packages/face-reading/src/certified-arclength-mean-runtime-numeric-policy-review-fr91.test.ts packages/face-reading/src/certified-arclength-mean-runtime-numeric-policy-review-fr91-hardening.test.ts

      - name: Verify FR92 certified distance-kernel roundoff feasibility boundary
        working-directory: target
        run: npx vitest run packages/face-reading/src/certified-distance-kernel-roundoff-feasibility-review-fr92.test.ts packages/face-reading/src/certified-distance-kernel-roundoff-feasibility-review-fr92-hardening.test.ts

      - name: Verify FR93 exact rational distance enclosure primitives review boundary
        working-directory: target
        run: npx vitest run packages/face-reading/src/exact-dyadic-rational-distance-enclosure-primitives-review-fr93.test.ts packages/face-reading/src/exact-dyadic-rational-distance-enclosure-primitives-review-fr93-hardening.test.ts

      - name: Verify frozen source baseline
        working-directory: source
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm run build
          ../target/node_modules/.bin/vitest run test/face-reading*.test.ts

      - name: Run exact source Face tests against migrated package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source/packages/face-reading
          ln -s "$GITHUB_WORKSPACE/target/packages/face-reading" source/packages/face-reading
          cd source
          "$GITHUB_WORKSPACE/target/node_modules/.bin/vitest" run test/face-reading*.test.ts
