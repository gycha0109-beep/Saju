name: FE011 Host-Safe Browser Preview Attempt CI

on:
  pull_request:
    paths:
      - 'packages/face-reading/src/browser-blob-preview-engine-fe010.ts'
      - 'packages/face-reading/src/browser-blob-preview-engine-fe010.test.ts'
      - 'packages/face-reading/src/host-safe-browser-preview-engine-fe011.ts'
      - 'packages/face-reading/src/host-safe-browser-preview-engine-fe011.test.ts'
      - 'packages/face-reading/src/preview-engine.ts'
      - 'packages/face-reading/src/preview-engine.test.ts'
      - 'scripts/verify-fe008-preview-engine-package.mjs'
      - 'docs/face-engine/fe011-host-safe-browser-preview-attempt.md'
      - '.github/workflows/fe011-host-safe-browser-preview-attempt-ci.yml'

permissions:
  contents: read

jobs:
  verify-fe011-host-safe-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build Face Reading package
        run: npm run face:build
      - name: Verify FE010 and FE011 host boundary
        run: npx vitest run packages/face-reading/src/browser-blob-preview-engine-fe010.test.ts packages/face-reading/src/host-safe-browser-preview-engine-fe011.test.ts packages/face-reading/src/preview-engine.test.ts
      - name: Verify package import boundary
        run: npm run face:verify:preview-package
