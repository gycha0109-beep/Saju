name: FR117 Intake Witness-Qualified Page Verification Reissue Persistence Implementation CI

on:
  pull_request:
    paths:
      - 'packages/face-reading/src/five-officers-intake-witness-qualified-page-verification-reissue-persistence-implementation-fr117.ts'
      - 'packages/face-reading/src/five-officers-intake-witness-qualified-page-verification-reissue-persistence-implementation-fr117.test.ts'
      - 'packages/face-reading/src/five-officers-intake-witness-qualified-page-verification-reissue-persistence-implementation-fr117-hardening.test.ts'
      - 'scripts/verify-fr117-intake-witness-qualified-page-verification-reissue-persistence-implementation.mjs'
      - '.github/workflows/fr117-intake-witness-qualified-page-verification-reissue-persistence-implementation-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-fr117-reissue-persistence-implementation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build Face Reading package
        run: npm run face:build
      - name: Verify FR117 persistence authority boundary
        run: npx vitest run packages/face-reading/src/five-officers-intake-witness-qualified-page-verification-reissue-persistence-implementation-fr117.test.ts packages/face-reading/src/five-officers-intake-witness-qualified-page-verification-reissue-persistence-implementation-fr117-hardening.test.ts
      - name: Verify FR117 exact persistence implementation chain
        run: node scripts/verify-fr117-intake-witness-qualified-page-verification-reissue-persistence-implementation.mjs
