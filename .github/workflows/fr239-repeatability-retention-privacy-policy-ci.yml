name: FR239 Repeatability Retention Privacy Policy CI

on:
  pull_request:
    paths:
      - 'packages/face-reading/src/observable-morphology-repeatability-retention-privacy-policy-fr239.ts'
      - 'packages/face-reading/src/observable-morphology-repeatability-retention-privacy-policy-fr239.test.ts'
      - 'research/face-reading/fr239-repeatability-retention-privacy-policy.md'
      - '.github/workflows/fr239-repeatability-retention-privacy-policy-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'packages/face-reading/src/observable-morphology-repeatability-retention-privacy-policy-fr239.ts'
      - 'packages/face-reading/src/observable-morphology-repeatability-retention-privacy-policy-fr239.test.ts'
      - 'research/face-reading/fr239-repeatability-retention-privacy-policy.md'
      - '.github/workflows/fr239-repeatability-retention-privacy-policy-ci.yml'

jobs:
  fr239-repeatability-retention-privacy-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run face:build
      - run: npx vitest run packages/face-reading/src/observable-morphology-repeatability-retention-privacy-policy-fr239.test.ts
