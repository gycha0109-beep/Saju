name: FR221 Persisted Candidate Provenance CI

on:
  pull_request:
    paths:
      - 'packages/face-reading/src/observable-morphology-validation-fr218.ts'
      - 'packages/face-reading/src/observable-morphology-persisted-candidate-provenance-fr221.ts'
      - 'packages/face-reading/src/observable-morphology-persisted-candidate-provenance-fr221.test.ts'
      - 'scripts/verify-fr221-persisted-candidate-provenance.mjs'
      - 'research/face-reading/fr221-persisted-candidate-provenance.md'
      - '.github/workflows/fr221-persisted-candidate-provenance-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'packages/face-reading/src/observable-morphology-validation-fr218.ts'
      - 'packages/face-reading/src/observable-morphology-persisted-candidate-provenance-fr221.ts'
      - 'packages/face-reading/src/observable-morphology-persisted-candidate-provenance-fr221.test.ts'
      - 'scripts/verify-fr221-persisted-candidate-provenance.mjs'
      - 'research/face-reading/fr221-persisted-candidate-provenance.md'
      - '.github/workflows/fr221-persisted-candidate-provenance-ci.yml'

permissions:
  contents: read

jobs:
  verify-fr221-persisted-candidate-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build Face Reading package
        run: npm run face:build
      - name: Verify FR221 persisted candidate provenance contract
        run: npx vitest run packages/face-reading/src/observable-morphology-persisted-candidate-provenance-fr221.test.ts
      - name: Verify FR221 persisted candidate provenance CLI round-trip
        run: FR221_SMOKE=1 node scripts/verify-fr221-persisted-candidate-provenance.mjs
