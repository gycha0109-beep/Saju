name: Yuanhai Direct Scan Workbench

on:
  pull_request:
    paths:
      - '.github/workflows/research-yuanhai-direct-scan-workbench.yml'
      - 'tmp/research/yuanhai-direct-scan/**'

permissions:
  contents: write

concurrency:
  group: yuanhai-direct-scan-workbench-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Render exact NLC page 17 evidence
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Install page renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils python3-pil tesseract-ocr tesseract-ocr-chi-tra

      - name: Fetch and verify registered scan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/yuanhai-scan
          api_json=/tmp/yuanhai-scan/commons-imageinfo.json
          curl --fail --silent --show-error --get \
            'https://commons.wikimedia.org/w/api.php' \
            --data-urlencode 'action=query' \
            --data-urlencode 'format=json' \
            --data-urlencode 'prop=imageinfo' \
            --data-urlencode 'iiprop=url|sha1|size' \
            --data-urlencode 'titles=File:NLC892-2642-210318 刻京臺增補淵海子平大全 第4冊.pdf' \
            --output "$api_json"
          registered_url="$(jq -r '.query.pages[]?.imageinfo[0]?.url // empty' "$api_json")"
          api_sha1="$(jq -r '.query.pages[]?.imageinfo[0]?.sha1 // empty' "$api_json")"
          test -n "$registered_url"
          test "$api_sha1" = '9f6098878cda071f5e1d3cbb0502cb65dfe17eea'
          curl --fail --location --silent --show-error "$registered_url" \
            --output /tmp/yuanhai-scan/volume4.pdf
          actual_sha1="$(sha1sum /tmp/yuanhai-scan/volume4.pdf | awk '{print $1}')"
          test "$actual_sha1" = "$api_sha1"
          echo "registered_scan_sha1=$actual_sha1"

      - name: Render and split exact digital page 17
        shell: bash
        run: |
          set -euo pipefail
          out='tmp/research/yuanhai-direct-scan'
          mkdir -p "$out"
          pdftoppm \
            -f 17 -l 17 -singlefile \
            -r 600 -png \
            /tmp/yuanhai-scan/volume4.pdf \
            "$out/page17-full"
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageEnhance, ImageFilter

          out = Path('tmp/research/yuanhai-direct-scan')
          source = Image.open(out / 'page17-full.png').convert('L')
          w, h = source.size
          mid = w // 2

          crops = {
              'page17-right-leaf.png': (mid, 0, w, h),
              'page17-left-leaf.png': (0, 0, mid, h),
              'page17-right-leaf-left-half.png': (mid, 0, mid + (w-mid)//2, h),
              'page17-right-leaf-right-half.png': (mid + (w-mid)//2, 0, w, h),
              'page17-left-leaf-right-half.png': (mid//2, 0, mid, h),
          }

          for name, box in crops.items():
              crop = source.crop(box)
              crop = ImageEnhance.Contrast(crop).enhance(1.35)
              crop = crop.filter(ImageFilter.SHARPEN)
              crop.save(out / name, optimize=True)

          (out / 'render-metadata.txt').write_text(
              f'source_sha1=9f6098878cda071f5e1d3cbb0502cb65dfe17eea\n'
              f'digital_page=17\n'
              f'render_dpi=600\n'
              f'full_width={w}\n'
              f'full_height={h}\n'
              f'authority=workbench_visual_evidence_only\n',
              encoding='utf-8',
          )
          PY

      - name: Render locator pages and generate OCR locator surfaces
        shell: bash
        run: |
          set -euo pipefail
          out='tmp/research/yuanhai-direct-scan'
          mkdir -p "$out/locator"
          for page in 13 14 15 16 17; do
            pdftoppm \
              -f "$page" -l "$page" -singlefile \
              -r 400 -gray -png \
              /tmp/yuanhai-scan/volume4.pdf \
              "$out/locator/page$(printf '%02d' "$page")"
            tesseract \
              "$out/locator/page$(printf '%02d' "$page").png" \
              "$out/locator/page$(printf '%02d' "$page")-psm5" \
              -l chi_tra --psm 5 2>/dev/null || true
            tesseract \
              "$out/locator/page$(printf '%02d' "$page").png" \
              stdout -l chi_tra --psm 5 tsv 2>/dev/null \
              > "$out/locator/page$(printf '%02d' "$page")-psm5.tsv" || true
          done

          {
            echo '=== target-oriented OCR locator report ==='
            for page in 13 14 15 16 17; do
              txt="$out/locator/page$(printf '%02d' "$page")-psm5.txt"
              echo "--- digital page $page ---"
              if [ -f "$txt" ]; then
                grep -n -E '財|官|煞|印|比|劫|羊|刃|財格|印綬|生官|化為' "$txt" || true
              fi
            done
          } > "$out/locator/target-report.txt"

      - name: Generate compact visual tiles for direct glyph review
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageEnhance, ImageFilter
          import base64

          out = Path('tmp/research/yuanhai-direct-scan')
          tile_dir = out / 'tiles'
          tile_dir.mkdir(parents=True, exist_ok=True)

          source = Image.open(out / 'page17-full.png').convert('L')
          target_w = 1200
          target_h = round(source.height * target_w / source.width)
          scaled = source.resize((target_w, target_h), Image.Resampling.LANCZOS)
          scaled = ImageEnhance.Contrast(scaled).enhance(1.45)
          scaled = scaled.filter(ImageFilter.SHARPEN)
          bilevel = scaled.point(lambda p: 255 if p > 178 else 0, mode='1')

          cols, rows = 4, 2
          manifest = []
          for row in range(rows):
              for col in range(cols):
                  x0 = round(col * target_w / cols)
                  x1 = round((col + 1) * target_w / cols)
                  y0 = round(row * target_h / rows)
                  y1 = round((row + 1) * target_h / rows)
                  tile = bilevel.crop((x0, y0, x1, y1))
                  name = f'page17-r{row+1}c{col+1}'
                  png_path = tile_dir / f'{name}.png'
                  b64_path = tile_dir / f'{name}.b64'
                  tile.save(png_path, optimize=True)
                  payload = base64.b64encode(png_path.read_bytes()).decode('ascii')
                  b64_path.write_text(payload, encoding='ascii')
                  manifest.append(
                      f'{name} x={x0}:{x1} y={y0}:{y1} '
                      f'png_bytes={png_path.stat().st_size} b64_chars={len(payload)}'
                  )

          (tile_dir / 'manifest.txt').write_text(
              '\n'.join([
                  f'source=page17-full.png',
                  f'scaled_width={target_w}',
                  f'scaled_height={target_h}',
                  f'grid={rows}x{cols}',
                  *manifest,
                  '',
              ]),
              encoding='utf-8',
          )
          PY

      - name: Commit rendered workbench evidence
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- tmp/research/yuanhai-direct-scan)" ]; then
            echo 'Evidence already committed; no new commit required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/research/yuanhai-direct-scan
          git commit -m 'chore(research): render Yuanhai page 17 workbench evidence'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
