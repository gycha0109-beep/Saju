name: Relationship Spouse T8 Kim Sanghan Publisher Stage4

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/probe-relationship-spouse-t8-kim-sanghan-publisher-stage4.py'
      - '.github/workflows/relationship-spouse-t8-kim-sanghan-publisher-stage4.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-publisher-stage4:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Reproduce exact public publisher form and probe target PDF
        run: python3 scripts/probe-relationship-spouse-t8-kim-sanghan-publisher-stage4.py
      - name: Upload bounded stage4 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relationship-spouse-t8-kim-sanghan-publisher-stage4
          path: acquisition-kim-sanghan-publisher-stage4/**
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0
