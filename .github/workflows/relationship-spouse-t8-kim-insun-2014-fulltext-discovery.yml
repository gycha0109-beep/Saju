name: Relationship Spouse T8 Kim Insun 2014 Fulltext Discovery

on:
  pull_request:
    paths:
      - 'scripts/acquire-relationship-spouse-t8-kim-insun-2014-public-fulltext.py'
      - '.github/workflows/relationship-spouse-t8-kim-insun-2014-fulltext-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire-current-public-fulltext:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded PDF reader
        run: python -m pip install --disable-pip-version-check pypdf==6.0.0
      - name: Resolve exact title and follow current public RISS route
        run: python scripts/acquire-relationship-spouse-t8-kim-insun-2014-public-fulltext.py
      - name: Print compatibility semantic contexts when body exists
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('acquisition-kim-insun-2014/kim-insun-2014.txt')
          if not p.exists():
              print('No complete body acquired; semantic review intentionally skipped.')
              raise SystemExit(0)
          t=p.read_text(encoding='utf-8')
          for term in ['배우자','부부','궁합','궁합론','비교연구','쟁점','단식','복식','일간','일지','궁위','육친','십신','관성','재성','남성','여성','남자','여자','남녀']:
              print(f'\n### TERM {term}')
              n=0
              for m in re.finditer(re.escape(term),t,re.I):
                  print(re.sub(r'\s+',' ',t[max(0,m.start()-500):min(len(t),m.end()+1500)]))
                  n+=1
                  if n>=15: break
              print('COUNT_SHOWN',n)
          PY
      - name: Enforce exact identity resolution and no-bypass boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('acquisition-kim-insun-2014/report.json').read_text(encoding='utf-8'))
          c=j['candidate']
          assert c['author']=='김인순' and c['year']==2014
          assert '宮合論' in c['title'] and '比較硏究' in c['title']
          assert c['institution']=='국제뇌교육종합대학원대학교 국학과'
          assert isinstance(c['control'],str) and len(c['control'])>20
          assert j['searchDiscovery']['resolutionRule']=='EXACT_TITLE_AUTHOR_YEAR_FROM_SITE_AUTHORED_SEARCH_RESULT_LINK_ONLY'
          assert j['formTuple']['control_no']==c['control']
          assert isinstance(j['formTuple']['p_mat_type'],str) and j['formTuple']['p_mat_type']
          assert j['guessedOpaqueIdentifierCount']==0
          assert not j['loginBypass'] and not j['institutionAuthBypass'] and not j['paywallBypass']
          assert not j['drmRequestExecuted'] and not j['decryptionActionExecuted']
          assert j['tlsVerificationDisabled'] is False and j['crossSourceSemanticStitching'] is False
          if j['semanticDisposition']=='DIRECT_BODY_ACQUIRED_REQUIRES_RENDER_FIRST_REVIEW':
              assert j['fullLengthPdfAcquired'] is True
              assert j['pdfInspection']['pages']>=80 and j['pdfInspection']['encrypted'] is False
          else:
              assert j['semanticDisposition']=='PUBLIC_ACCESS_BOUNDARY_ONLY_NO_DIRECT_BODY_DECISION'
          print('Kim Insun 2014 exact-title RISS/no-bypass public route verified')
          print('resolved control=',c['control'])
          print('observed RISS ID=',c['rissId'])
          print('semanticDisposition=',j['semanticDisposition'])
          PY
      - name: Upload bounded acquisition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kim-insun-2014-public-route-evidence
          path: |
            acquisition-kim-insun-2014/report.json
            acquisition-kim-insun-2014/riss-search-*.html
            acquisition-kim-insun-2014/riss-detail.html
            acquisition-kim-insun-2014/riss-script-*.txt
            acquisition-kim-insun-2014/riss-fulltext-dispatch-response.html
            acquisition-kim-insun-2014/dcollection-entry.html
            acquisition-kim-insun-2014/dcollection-follow-*.html
            acquisition-kim-insun-2014/kim-insun-2014.pdf
            acquisition-kim-insun-2014/kim-insun-2014.txt
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0
