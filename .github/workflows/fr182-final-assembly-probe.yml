name: FR182 Final Blob Staging Probe

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/fr182-final-assembly-probe.yml'
      - '.fr182-assembly/**'

permissions:
  contents: write

jobs:
  stage-validated-fr182-blobs:
    if: github.head_ref == 'research/fr182-final-assembly-probe'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Verify exact fresh main and absent staging/final branches
        shell: bash
        env:
          EXPECTED_MAIN_SHA: a2313b10acfaa4e6186cb11beb851c829ad073a0
          FINAL_BRANCH: research/fr182-daruma-eye-exact-scan-page-pinning
          STAGING_BRANCH: research/fr182-final-staging
          PROBE_BRANCH: research/fr182-final-assembly-probe
        run: |
          set -euo pipefail
          git fetch origin \
            "main:refs/remotes/origin/main" \
            "$PROBE_BRANCH:refs/remotes/origin/$PROBE_BRANCH"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN_SHA"
          for branch in "$FINAL_BRANCH" "$STAGING_BRANCH"; do
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              echo "Unexpected existing branch: $branch" >&2
              exit 1
            fi
          done

      - name: Assemble four validated implementation blobs from fresh main
        shell: bash
        env:
          EXPECTED_MAIN_SHA: a2313b10acfaa4e6186cb11beb851c829ad073a0
          PROBE_BRANCH: research/fr182-final-assembly-probe
          STAGING_BRANCH: research/fr182-final-staging
        run: |
          set -euo pipefail
          git checkout --detach "$EXPECTED_MAIN_SHA"
          git switch -c "$STAGING_BRANCH"
          mkdir -p packages/face-reading/evidence/fr182 packages/face-reading/src research/face-reading
          git show "refs/remotes/origin/$PROBE_BRANCH:.fr182-assembly/eye-pair-fr176-daruma-eye-exact-scan-page-pinning-fr182.ts" \
            > packages/face-reading/src/eye-pair-fr176-daruma-eye-exact-scan-page-pinning-fr182.ts
          sed -i "s#'../packages/face-reading/src/#'./#g" \
            packages/face-reading/src/eye-pair-fr176-daruma-eye-exact-scan-page-pinning-fr182.ts
          git show "refs/remotes/origin/$PROBE_BRANCH:.fr182-assembly/eye-pair-fr176-daruma-eye-exact-scan-page-pinning-fr182.test.ts" \
            > packages/face-reading/src/eye-pair-fr176-daruma-eye-exact-scan-page-pinning-fr182.test.ts
          git show "refs/remotes/origin/$PROBE_BRANCH:.fr182-assembly/fr182-fr176-daruma-eye-exact-scan-page-pinning.md" \
            > research/face-reading/fr182-fr176-daruma-eye-exact-scan-page-pinning.md

      - name: Recreate and verify immutable page-146 evidence
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          mkdir -p /tmp/fr182-final
          curl --fail --location --retry 3 --output /tmp/fr182-final/source.pdf \
            'https://upload.wikimedia.org/wikipedia/commons/2/22/NLC416-13jh001662-59167_%E7%A5%9E%E7%9B%B8%E5%85%A8%E7%B7%A8.pdf'
          printf '%s  %s\n' \
            '94167d8d19d47525535b39e18a20c6b315a3a30751c2063bc2492760f1d927af' \
            '/tmp/fr182-final/source.pdf' | sha256sum --check --strict
          test "$(pdfinfo /tmp/fr182-final/source.pdf | awk '/^Pages:/ {print $2}')" = '576'
          pdftoppm -f 146 -l 146 -r 320 -png -singlefile \
            /tmp/fr182-final/source.pdf \
            packages/face-reading/evidence/fr182/nlc-1925-page-146
          printf '%s  %s\n' \
            '522e5cc94a1fbd885a298cedd8aea94e7a95dd4877d93afa10129e707e8059c7' \
            'packages/face-reading/evidence/fr182/nlc-1925-page-146.png' | sha256sum --check --strict

      - name: Validate candidate before staging commit
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run face:build
          npx vitest run packages/face-reading/src/eye-pair-fr176-daruma-eye-exact-scan-page-pinning-fr182.test.ts

      - name: Push only four validated blobs to temporary staging branch
        shell: bash
        env:
          EXPECTED_MAIN_SHA: a2313b10acfaa4e6186cb11beb851c829ad073a0
          STAGING_BRANCH: research/fr182-final-staging
        run: |
          set -euo pipefail
          git config user.name 'gycha0109-beep'
          git config user.email 'gycha0109@gmail.com'
          git add \
            packages/face-reading/evidence/fr182/nlc-1925-page-146.png \
            packages/face-reading/src/eye-pair-fr176-daruma-eye-exact-scan-page-pinning-fr182.ts \
            packages/face-reading/src/eye-pair-fr176-daruma-eye-exact-scan-page-pinning-fr182.test.ts \
            research/face-reading/fr182-fr176-daruma-eye-exact-scan-page-pinning.md
          cat > /tmp/fr182-expected-files.txt <<'EOF'
          packages/face-reading/evidence/fr182/nlc-1925-page-146.png
          packages/face-reading/src/eye-pair-fr176-daruma-eye-exact-scan-page-pinning-fr182.test.ts
          packages/face-reading/src/eye-pair-fr176-daruma-eye-exact-scan-page-pinning-fr182.ts
          research/face-reading/fr182-fr176-daruma-eye-exact-scan-page-pinning.md
          EOF
          sed -i 's/^          //' /tmp/fr182-expected-files.txt
          git diff --cached --name-only | sort > /tmp/fr182-staged-files.txt
          diff -u /tmp/fr182-expected-files.txt /tmp/fr182-staged-files.txt
          git commit -m 'chore(fr182): stage validated final blobs'
          test "$(git rev-parse HEAD^)" = "$EXPECTED_MAIN_SHA"
          test "$(git rev-list --count "$EXPECTED_MAIN_SHA"..HEAD)" = '1'
          test "$(git diff --name-only "$EXPECTED_MAIN_SHA"..HEAD | wc -l | tr -d ' ')" = '4'
          git push origin "HEAD:refs/heads/$STAGING_BRANCH"
