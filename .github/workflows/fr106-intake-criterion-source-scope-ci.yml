name: FR106 Intake Criterion Source Scope CI

on:
  pull_request:
    paths:
      - 'packages/face-reading/src/five-officers-intake-criterion-source-scope-review-fr106.ts'
      - 'packages/face-reading/src/five-officers-intake-criterion-source-scope-review-fr106.test.ts'
      - 'packages/face-reading/src/five-officers-intake-criterion-source-scope-review-fr106-hardening.test.ts'
      - 'scripts/verify-fr106-intake-criterion-source-scope.mjs'
      - '.github/workflows/fr106-intake-criterion-source-scope-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-fr106-intake-criterion-scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build Face Reading package
        run: npm run face:build
      - name: Verify FR106 authority boundary
        run: npx vitest run packages/face-reading/src/five-officers-intake-criterion-source-scope-review-fr106.test.ts packages/face-reading/src/five-officers-intake-criterion-source-scope-review-fr106-hardening.test.ts
      - name: Verify FR106 exact criterion source-scope chain
        run: node scripts/verify-fr106-intake-criterion-source-scope.mjs
