name: Relationship Spouse T8 Na Hyukjin 2017 Fulltext Acquisition

on:
  pull_request:
    paths:
      - 'scripts/acquire-relationship-spouse-t8-na-hyukjin-2017-public-routes.py'
      - 'scripts/probe-relationship-spouse-t8-na-hyukjin-2017-public-dispatchers.py'
      - '.github/workflows/relationship-spouse-t8-na-hyukjin-2017-fulltext-acquisition.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire-public-fulltext:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Probe exact public RISS and NANET target routes
        run: python scripts/acquire-relationship-spouse-t8-na-hyukjin-2017-public-routes.py

      - name: Reproduce site-authored RISS original check and anonymous NANET viewer bootstrap
        run: python scripts/probe-relationship-spouse-t8-na-hyukjin-2017-public-dispatchers.py

      - name: Print bounded acquisition evidence
        if: always()
        run: |
          test -f acquisition-na-hyukjin-2017/summary.txt && cat acquisition-na-hyukjin-2017/summary.txt || true
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ('report.json', 'dispatcher-probe.json'):
              p = Path('acquisition-na-hyukjin-2017') / name
              if not p.exists():
                  continue
              j = json.loads(p.read_text())
              if name == 'report.json':
                  out = {
                      'candidate': j.get('candidate'),
                      'riss': {
                          'identityObserved': j.get('riss', {}).get('identityObserved'),
                          'docControlNo': j.get('riss', {}).get('docControlNo'),
                          'docType': j.get('riss', {}).get('docType'),
                      },
                      'nanet': {
                          'identityObserved': j.get('nanet', {}).get('identityObserved'),
                          'controlObserved': j.get('nanet', {}).get('controlObserved'),
                      },
                      'guessedOpaqueIdentifierCount': j.get('guessedOpaqueIdentifierCount'),
                      'contentActionExecuted': j.get('contentActionExecuted'),
                      'fullLengthPdfAcquired': j.get('fullLengthPdfAcquired'),
                  }
              else:
                  out = {
                      'rissOriginalCheck': j.get('riss', {}).get('originalCheck'),
                      'rissOriginalCheckBody': j.get('riss', {}).get('originalCheckBody'),
                      'nanetTargetViewCallObserved': j.get('nanet', {}).get('targetViewCallObserved'),
                      'nanetTargetDownloadCallObserved': j.get('nanet', {}).get('targetDownloadCallObserved'),
                      'nanetViewPublicContractObserved': j.get('nanet', {}).get('viewPublicContractObserved'),
                      'nanetDownloadLoginGateObserved': j.get('nanet', {}).get('downloadLoginGateObserved'),
                      'nanetViewer': j.get('nanet', {}).get('viewer'),
                      'nanetViewerNextHop': j.get('nanet', {}).get('viewerNextHop'),
                      'nanetViewerLoginBoundary': j.get('nanet', {}).get('viewerLoginBoundary'),
                      'nanetViewerInstitutionBoundary': j.get('nanet', {}).get('viewerInstitutionBoundary'),
                      'nanetViewerDrmSignal': j.get('nanet', {}).get('viewerDrmSignal'),
                      'guessedOpaqueIdentifierCount': j.get('guessedOpaqueIdentifierCount'),
                      'downloadActionExecuted': j.get('downloadActionExecuted'),
                  }
              print(name)
              print(json.dumps(out, ensure_ascii=False, indent=2))
          PY

      - name: Enforce identity and no-guess boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          j = json.loads(Path('acquisition-na-hyukjin-2017/report.json').read_text())
          c = j['candidate']
          assert c['author'] == '나혁진'
          assert c['year'] == 2017
          assert c['rissId'] == 'T14398372'
          assert c['nanetControl'] == 'KDMT1201802345'
          assert j['riss']['identityObserved'] is True
          assert j['nanet']['identityObserved'] is True
          assert j['guessedOpaqueIdentifierCount'] == 0
          assert j['contentActionExecuted'] is False

          d = json.loads(Path('acquisition-na-hyukjin-2017/dispatcher-probe.json').read_text())
          assert d['riss']['originalCheck']['status'] == 200
          assert d['nanet']['targetViewCallObserved'] is True
          assert d['nanet']['targetDownloadCallObserved'] is True
          assert d['nanet']['viewPublicContractObserved'] is True
          assert d['nanet']['downloadLoginGateObserved'] is True
          assert d['nanet']['viewer']['status'] == 200
          assert d['guessedOpaqueIdentifierCount'] == 0
          assert d['downloadActionExecuted'] is False
          print('Na Hyukjin 2017 public dispatcher/no-guess boundary verified')
          PY

      - name: Upload bounded evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: na-hyukjin-2017-bounded-fulltext-evidence
          path: |
            acquisition-na-hyukjin-2017/report.json
            acquisition-na-hyukjin-2017/dispatcher-probe.json
            acquisition-na-hyukjin-2017/summary.txt
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0
