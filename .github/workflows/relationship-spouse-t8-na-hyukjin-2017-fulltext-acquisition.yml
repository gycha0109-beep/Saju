name: Relationship Spouse T8 Na Hyukjin 2017 Fulltext Acquisition

on:
  pull_request:
    paths:
      - 'scripts/acquire-relationship-spouse-t8-na-hyukjin-2017-public-routes.py'
      - 'scripts/probe-relationship-spouse-t8-na-hyukjin-2017-public-dispatchers.py'
      - 'scripts/probe-relationship-spouse-t8-na-hyukjin-2017-nanet-viewer-fallback.py'
      - 'scripts/probe-relationship-spouse-t8-na-hyukjin-2017-nanet-docviewer.py'
      - '.github/workflows/relationship-spouse-t8-na-hyukjin-2017-fulltext-acquisition.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire-public-fulltext:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Probe exact public RISS and NANET target routes
        run: python scripts/acquire-relationship-spouse-t8-na-hyukjin-2017-public-routes.py

      - name: Reproduce RISS original check and exact NANET target-button evidence
        run: python scripts/probe-relationship-spouse-t8-na-hyukjin-2017-public-dispatchers.py

      - name: Verify current NANET static dispatcher and bounded anonymous viewer fallback
        run: python scripts/probe-relationship-spouse-t8-na-hyukjin-2017-nanet-viewer-fallback.py

      - name: Inspect exact public NANET docviewer contract without replaying assets
        run: python scripts/probe-relationship-spouse-t8-na-hyukjin-2017-nanet-docviewer.py

      - name: Print bounded acquisition evidence
        if: always()
        run: |
          test -f acquisition-na-hyukjin-2017/summary.txt && cat acquisition-na-hyukjin-2017/summary.txt || true
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ('report.json', 'dispatcher-probe.json', 'nanet-viewer-fallback.json', 'nanet-docviewer.json'):
              p = Path('acquisition-na-hyukjin-2017') / name
              if not p.exists():
                  continue
              j = json.loads(p.read_text())
              if name == 'report.json':
                  out = {
                      'candidate': j.get('candidate'),
                      'riss': {
                          'identityObserved': j.get('riss', {}).get('identityObserved'),
                          'docControlNo': j.get('riss', {}).get('docControlNo'),
                          'docType': j.get('riss', {}).get('docType'),
                      },
                      'nanet': {
                          'identityObserved': j.get('nanet', {}).get('identityObserved'),
                          'controlObserved': j.get('nanet', {}).get('controlObserved'),
                          'surfaceUnavailable': j.get('nanet', {}).get('surfaceUnavailable'),
                          'targetViewCallObserved': j.get('nanet', {}).get('targetViewCallObserved'),
                          'targetDownloadCallObserved': j.get('nanet', {}).get('targetDownloadCallObserved'),
                      },
                      'guessedOpaqueIdentifierCount': j.get('guessedOpaqueIdentifierCount'),
                      'contentActionExecuted': j.get('contentActionExecuted'),
                      'fullLengthPdfAcquired': j.get('fullLengthPdfAcquired'),
                  }
              elif name == 'dispatcher-probe.json':
                  out = {
                      'rissOriginalCheck': j.get('riss', {}).get('originalCheck'),
                      'rissOriginalCheckBody': j.get('riss', {}).get('originalCheckBody'),
                      'nanetSurfaceUnavailable': j.get('nanet', {}).get('surfaceUnavailable'),
                      'nanetTargetViewCallObserved': j.get('nanet', {}).get('targetViewCallObserved'),
                      'nanetTargetDownloadCallObserved': j.get('nanet', {}).get('targetDownloadCallObserved'),
                      'guessedOpaqueIdentifierCount': j.get('guessedOpaqueIdentifierCount'),
                      'downloadActionExecuted': j.get('downloadActionExecuted'),
                  }
              elif name == 'nanet-viewer-fallback.json':
                  out = {
                      'static': j.get('static'),
                      'viewer': j.get('viewer'),
                      'guessedOpaqueIdentifierCount': j.get('guessedOpaqueIdentifierCount'),
                      'downloadActionExecuted': j.get('downloadActionExecuted'),
                  }
              else:
                  out = {
                      'siteAuthoredDocviewerUrl': j.get('siteAuthoredDocviewerUrl'),
                      'viewerSurface': j.get('viewerSurface'),
                      'scriptFetchSummary': j.get('scriptFetchSummary'),
                      'accessBoundary': j.get('accessBoundary'),
                      'scriptAccessBoundary': j.get('scriptAccessBoundary'),
                      'focusedContexts': j.get('focusedContexts'),
                      'nextHopDisposition': j.get('nextHopDisposition'),
                      'guessedOpaqueIdentifierCount': j.get('guessedOpaqueIdentifierCount'),
                      'contentAssetActionExecuted': j.get('contentAssetActionExecuted'),
                  }
              print(name)
              print(json.dumps(out, ensure_ascii=False, indent=2))
          PY

      - name: Enforce identity and no-guess boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          j = json.loads(Path('acquisition-na-hyukjin-2017/report.json').read_text())
          c = j['candidate']
          assert c['author'] == '나혁진'
          assert c['year'] == 2017
          assert c['rissId'] == 'T14398372'
          assert c['nanetControl'] == 'KDMT1201802345'
          assert j['riss']['identityObserved'] is True
          assert j['riss']['docControlNo'] == '14398372'
          assert j['riss']['docType'] == 'T'
          assert j['guessedOpaqueIdentifierCount'] == 0
          assert j['contentActionExecuted'] is False
          if not j['nanet'].get('surfaceUnavailable'):
              assert j['nanet']['identityObserved'] is True
              assert j['nanet']['controlObserved'] is True
              assert j['nanet']['targetViewCallObserved'] is True
              assert j['nanet']['targetDownloadCallObserved'] is True

          d = json.loads(Path('acquisition-na-hyukjin-2017/dispatcher-probe.json').read_text())
          assert d['riss']['originalCheck']['status'] == 200
          assert d['riss']['originalCheckBody'] == '{"flag":"T"}'
          if not d['nanet'].get('surfaceUnavailable'):
              assert d['nanet']['targetViewCallObserved'] is True
              assert d['nanet']['targetDownloadCallObserved'] is True
          assert d['guessedOpaqueIdentifierCount'] == 0
          assert d['downloadActionExecuted'] is False

          f = json.loads(Path('acquisition-na-hyukjin-2017/nanet-viewer-fallback.json').read_text())
          assert f['targetControl'] == 'KDMT1201802345'
          assert f['static']['meta']['status'] == 200
          assert f['static']['viewContractObserved'] is True
          assert f['static']['downloadLoginGateObserved'] is True
          if not f['viewer'].get('surfaceUnavailable'):
              assert f['viewer']['meta']['status'] == 200
          assert f['guessedOpaqueIdentifierCount'] == 0
          assert f['downloadActionExecuted'] is False

          v = json.loads(Path('acquisition-na-hyukjin-2017/nanet-docviewer.json').read_text())
          assert v['targetControl'] == 'KDMT1201802345'
          assert v['guessedOpaqueIdentifierCount'] == 0
          assert v['contentAssetActionExecuted'] is False
          if v.get('siteAuthoredDocviewerUrl') and v.get('viewerSurfaceAvailable'):
              assert v['viewerSurface']['status'] == 200
          print('Na Hyukjin 2017 exact public acquisition boundary verified')
          PY

      - name: Upload bounded evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: na-hyukjin-2017-bounded-fulltext-evidence
          path: |
            acquisition-na-hyukjin-2017/report.json
            acquisition-na-hyukjin-2017/dispatcher-probe.json
            acquisition-na-hyukjin-2017/nanet-viewer-fallback.json
            acquisition-na-hyukjin-2017/nanet-docviewer.json
            acquisition-na-hyukjin-2017/summary.txt
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0
