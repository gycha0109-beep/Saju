name: FR235 External Assurance Route Qualification CI

on:
  pull_request:
    paths:
      - 'packages/face-reading/src/observable-morphology-external-assurance-route-qualification-fr235.ts'
      - 'packages/face-reading/src/observable-morphology-external-assurance-route-qualification-fr235.test.ts'
      - 'research/face-reading/fr235-external-assurance-route-qualification.md'
      - '.github/workflows/fr235-external-assurance-route-qualification-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'packages/face-reading/src/observable-morphology-external-assurance-route-qualification-fr235.ts'
      - 'packages/face-reading/src/observable-morphology-external-assurance-route-qualification-fr235.test.ts'
      - 'research/face-reading/fr235-external-assurance-route-qualification.md'
      - '.github/workflows/fr235-external-assurance-route-qualification-ci.yml'

jobs:
  fr235-external-assurance-route-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run face:build
      - run: npx vitest run packages/face-reading/src/observable-morphology-external-assurance-route-qualification-fr235.test.ts
