<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FR219 Blind Morphology Review</title>
  <style>
    :root { font-family: system-ui, sans-serif; color-scheme: light; }
    body { margin: 0; background: #f5f6f7; color: #111; }
    main { max-width: 760px; margin: 0 auto; padding: 28px 18px 56px; }
    .card { background: white; border: 1px solid #ddd; border-radius: 16px; padding: 20px; box-shadow: 0 3px 16px rgba(0,0,0,.05); }
    h1 { font-size: 20px; margin: 0 0 8px; }
    .note { color: #555; font-size: 14px; line-height: 1.5; margin-bottom: 18px; }
    .progress { font-size: 13px; color: #666; margin-bottom: 12px; }
    .image-wrap { background: #eee; border-radius: 12px; overflow: hidden; display:flex; justify-content:center; min-height: 280px; }
    img { display:block; max-width:100%; max-height: 620px; object-fit:contain; }
    .prompt { font-size: 18px; font-weight: 650; margin: 18px 0 14px; }
    .labels { display:grid; gap:10px; }
    button { border:1px solid #ccc; background:white; border-radius:10px; padding:13px 14px; text-align:left; font-size:15px; cursor:pointer; }
    button:hover { background:#f2f3f5; }
    button:disabled { opacity:.55; cursor:not-allowed; }
    .status { margin-top:14px; min-height:24px; color:#444; font-size:14px; }
    .done { text-align:center; padding: 44px 12px; }
  </style>
</head>
<body>
<main>
  <div class="card">
    <h1>눈꼬리 방향 블라인드 관찰</h1>
    <div class="note">제시된 이미지만 보고 판단하세요. 다른 사람의 답이나 측정값은 제공되지 않습니다. 이미지에서 판단하기 어렵다면 반드시 “판단하기 어려움”을 선택하세요.</div>
    <div id="app">불러오는 중…</div>
  </div>
</main>
<script type="module" src="/review.mjs"></script>
</body>
</html>
